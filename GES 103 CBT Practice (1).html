<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GES 103 CBT Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen exam console. Navy title bar with timer, question panel left, numbered palette right; setup and results reuse the same panels. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#17212e; --muted:#566375; --line:#d3dae4;
  --brand:#17365d; --brand-ink:#ffffff; --accent:#1f5fbf; --accent-tint:#e3edfb;
  --good:#1f7a4d; --good-tint:#e1f3e9; --bad:#b3261e; --bad-tint:#fbe7e5; --flag:#a8650a; --flag-tint:#fbefd9;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --panel:#172130; --ink:#e6ebf2; --muted:#98a5b8; --line:#2b394d;
  --brand:#0c2340; --brand-ink:#e6ebf2; --accent:#6aa3f5; --accent-tint:#1c3050;
  --good:#52c78a; --good-tint:#16301f; --bad:#f0766e; --bad-tint:#3a1a19; --flag:#e8a649; --flag-tint:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#172130; --ink:#e6ebf2; --muted:#98a5b8; --line:#2b394d;
  --brand:#0c2340; --brand-ink:#e6ebf2; --accent:#6aa3f5; --accent-tint:#1c3050;
  --good:#52c78a; --good-tint:#16301f; --bad:#f0766e; --bad-tint:#3a1a19; --flag:#e8a649; --flag-tint:#3a2a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.bar .title{font-weight:600;letter-spacing:.01em;margin-right:auto}
.bar .title small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
.clock{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;padding:2px 10px;border:1px solid currentColor;border-radius:6px}
.clock.low{background:var(--bad);border-color:var(--bad);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar .btn{background:transparent;color:inherit;border-color:currentColor}
.bar .btn.primary{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
/* setup */
.setup{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media(min-width:860px){.setup{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.chk input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.chk .n{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--muted);white-space:nowrap;padding-left:8px}
.chk .t{min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:14px;color:var(--muted)}
input[type=number]{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tick{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.tick input{margin-top:5px;accent-color:var(--accent)}
.summary{font-family:var(--mono);font-size:14px;background:var(--bg);border-radius:6px;padding:10px 12px;margin:14px 0}
/* exam */
.exam{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.exam{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.qno{font-weight:600;font-size:18px}
.ref{font-size:13.5px;color:var(--muted);font-style:italic}
.qtext{font-size:19px;line-height:1.5;margin:14px 0 18px;max-width:68ch;overflow-wrap:anywhere}
fieldset{border:0;padding:0;margin:0;min-width:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt .l{font-weight:600;min-width:1.2em}
.opt span.tx{min-width:0;overflow-wrap:anywhere}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.nav .sp{margin-left:auto}
.flagbox{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.flagbox input{accent-color:var(--flag);width:18px;height:18px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:50vh;overflow:auto;padding:2px}
.pb{position:relative;height:38px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;padding:0}
.pb.ans{background:var(--accent);border-color:var(--accent);color:#fff}
.pb.cur{outline:3px solid var(--ink);outline-offset:1px}
.pb.fl::after{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;background:var(--flag);border-radius:0 5px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend .a{background:var(--accent);border-color:var(--accent)}.legend .f{background:var(--flag);border-color:var(--flag)}
.keys{font-size:13px;color:var(--muted);margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(10,18,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--panel);border-radius:10px;padding:24px;max-width:440px;width:100%;border:1px solid var(--line)}
.dialog .row{margin:18px 0 0}
/* results */
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--mono);font-weight:600;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.fbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.item .qt{margin:6px 0 12px;overflow-wrap:anywhere}
.ro{display:flex;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid transparent;font-size:15.5px}
.ro .l{font-weight:600;min-width:1.2em}.ro .tx{min-width:0;overflow-wrap:anywhere;flex:1}
.ro.ok{background:var(--good-tint);border-color:var(--good)}
.ro.no{background:var(--bad-tint);border-color:var(--bad)}
.ro.pk{background:var(--accent-tint);border-color:var(--accent)}
.tag{font-size:12.5px;font-weight:600;white-space:nowrap}
.ro.ok .tag{color:var(--good)}.ro.no .tag{color:var(--bad)}
.pill{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.pill.fl{border-color:var(--flag);color:var(--flag);background:var(--flag-tint)}
.keyset{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.keyset .btn{padding:3px 12px}
.src{font-size:13px;color:var(--muted);margin-top:8px}
.note{margin-top:8px;padding:8px 12px;border-radius:6px;background:var(--flag-tint);border:1px solid var(--flag);font-size:14px}
.srcnote{font-size:13.5px;color:var(--muted);margin:0 0 12px}
@media(prefers-reduced-motion:no-preference){.opt,.chk,.pb,.btn{transition:border-color .12s,background-color .12s}}
</style>

mission Report","Kyoto Protocol Conference","Stockholm Declaration","Rio Earth Summit Agenda 21"],"a":"A","s":"Matched from your MCQ bank (Ch12 Q41)"},{"id":"ca-6","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q6","q":"All these are the branches of psychology EXCEPT ONE.","o":["Social and personality psychology","Developmental psychology","Human behaviour psychology","Counselling psychology"],"a":"C","s":"Claude's answer, not in your files","n":"'Human behaviour psychology' is not a recognised branch."},{"id":"ca-7","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q7","q":"______ refers to an attempt to understand how the social world works without employing scientific method.","o":["Socialisation","Armchair Sociology","Social imagination","Social theory"],"a":"B","s":"Matched from your MCQ bank (Ch5 Q14)"},{"id":"ca-8","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q8","q":"The classification of resources can be based on what factors?","o":["Abundance, origin, and geographic concentration","Origin, social status, and political influence","Technological advancement, origin, and geographic concentration","Government decision, abundance, and geographic concentration"],"a":"A","s":"Claude's answer, not in your files","n":"Medium confidence. Distribution (abundance and geographic concentration) and origin are standard bases. Your lecturer's exact list may differ."},{"id":"ca-9","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q9","q":"All these EXCEPT ONE are examples of secondary data.","o":["Demographic Health Survey data","WHO data","ECOWAS data","One-on-one interviews data"],"a":"D","s":"Claude's answer, not in your files","n":"Interviews you conduct yourself are primary data."},{"id":"ca-10","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q10","q":"______ is the attribute that can assume different values.","o":["Concept","Data","Variable","Scale"],"a":"C","s":"Matched from your MCQ bank (Ch10 Q34)"},{"id":"ca-11","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q11","q":"The geographical paradigm asserting that the physical environment strictly dictates human actions and societal development is known as:","o":["Environmental possibilism","Environmental determinism","Cultural relativism","Neo-Malthusianism"],"a":"B","s":"Matched from your MCQ bank (Ch11 Q45)"},{"id":"ca-12","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q12","q":"A surveyed natural deposit whose quantity and quality have been precisely established and is currently being commercially extracted is defined as a(n):","o":["Potential resource","Stock resource","Actual resource","Speculative reserve"],"a":"C","s":"Matched from your MCQ bank (Ch12 Q11)"},{"id":"ca-13","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q13","q":"All these are the approaches in the study of psychology EXCEPT ONE.","o":["Behavioural","Psychotherapy","Humanistic","Sociocultural"],"a":"B","s":"Claude's answer, not in your files","n":"Psychotherapy is a treatment, not an approach."},{"id":"ca-14","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q14","q":"The statistical tool that compares the mean difference is:","o":["T-test","Multiple regression","Correlation","Chi-square"],"a":"A","s":"Matched from your MCQ bank (Ch6 Q24)"},{"id":"ca-15","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q15","q":"The word \"environment\" is derived from the French term environner, which means:","o":["To develop and modify","To encircle or surround","To adapt and survive","To explore and extract"],"a":"B","s":"Matched from your MCQ bank (Ch11 Q1)"},{"id":"ca-16","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q16","q":"A test is ______ if it consistently results in the same findings over time.","o":["Valid","Accurate","Reliable","Standardized"],"a":"C","s":"Matched from your MCQ bank (Ch10 Q49)"},{"id":"ca-17","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q17","q":"In marine environments, the vast majority of aquatic life is concentrated in a vertical zone extending from the surface down to:","o":["30 meters","200 meters","100 meters","1,000 meters"],"a":"B","s":"Claude's answer, not in your files"},{"id":"ca-18","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q18","q":"______, a Greek philosopher, defines politics as the essence of social existence.","o":["Easton","Plato","Aristotle","Robertson"],"a":"C","s":"Claude's answer, not in your files"},{"id":"ca-19","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q19","q":"______, as a result of their personal skills or position within a group, organisation, or society, are able to provide more information and a deeper insight into what is going on around them in terms of forms, meanings, and functions of their behavioural relationships with which they can also be identified.","o":["FGD","KII","IDI","Observer"],"a":"B","s":"Claude's answer, not in your files"},{"id":"ca-20","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q20","q":"The average salinity of the Earth's oceans is approximately:","o":["15 grams per kilogram (1.5%)","35 grams per kilogram (3.5%)","50 grams per kilogram (5.0%)","71 grams per kilogram (7.1%)"],"a":"B","s":"Claude's answer, not in your files"},{"id":"ca-21","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q21","q":"______ is a particular way of looking at the world around us through sociological lenses.","o":["Sociological investigation","Sociological imagination","Sociological interpretation","Sociological expertise"],"a":"B","s":"Claude's answer, not in your files"},{"id":"ca-22","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q22","q":"Which statement best describes the major chemical composition of Earth's atmosphere by volume?","o":["Approximately 78% carbon dioxide, 21% nitrogen, with trace amounts of argon, neon, helium, and oxygen","Approximately 78% nitrogen, 21% oxygen, and small amounts of argon, neon, helium, and carbon dioxide","Approximately 78% oxygen, 21% nitrogen, and small amounts of argon, neon, helium, and carbon dioxide","Approximately 78% helium, 21% nitrogen, and small amounts of argon, neon, oxygen, and carbon dioxide"],"a":"B","s":"Claude's answer, not in your files"},{"id":"ca-23","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q23","q":"The two very important approaches employed by Sociology in research design are:","o":["Content and thematic","Positivism and empiricism","Inductive and deductive","Qualitative and quantitative"],"a":"D","s":"Claude's answer, not in your files","n":"Medium confidence. Some texts also describe inductive and deductive reasoning, but qualitative and quantitative fits this question best."},{"id":"ca-24","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q24","q":"Suicide, substance addiction, racial prejudice, ethnic conflict, wars, and industrial conflict are examples of ______.","o":["Psychological problems","Social problems","Maladjustment behaviour","Abnormal behaviour"],"a":"B","s":"Claude's answer, not in your files"},{"id":"ca-25","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q25","q":"______ focuses on the way society and institutions change over time through technical inventions, cultural diffusion, and cultural conflict.","o":["Social Action","Social Change","Social Process","Social Order"],"a":"B","s":"Matched from your MCQ bank (Ch5 Q47)"},{"id":"ca-26","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q26","q":"In September 2015, the United Nations General Assembly adopted how many Sustainable Development Goals (SDGs) and associated targets to drive global policy through 2030?","o":["8 goals and 48 targets","12 goals and 100 targets","17 goals and 169 targets","20 goals and 200 targets"],"a":"C","s":"Matched from your MCQ bank (Ch12 Q48)"},{"id":"ca-27","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q27","q":"Which of the following correctly describes the oceanic crust compared to the continental crust?","o":["Thicker and composed of granite","5 to 10 km thick, composed of basalt, with a density of about 3.0 g/cm³","20 to 70 km thick with a density of 2.7 g/cm³","Lighter, measuring over 100 km in thickness"],"a":"B","s":"Matched from your MCQ bank (Ch11 Q17)"},{"id":"ca-28","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q28","q":"Natural resources that replenish themselves through reproduction or rapid cyclical replacement within reasonable timeframes are classified as:","o":["Stock resources","Point resources","Flow resources","Potential resources"],"a":"C","s":"Matched from your MCQ bank (Ch12 Q3)"},{"id":"ca-29","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q29","q":"According to estimates cited by Pimentel and Burgess (2013), approximately how much fertile topsoil is lost from agricultural systems worldwide each year?","o":["1.4 billion tons","10 billion tons","75 billion tons","120 billion tons"],"a":"C","s":"Claude's answer, not in your files","n":"Checked against Pimentel & Burgess (2013), Agriculture 3(3): about 75 billion tons of fertile soil lost from world agricultural systems each year."},{"id":"ca-30","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q30","q":"Human and animal behaviour can be:","o":["Latent and manifest","Reasonable and unreasonable","Gentle and tough","Covert and overt"],"a":"D","s":"Matched from your MCQ bank (Ch9 Q9-10)"},{"id":"ca-31","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q31","q":"The imaginary boundary located at about 62 miles (100 kilometres) above the Earth's surface, where the atmosphere meets outer space, is designated as the:","o":["Kármán line","Stratopause","Tropopause","Ozone boundary"],"a":"A","s":"Claude's answer, not in your files"},{"id":"ca-32","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q32","q":"______ examines how we process, store, and use information and how this information influences what we attend to, perceive, learn, remember, believe, and feel.","o":["Behaviouralism approach","Cognitive approach","Humanistic approach","Psychoanalysis approach"],"a":"B","s":"Matched from your MCQ bank (Ch9 Q40)"},{"id":"ca-33","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q33","q":"What percentage of Earth's freshwater resources is contained in easily accessible lakes, reservoirs, and river systems?","o":["30.5%","0.35%","0.3%","30%"],"a":"C","s":"Matched from your MCQ bank (Ch11 Q26)"},{"id":"ca-34","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q34","q":"Who defined Sociology as the study of social facts?","o":["Max Weber","Émile Durkheim","Herbert Spencer","Karl Marx"],"a":"B","s":"Matched from your MCQ bank (Ch5 Q8)"},{"id":"ca-35","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q35","q":"All these EXCEPT ONE are agents of political socialisation.","o":["School","Voluntary association","Peer group","Government"],"a":"D","s":"Claude's answer, not in your files","n":"Medium confidence. Family, school, peer groups, mass media, religion and voluntary associations are the usual agents. Government is normally listed as what people learn about, not as an agent."},{"id":"ca-36","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q36","q":"The atmospheric layer between the Earth's surface and approximately 80 kilometres altitude, characterized by a fairly uniform chemical composition of gases, is called the:","o":["Heterosphere","Exosphere","Homosphere","Mesosphere"],"a":"C","s":"Claude's answer, not in your files"},{"id":"ca-37","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q37","q":"The belief that mind and brain are the same and therefore inseparable from one another is called:","o":["Structuralism","Dualism","Parallelism","Monism"],"a":"D","s":"Matched from your MCQ bank (Ch9 Q25)"},{"id":"ca-38","set":"CA TEST 2025/26","ref":"GES 103 CA TEST 2025/2026, Q38","q":"______ is defined as kind behaviour based on the notion of right or wrong.","o":["Eth ble Planet","Our Common Future","The Limits to Growth","Silent Spring"],"a":"B","s":"Answer key in your file"},{"id":"b-12-42","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q42","q":"The three perspectives of sustainability are:","o":["Social/political, environmental and economic","Legal, moral and religious","Local, national and global","Past, present and future"],"a":"A","s":"Answer key in your file"},{"id":"b-12-43","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q43","q":"The 'Triple Bottom Line' means:","o":["Cost, tax, profit","Land, labour, capital","Profits, planet, people","Air, water, soil"],"a":"C","s":"Answer key in your file"},{"id":"b-12-44","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q44","q":"Weak sustainability assumes that:","o":["Nothing can be replaced","Resources are unlimited","Nature is useless","Man-made and natural capital can substitute for each other"],"a":"D","s":"Answer key in your file"},{"id":"b-12-45","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q45","q":"Strong sustainability assumes that natural and man-made capital are:","o":["Substitutes","Complementary, not substitutes","Irrelevant","Equal"],"a":"B","s":"Answer key in your file"},{"id":"b-12-46","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q46","q":"The ecological footprint is measured in:","o":["Global hectares","Kilograms","Dollars","Kilometres"],"a":"A","s":"Answer key in your file"},{"id":"b-12-47","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q47","q":"Human development places at the centre of development:","o":["Money","Machines","Human beings and their choices","Minerals"],"a":"C","s":"Answer key in your file"},{"id":"b-12-48","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q48","q":"The Sustainable Development Goals comprise:","o":["8 goals and 21 targets","10 goals and 100 targets","12 goals and 60 targets","17 goals and 169 targets (adopted 25 September 2015)"],"a":"D","s":"Answer key in your file"},{"id":"b-12-49","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q49","q":"A major obstacle to sustainable development is:","o":["Renewable energy","Heavy reliance on fossil fuels","Afforestation","Recycling"],"a":"B","s":"Answer key in your file"},{"id":"b-12-50","set":"Ch12 Resources & Sustainability","ref":"MCQ bank, Ch12 Q50","q":"Sustainable development also involves a shift from globalisation toward:","o":["Localisation","Colonisation","Urbanisation only","Privatisation"],"a":"A","s":"Answer key in your file"}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
  return e;}
const KEYSTORE='ges103-cbt-user-keys';
let userKeys={};
try{userKeys=JSON.parse(localStorage.getItem(KEYSTORE)||'{}')||{}}catch(e){userKeys={}}
function saveKeys(){try{localStorage.setItem(KEYSTORE,JSON.stringify(userKeys))}catch(e){}}
const keyOf=q=>q.a||userKeys[q.id]||null;
const PAST=['CA TEST 2025/26','CA TEST 1'];
const ALLSETS=[...new Set(DATA.map(q=>q.set))];
const BANK=ALLSETS.filter(s=>!PAST.includes(s));
const S={view:'setup',sel:new Set(PAST),opts:{count:90,minutes:68,timed:true,shuffle:true,unkeyed:true,minEdited:false},exam:null,result:null,filter:'all'};
let timer=null;
const fmt=t=>{t=Math.max(0,t);const hh=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return (hh?hh+':':'')+String(m).padStart(2,hh?'0':'0')+':'+String(s).padStart(2,'0')};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setBar(content){const b=$('#bar');b.replaceChildren();b.hidden=!content;if(content)b.append(...content)}

/* ---------- setup ---------- */
function srcCounts(){const c=DATA.reduce((m,q)=>{const k=q.s.startsWith('Claude')?'c':q.s.startsWith('Matched')?'m':'f';m[k]=(m[k]||0)+1;return m},{});return `Answer sources: ${c.f} from your files, ${c.m} matched from your MCQ bank, ${c.c||0} supplied by Claude. The review marks each one and flags answers worth a second look.`}
function pool(){return DATA.filter(q=>S.sel.has(q.set)&&(S.opts.unkeyed||keyOf(q)))}
function renderSetup(){
  clearInterval(timer);S.view='setup';setBar(null);
  const root=$('#app');root.replaceChildren();
  const boxes={};
  const group=(sets)=>h('div',{class:'checks'},sets.map(s=>{
    const total=DATA.filter(q=>q.set===s).length;
    const cb=h('input',{type:'checkbox',checked:S.sel.has(s),onchange:e=>{e.target.checked?S.sel.add(s):S.sel.delete(s);poolChanged()}});
    boxes[s]=cb;
    return h('label',{class:'chk'},cb,h('span',{class:'t'},s),h('span',{class:'n'},total+' Qs'))}));
  const count=h('input',{type:'number',id:'count',min:1,value:S.opts.count,oninput:e=>{S.opts.count=+e.target.value||1;if(!S.opts.minEdited){S.opts.minutes=Math.max(1,Math.ceil(S.opts.count*.75));minutes.value=S.opts.minutes}sum()}});
  const minutes=h('input',{type:'number',id:'minutes',min:1,value:S.opts.minutes,oninput:e=>{S.opts.minutes=+e.target.value||1;S.opts.minEdited=true}});
  const summary=h('div',{class:'summary',id:'summary','aria-live':'polite'});
  const startBtn=h('button',{class:'btn primary',id:'start',onclick:start},'Start test');
  function sum(){
    const p=pool();const keyed=p.filter(keyOf).length;
    count.max=p.length;
    summary.textContent=p.length?`${p.length} questions available · ${keyed} with answer key · will use ${Math.min(S.opts.count,p.length)}`:'Pick at least one source';
    startBtn.disabled=!p.length;}
  function poolChanged(){const p=pool();S.opts.count=p.length||1;count.value=S.opts.count;
    if(!S.opts.minEdited){S.opts.minutes=Math.max(1,Math.ceil(S.opts.count*.75));minutes.value=S.opts.minutes}sum()}
  function start(){const p=pool();if(!p.length)return;
    const n=Math.min(Math.max(1,S.opts.count),p.length);
    let qs=S.opts.shuffle?shuffle(p).slice(0,n):p.slice(0,n);
    startExam(qs,S.opts.minutes,S.opts.timed)}
  const tm=h('input',{type:'checkbox',id:'timed',checked:S.opts.timed,onchange:e=>{S.opts.timed=e.target.checked;minutes.disabled=!S.opts.timed}});
  minutes.disabled=!S.opts.timed;
  root.append(
    h('h1',{text:'GES 103 CBT Practice'}),
    h('p',{class:'muted',text:'Your own past questions, word for word.'}),
    h('p',{class:'srcnote'},srcCounts()),
    h('div',{class:'setup'},
      h('section',{class:'panel'},
        h('h2',{text:'Your past tests'}),group(PAST),
        h('h2',{style:'margin-top:20px',text:'MCQ bank by chapter'}),group(BANK),
        h('div',{class:'row',style:'margin:14px 0 0'},
          h('button',{class:'btn',onclick:()=>{ALLSETS.forEach(s=>S.sel.add(s));ALLSETS.forEach(s=>boxes[s].checked=true);poolChanged()}},'Select all'),
          h('button',{class:'btn',onclick:()=>{S.sel.clear();ALLSETS.forEach(s=>boxes[s].checked=false);poolChanged()}},'Clear'))),
      h('section',{class:'panel'},
        h('h2',{text:'Test settings'}),
        h('div',{class:'row'},
          h('div',{class:'field'},h('label',{for:'count'},'Questions'),count),
          h('div',{class:'field'},h('label',{for:'minutes'},'Minutes'),minutes)),
        h('label',{class:'tick'},tm,h('span',{},'Timed test (auto-submits at zero)')),
        h('label',{class:'tick'},h('input',{type:'checkbox',id:'shuf',checked:S.opts.shuffle,onchange:e=>S.opts.shuffle=e.target.checked}),h('span',{},'Shuffle questions (options keep their original order)')),
        summary,startBtn)));
  sum();
}

/* ---------- exam ---------- */
function startExam(qs,minutes,timed){
  S.exam={qs,ans:{},flags:new Set(),idx:0,timed,minutes,start:Date.now(),end:Date.now()+minutes*60000,confirm:false};
  S.view='exam';renderExam();
  clearInterval(timer);timer=setInterval(tick,500);tick();window.scrollTo(0,0);}
function tick(){const E=S.exam;if(!E)return;const el=$('#clock');if(!el)return;
  if(E.timed){const r=Math.ceil((E.end-Date.now())/1000);el.textContent=fmt(r);el.classList.toggle('low',r<=300);if(r<=0)submit(true)}
  else el.textContent=fmt(Math.floor((Date.now()-E.start)/1000));}
function renderExam(){
  const E=S.exam;
  setBar([h('div',{class:'title'},'GES 103 CBT',h('small',{},E.timed?'Time remaining':'Time elapsed')),
    h('div',{class:'clock',id:'clock','aria-live':'off'},'--:--'),
    h('button',{class:'btn primary',onclick:()=>{E.confirm=true;renderConfirm()}},'Submit test')]);
  const root=$('#app');root.replaceChildren(
    h('div',{class:'exam'},h('section',{class:'panel',id:'qpanel'}),
      h('aside',{class:'side panel'},h('h2',{text:'Question palette'}),h('div',{class:'pal',id:'pal'}),
        h('div',{class:'legend'},h('span',{},h('i',{class:'a'}),'Answered'),h('span',{},h('i'),'Not answered'),h('span',{},h('i',{class:'f'}),'Flagged')),
        h('p',{class:'keys'},'Keys: A–D answer · N next · P previous · F flag'))));
  showQ();}
function go(i){const E=S.exam;E.idx=Math.min(E.qs.length-1,Math.max(0,i));showQ();window.scrollTo({top:0})}
function showQ(){
  const E=S.exam,q=E.qs[E.idx],id=q.id;
  const p=$('#qpanel');p.replaceChildren(
    h('div',{class:'qhead'},h('div',{class:'qno'},`Question ${E.idx+1} of ${E.qs.length}`),h('div',{class:'ref'},'Reference: '+q.ref)),
    h('div',{class:'qtext'},q.q),
    h('fieldset',{},h('legend',{class:'muted small',style:'margin-bottom:8px'},'Choose one answer'),
      h('div',{class:'opts'},q.o.map((t,i)=>{const L='ABCD'[i];
        return h('label',{class:'opt'},h('input',{type:'radio',name:'opt',value:L,checked:E.ans[id]===L,onchange:()=>{E.ans[id]=L;pal()}}),h('span',{class:'l'},L+'.'),h('span',{class:'tx'},t))}))),
    h('div',{class:'nav'},
      h('button',{class:'btn',disabled:E.idx===0,onclick:()=>go(E.idx-1)},'Previous'),
      h('button',{class:'btn primary',disabled:E.idx===E.qs.length-1,onclick:()=>go(E.idx+1)},'Next'),
      h('label',{class:'flagbox sp'},h('input',{type:'checkbox',checked:E.flags.has(id),onchange:e=>{e.target.checked?E.flags.add(id):E.flags.delete(id);pal()}}),'Flag for review'),
      h('button',{class:'btn',disabled:!E.ans[id],onclick:()=>{delete E.ans[id];showQ();pal()}},'Clear answer')));
  pal();}
function pal(){const E=S.exam,box=$('#pal');if(!box)return;
  box.replaceChildren(...E.qs.map((q,i)=>h('button',{class:'pb'+(E.ans[q.id]?' ans':'')+(E.flags.has(q.id)?' fl':'')+(i===E.idx?' cur':''),'aria-label':`Question ${i+1}${E.ans[q.id]?', answered':''}${E.flags.has(q.id)?', flagged':''}`,'aria-current':i===E.idx?'true':null,onclick:()=>go(i)},String(i+1))));
  const c=box.querySelector('.cur');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest'});}
function renderConfirm(){
  const E=S.exam;document.querySelector('.overlay')?.remove();if(!E.confirm)return;
  const un=E.qs.filter(q=>!E.ans[q.id]).length,fl=E.flags.size;
  const close=()=>{E.confirm=false;document.querySelector('.overlay')?.remove()};
  document.body.append(h('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':'Submit test'},
    h('div',{class:'dialog'},h('h1',{style:'font-size:21px',text:'Submit your test?'}),
      h('p',{class:'muted'},`${E.qs.length-un} of ${E.qs.length} answered · ${un} unanswered · ${fl} flagged for review.`),
      h('p',{class:'small muted'},'You cannot change answers after submitting.'),
      h('div',{class:'row'},h('button',{class:'btn',onclick:close},'Keep working'),h('button',{class:'btn primary',onclick:()=>{close();submit(false)}},'Submit now')))));}
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('.overlay'))return;
  const k=e.key.toLowerCase(),E=S.exam,q=E.qs[E.idx];
  if('abcd'.includes(k)&&k.length===1&&q.o[k.charCodeAt(0)-97]!==undefined){E.ans[q.id]=k.toUpperCase();showQ()}
  else if(k==='n')go(E.idx+1);else if(k==='p')go(E.idx-1);
  else if(k==='f'){E.flags.has(q.id)?E.flags.delete(q.id):E.flags.add(q.id);showQ()}});

/* ---------- results ---------- */
function submit(auto){
  const E=S.exam;if(!E||S.view!=='exam')return;
  clearInterval(timer);document.querySelector('.overlay')?.remove();
  const items=E.qs.map(q=>({q,key:keyOf(q),pick:E.ans[q.id]||null,flag:E.flags.has(q.id)}));
  const scored=items.filter(i=>i.key),right=scored.filter(i=>i.pick===i.key),wrong=scored.filter(i=>i.pick&&i.pick!==i.key),blank=scored.filter(i=>!i.pick);
  S.result={items,scored,right,wrong,blank,auto,timed:E.timed,minutes:E.minutes,used:Math.min(Math.floor((Date.now()-E.start)/1000),E.minutes*60*(E.timed?1:1e6))};
  S.view='result';S.filter='all';renderResult();window.scrollTo(0,0);}
function renderResult(){
  const R=S.result;setBar([h('div',{class:'title'},'GES 103 CBT',h('small',{},'Results')),h('button',{class:'btn primary',onclick:renderSetup},'New test')]);
  const pct=R.scored.length?Math.round(R.right.length/R.scored.length*100):null;
  const unk=R.items.length-R.scored.length;
  const bySet={};R.scored.forEach(i=>{const s=bySet[i.q.set]??={n:0,c:0};s.n++;if(i.pick===i.key)s.c++});
  const retry=[...R.wrong,...R.blank].map(i=>i.q);
  const root=$('#app');root.replaceChildren();
  root.append(
    h('section',{class:'panel'},
      R.auto?h('p',{class:'small',style:'color:var(--bad);font-weight:600'},'Time ran out. Your test was submitted automatically.'):null,
      h('div',{class:'score'},h('div',{class:'big'},pct==null?'–':pct+'%'),
        h('div',{class:'stats'},
          h('div',{class:'stat'},h('b',{},`${R.right.length}/${R.scored.length}`),h('span',{},'correct (scored)')),
          h('div',{class:'stat'},h('b',{},String(R.wrong.length)),h('span',{},'wrong')),
          h('div',{class:'stat'},h('b',{},String(R.blank.length)),h('span',{},'unanswered')),
          unk?h('div',{class:'stat'},h('b',{},String(unk)),h('span',{},'not scored (no answer key)')):null,
          h('div',{class:'stat'},h('b',{},fmt(R.used)),h('span',{},'time used')))),
      Object.keys(bySet).length>1?h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Source'),h('th',{class:'n'},'Correct'),h('th',{class:'n'},'Scored'),h('th',{class:'n'},'%'))),
        h('tbody',{},Object.entries(bySet).map(([k,v])=>h('tr',{},h('td',{},k),h('td',{class:'n'},String(v.c)),h('td',{class:'n'},String(v.n)),h('td',{class:'n'},Math.round(v.c/v.n*100)+'%')))))):null,
      h('div',{class:'row',style:'margin:18px 0 0'},
        h('button',{class:'btn primary',disabled:!retry.length,onclick:()=>startExam(shuffle(retry),Math.max(1,Math.ceil(retry.length*.75)),R.timed)},`Retry wrong and unanswered (${retry.length})`),
        h('button',{class:'btn',onclick:renderSetup},'New test'))),
    h('div',{class:'filters',id:'filters'}),h('div',{id:'review'}));
  drawFilters();drawReview();}
function drawFilters(){
  const R=S.result;const defs=[['all','All',R.items.length],['wrong','Wrong',R.wrong.length],['blank','Unanswered',R.blank.length],['flag','Flagged',R.items.filter(i=>i.flag).length],['chk','Needs a check',R.items.filter(i=>i.q.n).length],['unk','No answer key',R.items.length-R.scored.length]].filter(d=>d[0]==='all'||d[2]>0);
  $('#filters').replaceChildren(...defs.map(([k,l,n])=>h('button',{class:'fbtn','aria-pressed':S.filter===k,onclick:()=>{S.filter=k;drawFilters();drawReview()}},`${l} (${n})`)));}
function drawReview(){
  const R=S.result;const f=S.filter;
  const list=R.items.map((it,i)=>({it,i})).filter(({it})=>f==='all'||(f==='wrong'&&it.key&&it.pick&&it.pick!==it.key)||(f==='blank'&&it.key&&!it.pick)||(f==='flag'&&it.flag)||(f==='chk'&&it.q.n)||(f==='unk'&&!it.key));
  const box=$('#review');box.replaceChildren();
  if(!list.length){box.append(h('p',{class:'muted',text:'Nothing here.'}));return}
  list.forEach(({it,i})=>{const q=it.q,key=keyOf(q);
    const status=!key?h('span',{class:'pill'},'Not scored'):!it.pick?h('span',{class:'pill'},'Unanswered'):it.pick===key?h('span',{class:'pill',style:'color:var(--good);border-color:var(--good)'},'Correct'):h('span',{class:'pill',style:'color:var(--bad);border-color:var(--bad)'},'Wrong');
    const card=h('article',{class:'item'},
      h('div',{class:'qhead'},h('div',{class:'qno',style:'font-size:16px'},`Question ${i+1}`,status,q.s&&q.s.startsWith('Claude')?h('span',{class:'pill'},"Claude's answer"):null,it.flag?h('span',{class:'pill fl'},'Flagged'):null),h('div',{class:'ref'},q.ref)),
      h('div',{class:'qt'},q.q),
      q.o.map((t,j)=>{const L='ABCD'[j];let c='ro',tag='';
        if(key&&L===key){c+=' ok';tag='Correct answer'+(it.pick===L?' · your answer':'')}
        else if(it.pick===L){c+=key?' no':' pk';tag=key?'Your answer':'Your answer'}
        return h('div',{class:c},h('span',{class:'l'},L+'.'),h('span',{class:'tx'},t),tag?h('span',{class:'tag'},tag):null)}),
      h('div',{class:'src'},key?(q.a?q.s:'Key saved by you (counts from your next test)'):'No answer key in your files for this question.'),
      q.n?h('div',{class:'note'},h('b',{},'Check: '),q.n):null);
    if(!key){card.append(h('div',{class:'keyset'},'Know the answer? Save it for next time:',...'ABCD'.slice(0,q.o.length).split('').map(L=>h('button',{class:'btn',onclick:()=>{userKeys[q.id]=L;saveKeys();drawReview()}},L))))}
    else if(!q.a){card.append(h('div',{class:'keyset'},h('button',{class:'btn',onclick:()=>{delete userKeys[q.id];saveKeys();drawReview()}},'Remove my saved key')))}
    box.append(card)});}
renderSetup();
</script>
