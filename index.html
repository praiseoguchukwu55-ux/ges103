<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Philosophy CBT Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen exam console. Navy title bar with timer, question panel left, numbered palette right; setup and results reuse the same panels. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#17212e; --muted:#566375; --line:#d3dae4;
  --brand:#17365d; --brand-ink:#ffffff; --accent:#1f5fbf; --accent-tint:#e3edfb;
  --good:#1f7a4d; --good-tint:#e1f3e9; --bad:#b3261e; --bad-tint:#fbe7e5; --flag:#a8650a; --flag-tint:#fbefd9;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --panel:#172130; --ink:#e6ebf2; --muted:#98a5b8; --line:#2b394d;
  --brand:#0c2340; --brand-ink:#e6ebf2; --accent:#6aa3f5; --accent-tint:#1c3050;
  --good:#52c78a; --good-tint:#16301f; --bad:#f0766e; --bad-tint:#3a1a19; --flag:#e8a649; --flag-tint:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#172130; --ink:#e6ebf2; --muted:#98a5b8; --line:#2b394d;
  --brand:#0c2340; --brand-ink:#e6ebf2; --accent:#6aa3f5; --accent-tint:#1c3050;
  --good:#52c78a; --good-tint:#16301f; --bad:#f0766e; --bad-tint:#3a1a19; --flag:#e8a649; --flag-tint:#3a2a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.bar .title{font-weight:600;letter-spacing:.01em;margin-right:auto}
.bar .title small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
.clock{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;padding:2px 10px;border:1px solid currentColor;border-radius:6px}
.clock.low{background:var(--bad);border-color:var(--bad);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar .btn{background:transparent;color:inherit;border-color:currentColor}
.bar .btn.primary{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
/* setup */
.setup{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media(min-width:860px){.setup{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.chk input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.chk .n{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--muted);white-space:nowrap;padding-left:8px}
.chk .t{min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:14px;color:var(--muted)}
input[type=number]{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tick{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.tick input{margin-top:5px;accent-color:var(--accent)}
.summary{font-family:var(--mono);font-size:14px;background:var(--bg);border-radius:6px;padding:10px 12px;margin:14px 0}
/* exam */
.exam{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.exam{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.qno{font-weight:600;font-size:18px}
.ref{font-size:13.5px;color:var(--muted);font-style:italic}
.qtext{white-space:pre-line;font-size:19px;line-height:1.5;margin:14px 0 18px;max-width:68ch;overflow-wrap:anywhere}
fieldset{border:0;padding:0;margin:0;min-width:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt.ok,.opt.ok:has(input:checked){border-color:var(--good);background:var(--good-tint)}
.opt.no,.opt.no:has(input:checked){border-color:var(--bad);background:var(--bad-tint)}
.opt.lock{cursor:default}
.opt .tag{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap;padding-left:8px}
.opt.ok .tag{color:var(--good)}.opt.no .tag{color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);font-size:15px}
.fb.ok{border-color:var(--good);background:var(--good-tint)}
.fb.no{border-color:var(--bad);background:var(--bad-tint)}
.fb b{display:block;margin-bottom:2px}
.fb .src{margin-top:6px}
.why{margin-top:4px;line-height:1.5}
.why strong{font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.mode input{margin-right:8px;accent-color:var(--accent)}
.mode b{font-weight:600}.mode small{display:block;color:var(--muted);margin-top:2px;margin-left:26px}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt .l{font-weight:600;min-width:1.2em}
.opt span.tx{min-width:0;overflow-wrap:anywhere}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.nav .sp{margin-left:auto}
.flagbox{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.flagbox input{accent-color:var(--flag);width:18px;height:18px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:50vh;overflow:auto;padding:2px}
.pb{position:relative;height:38px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;padding:0}
.pb.ans{background:var(--accent);border-color:var(--accent);color:#fff}
.pb.cur{outline:3px solid var(--ink);outline-offset:1px}
.pb.fl::after{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;background:var(--flag);border-radius:0 5px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend .a{background:var(--accent);border-color:var(--accent)}.legend .f{background:var(--flag);border-color:var(--flag)}
.keys{font-size:13px;color:var(--muted);margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(10,18,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--panel);border-radius:10px;padding:24px;max-width:440px;width:100%;border:1px solid var(--line)}
.dialog .row{margin:18px 0 0}
/* results */
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--mono);font-weight:600;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.fbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.item .qt{white-space:pre-line;margin:6px 0 12px;overflow-wrap:anywhere}
.ro{display:flex;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid transparent;font-size:15.5px}
.ro .l{font-weight:600;min-width:1.2em}.ro .tx{min-width:0;overflow-wrap:anywhere;flex:1}
.ro.ok{background:var(--good-tint);border-color:var(--good)}
.ro.no{background:var(--bad-tint);border-color:var(--bad)}
.ro.pk{background:var(--accent-tint);border-color:var(--accent)}
.tag{font-size:12.5px;font-weight:600;white-space:nowrap}
.ro.ok .tag{color:var(--good)}.ro.no .tag{color:var(--bad)}
.pill{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.pill.fl{border-color:var(--flag);color:var(--flag);background:var(--flag-tint)}
.keyset{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.keyset .btn{padding:3px 12px}
.src{font-size:13px;color:var(--muted);margin-top:8px}
@media(prefers-reduced-motion:no-preference){.opt,.chk,.pb,.btn{transition:border-color .12s,background-color .12s}}
.pb.ok{background:var(--good-tint);border-color:var(--good);color:var(--good)}
.pb.no{background:var(--bad-tint);border-color:var(--bad);color:var(--bad)}
</style>

<div id="bar" class="bar" hidden></div>
<main class="wrap" id="app"></main>
<script id="data" type="application/json">[{"id":"ft-1","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q1","q":"Philosophy determines the quality and essence of our lives. True or False.","o":["False","Sometimes","Maybe","True"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy shapes how we think about right and wrong, knowledge, and the meaning of life, so it fundamentally determines the quality and essence of our lives. That makes the statement true."},{"id":"ft-2","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q2","q":"We are filled with the ______ need to understand the world","o":["Extrinsic","Intrinsic","Concrete","Abstract"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Humans have an intrinsic need, one that comes from within us, to understand the world. It is not forced from outside (extrinsic), and that curiosity is what produces philosophy."},{"id":"ft-3","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q3","q":"Philosophy According to Plato is developed out of ______ and _________","o":["Wonder and curiousity","Wonder and consciousness","Consciousness and wander","Wonder and existence"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Plato (and Aristotle after him) said philosophy begins in wonder, which is curiosity about the world. So philosophy grows out of wonder and curiosity."},{"id":"ft-4","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q4","q":"Philosophy determines fundamentally the quality and ______ of our lives","o":["Existence","Essence","Entity","Evolvement"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy shapes the quality and the essence (the real nature) of our lives, because how we think decides how we live. Existence is merely being alive, which is not the point here."},{"id":"ft-5","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q5","q":"Epistemology is the branch of philosophy that studies _______","o":["Belief","Knowledge","Thought","Structure"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Epistemology comes from the Greek episteme (knowledge) and logos (study), so it is the study of knowledge: its nature, sources, limits and justification."},{"id":"ft-6","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q6","q":"An unexamined life is not worth living a dictum by ?","o":["Plato","Socrates","Aristotle","Parmenides"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"This line comes from Socrates, who said that a life never questioned or reflected upon is not worth living. Plato recorded it in the Apology."},{"id":"ft-7","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q7","q":"Element of examining worldview include this except","o":["Factual Adequacy","Logical coherence","Explanatory capacity","Critical thinking"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A worldview is examined using factual adequacy, logical coherence and explanatory capacity. Critical thinking is the skill or activity used to do the examining, not one of the elements being tested."},{"id":"ft-8","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q8 (also GST 212 Nexus Minds Q9)","q":"Philosophy is derived from two Greek words_____ and ________","o":["Philos and lophia","Philos and Sophia","Philo and Sophia","Philoss and Sophis"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy comes from two Greek words, philos (love) and sophia (wisdom), so it literally means 'love of wisdom'. The other spellings are wrong."},{"id":"ft-9","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q9","q":"Branches of philosophy include this except","o":["Epistemology","Metaphysics","Systematic Reasoning","Ethics"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The main branches of philosophy are epistemology, metaphysics, logic, ethics and aesthetics. 'Systematic reasoning' is a feature of how philosophy works, not a branch."},{"id":"ft-10","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q10","q":"Which is not categorised under functions of philosophy","o":["Analytic Function","Speculative Function","Critical thinking Function","Narrative Function"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy's functions include analytic (clarifying concepts), speculative (asking about reality beyond the senses), critical thinking and prescriptive or normative (guiding conduct). 'Narrative' is not one of them."},{"id":"ft-11","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q11","q":"Philosophy still inquires about other disciplines","o":["True","False","Sometimes","Maybe"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy asks second-order questions about the foundations of other fields, such as what science is and what law is. So it still inquires about other disciplines. The statement is true."},{"id":"ft-12","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q12","q":"Epistemology investigates question and does not inquire whether our claim to know is only accessible to us","o":["True","False","Sometimes","Maybe"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"This is false. Epistemology does ask whether our claims to know can be shared, tested and justified, and not merely held privately. It investigates exactly that."},{"id":"ft-13","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q13","q":"Everything that exists ,exists in the mind of human beings or in the mind of God","o":["Idealism","Materialism","Nihilism","Reductive Idealist"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Idealism holds that reality is mental: everything that exists is in the mind of humans or the mind of God. Materialism says the opposite, that matter is the basis of everything."},{"id":"ft-14","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q14","q":"Applied Ethics examines the moral status of practical social issues","o":["True","False","Sometimes","Maybe"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Applied ethics takes moral principles to concrete social issues such as abortion, euthanasia and surrogacy, and examines their moral status. The statement is true."},{"id":"ft-15","set":"GES 106 FIRST TEST","ref":"GES 106 First Test, Q15","q":"Is Respect for persons same as the principle of human dignity","o":["True","False","Not sure","Sometimes"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Respecting persons means treating them as having worth in themselves, which is what the principle of human dignity says. The two are used as the same idea, so the statement is true."},{"id":"p-1","set":"GES 106 PAPER","ref":"GES 106 Paper, Q1","q":"Science performs its ------------------ function when it is guided by ethical consideration","o":["Moral","Technical","Social","Universal"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Science performs its social function, serving society's good, when it is guided by ethics. Without ethics, science can be used for harm, as with weapons."},{"id":"p-2","set":"GES 106 PAPER","ref":"GES 106 Paper, Q2","q":"“Sir, I surely deserve a raise in pay. I can hardly manage to feed my children on what you have been paying me. And my youngest child must have an operation if he is ever to walk without crutches.” The argument contains the fallacy of ______","o":["appeal to pity","irrelevant conclusion","appeal to management","appeal to authority"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The speaker wins sympathy by describing his children's suffering, and that is an appeal to pity (argumentum ad misericordiam). It does not show that he deserves a raise."},{"id":"p-3","set":"GES 106 PAPER","ref":"GES 106 Paper, Q3","q":"Interactionism as a theory of mind-body relationship is usually associated with______","o":["Aristotle","Locke","Leibnitz","Descartes"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Interactionism says mind and body are separate substances that act on each other. It is Descartes' view, with the pineal gland as the meeting point."},{"id":"p-4","set":"GES 106 PAPER","ref":"GES 106 Paper, Q4","q":"The tilde is used for a ______","o":["disjunction","conditional","negation","biconditional"],"a":"C","s":"Answer from your GES 106 paper file.","e":"The tilde (~) is the symbol for negation, meaning 'not'. For example ~p means 'not p'."},{"id":"p-5","set":"GES 106 PAPER","ref":"GES 106 Paper, Q5","q":"Philosophy of law is distinct from jurisprudence for its -------------------- of law or legal system.","o":["Particularistic analysis","Descriptive analysis","Empirical analysis","Prescriptive analysis"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Jurisprudence describes what law is. Philosophy of law goes further and evaluates law, asking what it ought to be, so its analysis is prescriptive."},{"id":"p-6","set":"GES 106 PAPER","ref":"GES 106 Paper, Q6","q":"First-order questions are ______ questions","o":["Conceptual","Foundational","Universal","Factual"],"a":"D","s":"Answer from your GES 106 paper file.","e":"First-order questions are factual, about the issues in a field itself, such as 'what causes disease?'. Second-order questions are the philosophical ones, about the field's foundations."},{"id":"p-7","set":"GES 106 PAPER","ref":"GES 106 Paper, Q7","q":"The most that can be said of a scientific truth is that it has a high degree of ______","o":["inquiry","observation","probability","hypothesis"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Science works by induction from observation and cannot reach absolute certainty, so the most we can say of a scientific truth is that it is highly probable."},{"id":"p-8","set":"GES 106 PAPER","ref":"GES 106 Paper, Q8","q":"The criteria for choosing the correct principle of action include all but one of the following:","o":["The timing of the action","The consequences of the action","The nature of the action","The intention of the moral agent"],"a":"A","s":"Answer from your GES 106 paper file.","e":"We judge an action by its nature, its consequences and the agent's intention. When the action was performed is not a criterion for choosing the right principle."},{"id":"p-9","set":"GES 106 PAPER","ref":"GES 106 Paper, Q9","q":"What is the correct interpretation of this argument: “B v T”","o":["the bank is closed and the tellers are suspended","the bank is closed if and only if the tellers are suspended","either the bank is closed or the tellers are suspended","either the tellers are suspended or else the bank will be closed"],"a":"C","s":"Answer from your GES 106 paper file.","e":"The symbol 'v' (wedge) means 'or'. So B v T reads 'either the bank is closed or the tellers are suspended'. 'And' is the conjunction and 'if and only if' is the biconditional."},{"id":"p-10","set":"GES 106 PAPER","ref":"GES 106 Paper, Q10","q":"The value of scepticism lies in its force of arguments against the claims of the ______ philosophers.","o":["Religious","dogmatic","political","Ancient"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Scepticism is valuable because its arguments challenge the dogmatic philosophers, who claim certain knowledge without sufficient justification."},{"id":"p-11","set":"GES 106 PAPER","ref":"GES 106 Paper, Q11","q":"Which of the following ideas CANNOT be considered as one of the 'ideas we live by'?","o":["God","Destiny","Death","Food"],"a":"D","s":"Answer from your GES 106 paper file.","e":"'Ideas we live by' are the big ideas shaping human life, such as God, destiny and death. Food is an ordinary physical thing, not one of those ideas."},{"id":"p-12","set":"GES 106 PAPER","ref":"GES 106 Paper, Q12","q":"What are the two types of values?","o":["Intrinsic and extrinsic values","Natural and artificial values","Imported and local values","Past and future values"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Values are classed as intrinsic (good in themselves, like happiness) and extrinsic (good as a means to something else, like money)."},{"id":"p-13","set":"GES 106 PAPER","ref":"GES 106 Paper, Q13","q":"All these are pernicious consequences of science EXCEPT______","o":["Inadequate healthcare","Poison gas","Atomic bomb","Greenhouse gases"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Poison gas, the atomic bomb and greenhouse gases are harms linked to science. Inadequate healthcare is a lack of something science supplies, not a product of it."},{"id":"p-14","set":"GES 106 PAPER","ref":"GES 106 Paper, Q14","q":"“Every horse that has ever been observed has had a heart. Therefore, every horse has a heart” is an example of ______ argument.","o":["inductive","fallacious","deductive","sound"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The conclusion goes beyond the premises, generalising from observed horses to all horses. That makes it inductive: probable, not certain."},{"id":"p-15","set":"GES 106 PAPER","ref":"GES 106 Paper, Q15","q":"Science is the study of the natural world through the following EXCEPT______","o":["Appreciation","Observation","Theoretical explanations","Experimental investigations"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Science studies nature by observation, theory-building and experiment. 'Appreciation' is an attitude or feeling and is not a scientific method."},{"id":"p-16","set":"GES 106 PAPER","ref":"GES 106 Paper, Q16","q":"ONE of the following is a reason why philosophy is inevitable:","o":["It derives from the need for wisdom","It derives from the need for knowledge","It derives from the need for understanding","It derives from the need for..."],"a":"C","s":"Corrected. The paper file marked (A) wisdom, but your Key Points sheet says philosophy is inevitable because it derives from the need for understanding.","e":"In the course material philosophy is inevitable because it springs from the human need for understanding, to make sense of ourselves and the world. We cannot avoid asking such questions."},{"id":"p-17","set":"GES 106 PAPER","ref":"GES 106 Paper, Q17","q":"What valid argument form is represented by: “p, therefore p v q”?","o":["simplification","addition","disjunctive syllogism","hypothetical syllogism"],"a":"B","s":"Answer from your GES 106 paper file.","e":"From p we may validly infer 'p or q', because if p is true then the disjunction is true whatever q is. This rule is called addition."},{"id":"p-18","set":"GES 106 PAPER","ref":"GES 106 Paper, Q18","q":"The features of science that show that science is a rational enquiry includes all of the following EXCEPT______","o":["The demand for evidence","Identification and avoidance of biases","Non-authoritarianism","Reverence for earlier discoveries"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Rational enquiry demands evidence, avoids bias and refuses to rely on authority alone. Reverence for earlier discoveries is the opposite of that, since science tests and revises past findings."},{"id":"p-19","set":"GES 106 PAPER","ref":"GES 106 Paper, Q19","q":"The connective sign “v” is called a ______","o":["curl","wedge","Disjunct","letter"],"a":"B","s":"Answer from your GES 106 paper file.","e":"The symbol 'v' is called the wedge. It stands for disjunction, 'or'. Curl is the tilde."},{"id":"p-20","set":"GES 106 PAPER","ref":"GES 106 Paper, Q20","q":"Why do you think saying “Ethics is what my feelings tell me is right or wrong” is not an appropriate response to the question “what is ethics?”","o":["Your feelings are different from anyone else’s","Commonly, our feelings lead us astray and make us do what is unethical","We sometimes cry when we feel bad","Our feelings originate from us and not from God"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Feelings often mislead us, and people have felt fine about doing wrong things. So feelings are not a reliable basis for ethics."},{"id":"p-21","set":"GES 106 PAPER","ref":"GES 106 Paper, Q21","q":"The explanatory and predictive functions show science as a/and ______ enterprise.","o":["energetic","rational","logical","Empirical"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Explaining and predicting phenomena shows that science is a rational enterprise, because it gives reasons and builds testable theories."},{"id":"p-22","set":"GES 106 PAPER","ref":"GES 106 Paper, Q22","q":"What is a scientific fact?","o":["A scientific fact is true regardless of anyone’s cultural background","A scientific fact refers to a particular scientist’s view of the physical universe","A scientific fact is an ancient truth about the environment.","A scientific fact is a controlled, repeatable and/or rigorously verified observation"],"a":"D","s":"Answer from your GES 106 paper file.","e":"A scientific fact is an observation that is controlled, repeatable and rigorously verified. It is not just a view, an old truth or a cultural belief."},{"id":"p-23","set":"GES 106 PAPER","ref":"GES 106 Paper, Q23","q":"According to Plato, knowledge is true belief plus ______","o":["Fact","Theory","Evidence","Account"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Plato's definition in the Theaetetus is that knowledge is true belief with an account (logos), meaning a justification of why the belief is true."},{"id":"p-24","set":"GES 106 PAPER","ref":"GES 106 Paper, Q24","q":"One of the following scholars is not a founder of modern science","o":["Nicodemous Copernicus","Galileo Galilei","Nicolaus Copernicus","Johannes Kepler"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The founder of modern science is Nicolaus Copernicus. 'Nicodemous' is a made-up name, so it is the one that is not a founder."},{"id":"p-25","set":"GES 106 PAPER","ref":"GES 106 Paper, Q25","q":"In its relation to other disciplines, philosophy is both normative and ______","o":["critical","universal","prescriptive","foundational"],"a":"C","s":"Corrected. The paper file marked (A) critical, but your Key Points sheet says philosophy is both normative and prescriptive.","e":"Philosophy is normative, setting standards for how things ought to be, and prescriptive in its relation to other disciplines. It does not only describe them."},{"id":"p-26","set":"GES 106 PAPER","ref":"GES 106 Paper, Q26","q":"What are moral norms?","o":["Moral norms are laid down rules and regulations","Moral norms are informal deeds, guides, manners or standards that tell us what are permitted or forbidden","Moral norms are the rules and regulation in the academia","Moral norms refer to our idiosyncrasies and preferences"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Moral norms are informal guides, manners and standards of conduct that tell us what is permitted or forbidden. They are not laws or personal preferences."},{"id":"p-27","set":"GES 106 PAPER","ref":"GES 106 Paper, Q27","q":"“Zeth Construction Company should never be given the job of designing the new bridge. In recent years, this company has designed four bridges, and all four have collapsed. The company is clearly incompetent” is an example of what fallacy?","o":["no fallacy","circumstantial","false cause","abusive"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The conclusion is drawn from four actual collapses by the company, which is relevant evidence of incompetence. So the reasoning commits no fallacy."},{"id":"p-28","set":"GES 106 PAPER","ref":"GES 106 Paper, Q28","q":"“The United States of America and Britain would order the withdrawal of financial aid and other trade relations to Nigeria if the national assembly should prohibit same sex marriage.” The statement is an example of the fallacy of ______","o":["Division","Pity","Force","against the man."],"a":"C","s":"Answer from your GES 106 paper file.","e":"The threat of withdrawing aid is used to force a decision. Appealing to force or threat instead of reasons is the fallacy of force (ad baculum)."},{"id":"p-29","set":"GES 106 PAPER","ref":"GES 106 Paper, Q29","q":"The argument that the life of the mother should not be compromised for the survival of the foetus is proposed by the ---------------------- school","o":["Planned Parenthood","Anti-foetal","Liberal","Pro-life"],"a":"C","s":"Answer from your GES 106 paper file.","e":"The liberal school holds that the mother's life should not be compromised for the foetus. The pro-life school holds that the foetus has a right to life from conception."},{"id":"p-30","set":"GES 106 PAPER","ref":"GES 106 Paper, Q30","q":"Which, out of the following, represents one of the functions of the philosopher of science?","o":["the discovery of the laws of nature","the prediction of future events","the evaluation of scientific knowledge","the organisation of scientific knowledge"],"a":"C","s":"Answer from your GES 106 paper file.","e":"The philosopher of science evaluates scientific knowledge, asking how reliable it is and what counts as evidence. Discovering laws and predicting are the scientists' jobs."},{"id":"p-31","set":"GES 106 PAPER","ref":"GES 106 Paper, Q31","q":"The fallacy committed when the characteristics of a whole are thought to necessarily apply to its parts is called ______","o":["begging the question","division","Equivocation","composition"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Division assumes that what is true of a whole must be true of each of its parts. The reverse, parts to whole, is composition."},{"id":"p-32","set":"GES 106 PAPER","ref":"GES 106 Paper, Q32","q":"The central question in normative ethics is______","o":["What constitutes a moral standard?","Who is a moral agent?","What are the possible origins of morality?","Should I abort an unwanted pregnancy?"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Normative ethics asks what makes actions right or wrong, which is the question of what constitutes a moral standard. The other options are meta-ethics or applied ethics."},{"id":"p-33","set":"GES 106 PAPER","ref":"GES 106 Paper, Q33","q":"Treating fellow humans as ends in themselves is central to --------------------","o":["Aristotle’s mean","Archimedean Point","Kantian Categorical Imperative","Environmental Ethics"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Kant's Categorical Imperative says to treat humanity, in yourself and others, always as an end and never merely as a means."},{"id":"p-34","set":"GES 106 PAPER","ref":"GES 106 Paper, Q34","q":"'If it rains then the ground will be wet. It rains. Therefore, the ground is wet'. This is a valid form of a deductive argument called ______","o":["modus tollens","modus ponens","disjunctive syllogism","inductive ponens"],"a":"B","s":"Answer from your GES 106 paper file.","e":"'If P then Q; P; therefore Q' is modus ponens, which means affirming the antecedent. It is a valid deductive form."},{"id":"p-35","set":"GES 106 PAPER","ref":"GES 106 Paper, Q35","q":"Science assumed a practical relevance with the dawn of ______","o":["Agricultural Revolution","Medieval Revolution","Industrial Revolution","French Revolution"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Science became practically useful, producing machines and technology, with the Industrial Revolution."},{"id":"p-36","set":"GES 106 PAPER","ref":"GES 106 Paper, Q36","q":"According to Aristotle, why does society exist?","o":["To give rules and orders","To afford the citizens the opportunity of living the “good life,” that is, the life of happiness","To arrest and punish criminals","To train people in the art of scientific explorations"],"a":"B","s":"Answer from your GES 106 paper file.","e":"For Aristotle, human beings are social by nature, and society exists so citizens can live the good life, which is the life of happiness (eudaimonia)."},{"id":"p-37","set":"GES 106 PAPER","ref":"GES 106 Paper, Q37","q":"One of the following is NOT an ethical term:","o":["justice","responsibility","freedom","Proposition"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Justice, responsibility and freedom are ethical terms. 'Proposition' is a term from logic, meaning a statement that is true or false."},{"id":"p-38","set":"GES 106 PAPER","ref":"GES 106 Paper, Q38","q":"______ is a sequence of propositions in which one part known as the conclusion is claimed to follow from the others called the premises.","o":["inductive","deductive","Logic","argument"],"a":"D","s":"Answer from your GES 106 paper file.","e":"An argument is a sequence of propositions in which the conclusion is claimed to follow from the premises. Inductive and deductive are kinds of argument."},{"id":"p-39","set":"GES 106 PAPER","ref":"GES 106 Paper, Q39","q":"By ______, we refer to the business of making clearer our ideas and words.","o":["rigorous analysis","conceptual analysis","logical analysis","empirical analysis"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Conceptual analysis is clarifying our ideas and words by giving them precise meanings. It is a major philosophical activity."},{"id":"p-40","set":"GES 106 PAPER","ref":"GES 106 Paper, Q40","q":"Natural science emerged with the experimentations and observations of the following EXCEPT______","o":["Nicolas Copernicus","Karl Marx","Galileo Galilei","Johannes Kepler"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Copernicus, Galileo and Kepler were pioneers of natural science. Karl Marx was a political and economic thinker."},{"id":"p-41","set":"GES 106 PAPER","ref":"GES 106 Paper, Q41","q":"An argument is ambiguous if it denotes more than one ______","o":["meaning","conclusion","premise","reasoning"],"a":"A","s":"Answer from your GES 106 paper file.","e":"An ambiguous term or argument has more than one meaning, so the reasoning can slide between them. That is the root of fallacies of ambiguity."},{"id":"p-42","set":"GES 106 PAPER","ref":"GES 106 Paper, Q42","q":"The relationship between ethics and science is conflictual rather than mutual.","o":["No","Yes","Maybe","I do not know"],"a":"A","s":"Answer from your GES 106 paper file.","e":"False. Ethics and science are mutual: ethics guides science's use and limits, and science informs ethical decisions. So the answer 'No' to 'conflictual' is correct."},{"id":"p-43","set":"GES 106 PAPER","ref":"GES 106 Paper, Q43","q":"In logic, errors or mistakes in reasoning are called ______","o":["Invalidity","Induction","Fallacies","Soundness"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Errors or mistakes in reasoning are fallacies. Invalidity concerns the form of an argument, and soundness means a good argument."},{"id":"p-44","set":"GES 106 PAPER","ref":"GES 106 Paper, Q44","q":"Which of the following would you consider a dilemma in relation to terrorism?","o":["Securing our borders against neighbouring terrorist groups","Training our security agents to effectively combat terrorism","Prevention of foreign terrorist groups funds from reaching our local terrorist groups","Dealing with terrorists in a just manner since, it is difficult to determine whether terrorism is war or crime"],"a":"D","s":"Answer from your GES 106 paper file.","e":"A dilemma means a hard choice with no clear answer. Whether terrorism is war or crime is unclear, so dealing with terrorists justly is hard. The others are practical tasks."},{"id":"p-45","set":"GES 106 PAPER","ref":"GES 106 Paper, Q45","q":"______ is the general theory for any form of ethics based on duty or obligation","o":["descriptivism","deontologism","consequentialism","utilitarianism"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Deontologism (from deon, duty) judges actions by duty or obligation rather than outcomes. Consequentialism and utilitarianism judge by results."},{"id":"p-46","set":"GES 106 PAPER","ref":"GES 106 Paper, Q46","q":"“Everybody else is doing it, so I thought it would be a good idea too. It is high fashion.” This fallacy is called ______","o":["appeal to popular opinion","appeal to pity","appeal to emotion","appeal to fashion"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Justifying a belief with 'everybody is doing it' is an appeal to popular opinion (ad populum)."},{"id":"p-47","set":"GES 106 PAPER","ref":"GES 106 Paper, Q47","q":"Examples of conclusion indicators include the following except","o":["so, thus","hence, consequently","may be inferred from, for the reason that","it is the case that, as a result"],"a":"C","s":"Answer from your GES 106 paper file.","e":"'May be inferred from' and 'for the reason that' are premise indicators because they introduce reasons. So, thus, hence, consequently and as a result introduce conclusions."},{"id":"p-48","set":"GES 106 PAPER","ref":"GES 106 Paper, Q48","q":"Which of the following is an element of critical thinking:","o":["Factual adequacy","Factual accuracy","Factual assessment","Factual adherence"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Factual adequacy is one of the elements of critical thinking, along with logical coherence and explanatory power. The other options are not standard terms."},{"id":"p-49","set":"GES 106 PAPER","ref":"GES 106 Paper, Q49","q":"Surrogate motherhood falls under the ______ branch of ethics.","o":["Meta-ethics","Normative","Applied","Analytical"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Surrogate motherhood is a specific practical moral issue, so it belongs to applied ethics."},{"id":"p-50","set":"GES 106 PAPER","ref":"GES 106 Paper, Q50","q":"A scientific ______ is a controlled, repeatable and rigorously verified observation.","o":["Method","Theory","Fact","experiment"],"a":"C","s":"Answer from your GES 106 paper file.","e":"A fact in science is a controlled, repeatable and rigorously verified observation. A theory is an explanation of such facts."},{"id":"p-51","set":"GES 106 PAPER","ref":"GES 106 Paper, Q51","q":"Ethical philosophy concerns the nature of the following EXCEPT ______","o":["Good and bad","Right and wrong","Truth and reality.","Duty and obligation."],"a":"C","s":"Answer from your GES 106 paper file.","e":"Ethics concerns good and bad, right and wrong, and duty. Truth and reality belong to epistemology and metaphysics."},{"id":"p-52","set":"GES 106 PAPER","ref":"GES 106 Paper, Q52","q":"The view that mental states in humans are caused by physical events in the brain is known as______","o":["Materialism","Functionalism","Epiphenomenalism","Dualism"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Epiphenomenalism says physical brain events cause mental states, but mental states cause nothing in return. Interactionism says the influence runs both ways."},{"id":"p-53","set":"GES 106 PAPER","ref":"GES 106 Paper, Q53 (also GST 212 Nexus Minds Q53)","q":"The sceptical challenge arose from the belief that","o":["knowledge requires certainty","knowledge and belief are one and the same","the senses are the best source for acquiring knowledge","reason furnishes knowledge"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Sceptics began by assuming knowledge requires certainty, and since certainty seems impossible, they doubted that we can know anything."},{"id":"p-54","set":"GES 106 PAPER","ref":"GES 106 Paper, Q54 (also GST 212 Nexus Minds Q54)","q":"The aspect of philosophy which requires that you give precise meanings to your beliefs is called ______","o":["Reconstruction of ideas","Rethinking of ideas","Conceptual modification","Conceptual analysis"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Giving beliefs precise meanings is conceptual analysis, clarifying the concepts we use."},{"id":"p-55","set":"GES 106 PAPER","ref":"GES 106 Paper, Q55 (also GST 212 Nexus Minds Q55)","q":"-------------------- is defined as a group of words that is used to give meaning to other words","o":["Definiens","Definiendum","Meaning","Definition"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The definiens is the group of words that gives the meaning. The definiendum is the word being defined."},{"id":"p-56","set":"GES 106 PAPER","ref":"GES 106 Paper, Q56 (also GST 212 Nexus Minds Q56)","q":"The view that everything that happens is necessitated by what has already happened before is called ______","o":["Determinism","Cognitivism","Fatalism","Relativism"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Determinism says every event is necessitated by earlier events and the laws of nature. Fatalism instead says events are fixed regardless of what we do."},{"id":"p-57","set":"GES 106 PAPER","ref":"GES 106 Paper, Q57 (also GST 212 Nexus Minds Q57)","q":"All of us cannot be famous, because all of us cannot be well known. This is a fallacy of ______","o":["begging the question","irrelevant conclusion","ignorance","complex question"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The reasoning is circular: it uses 'famous' and 'well known' as the same thing, so the conclusion just restates the premise. That is begging the question."},{"id":"p-58","set":"GES 106 PAPER","ref":"GES 106 Paper, Q58 (also GST 212 Nexus Minds Q58)","q":"Ethics guides scientific practice by ______ and ______","o":["Ethical laws and decrees","Ethical inventions and experimentation","Ethical norms and considerations","Ethical ideas and opinions"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Ethics guides scientific practice through ethical norms (standards) and considerations such as the welfare of subjects and honesty."},{"id":"p-59","set":"GES 106 PAPER","ref":"GES 106 Paper, Q59 (also GST 212 Nexus Minds Q59)","q":"Man’s attempt at understanding, explaining and predicting his physical, biological, psychological and social world gave rise to ______","o":["Arts","Human relations","Magic","Science"],"a":"D","s":"Answer from your GES 106 paper file.","e":"People trying to understand, explain and predict the world gave rise to science."},{"id":"p-60","set":"GES 106 PAPER","ref":"GES 106 Paper, Q60 (also GST 212 Nexus Minds Q60)","q":"It is a basic assumption in science that the universe is a vast single ______ in which the basic rules are everywhere the same.","o":["organ","system","field","Law"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Science assumes the universe is one vast system in which the same basic rules apply everywhere. This is the uniformity of nature."},{"id":"p-61","set":"GES 106 PAPER","ref":"GES 106 Paper, Q61 (also GST 212 Nexus Minds Q61)","q":"What valid argument form does this argument represent: Future presidents will be allowed to serve a third term only if the Constitution is amended. The Constitution will not be amended. Therefore, future presidents will not be allowed to serve a third term","o":["Modus ponens","Modus tollens","Disjunctive Syllogism","Addition"],"a":"B","s":"Answer from your GES 106 paper file.","e":"'If P then Q; not Q; therefore not P' is modus tollens, which means denying the consequent. Here the amendment (Q) did not happen, so the third term (P) is not allowed."},{"id":"p-62","set":"GES 106 PAPER","ref":"GES 106 Paper, Q62 (also GST 212 Nexus Minds Q62)","q":"The framework of ideas and beliefs through which we interpret the world and interact with it is called ______","o":["Philosophy","Metaphysics","Worldview","Physics"],"a":"C","s":"Answer from your GES 106 paper file.","e":"A worldview is the framework of ideas and beliefs through which we interpret and live in the world."},{"id":"p-63","set":"GES 106 PAPER","ref":"GES 106 Paper, Q63 (also GST 212 Nexus Minds Q63)","q":"The two parts of a biconditional are known as ______","o":["components","antecedents","conjuncts","disjuncts"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The two parts of a biconditional ('if and only if') are called its components. Antecedent belongs to conditionals, conjuncts to conjunctions and disjuncts to disjunctions."},{"id":"p-64","set":"GES 106 PAPER","ref":"GES 106 Paper, Q64 (also GST 212 Nexus Minds Q64)","q":"“Nigeria is a peace loving country. Therefore all Nigerians are peace loving people.” This is an example of the fallacy of ______","o":["composition","hasty generalization","division","irrelevant conclusion"],"a":"C","s":"Conflict. Nexus Minds marks Composition, the paper file marks Division. Going from a whole (Nigeria) to its parts (all Nigerians) is Division, the same definition used in Q31 of this paper.","e":"The argument moves from a statement about the whole (Nigeria) to each of its parts (all Nigerians), which is the fallacy of division. Composition goes from parts to whole."},{"id":"p-65","set":"GES 106 PAPER","ref":"GES 106 Paper, Q65 (also GST 212 Nexus Minds Q65)","q":"According to ______, “arguments, like men, are often pretenders.”","o":["Aristotle","I. M. Copi","Plato","Thales"],"a":"C","s":"Answer from your GES 106 paper file.","e":"The quote 'arguments, like men, are often pretenders' is attributed to Plato in the course material. It means arguments can look sound without being so."},{"id":"p-66","set":"GES 106 PAPER","ref":"GES 106 Paper, Q66 (also GST 212 Nexus Minds Q66)","q":"The main ethical requirements for clinical research does not include a consideration of ______ towards a human or animal subject","o":["Health","Comfort","Wellbeing","Social status"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Research ethics requires care for the subject's health, comfort and wellbeing. Social status must not matter, since everyone is owed equal respect."},{"id":"p-67","set":"GES 106 PAPER","ref":"GES 106 Paper, Q67 (also GST 212 Nexus Minds Q67)","q":"______ is a traditional epistemological theory","o":["Theism","Idealism","Ontology","Rationalism"],"a":"D","s":"Answer from your GES 106 paper file.","e":"Rationalism is a traditional theory of knowledge, holding that reason is the main source of knowledge. Theism is about God, ontology is about being, and idealism is a metaphysical view."},{"id":"p-68","set":"GES 106 PAPER","ref":"GES 106 Paper, Q68 (also GST 212 Nexus Minds Q68)","q":"The methodology of science employs ______ and ______","o":["Inductive and deductive reasoning","reason and imagination","Methods and ideas","Conjectures and refutations"],"a":"A","s":"Answer from your GES 106 paper file.","e":"Science uses induction (from observations to general laws) and deduction (from laws to predictions). These two together make up its method."},{"id":"p-69","set":"GES 106 PAPER","ref":"GES 106 Paper, Q69 (also GST 212 Nexus Minds Q69)","q":"Which of the following is not a step used in scientific method?","o":["Observation and description of a phenomenon or group of phenomena","Formulation of hypothesis.","Performance of experimental tests.","Collection of license of operation from the government"],"a":"D","s":"Answer from your GES 106 paper file.","e":"The scientific method involves observation, forming a hypothesis and testing it. A government licence is administrative, not part of the method."},{"id":"p-70","set":"GES 106 PAPER","ref":"GES 106 Paper, Q70 (also GST 212 Nexus Minds Q70)","q":"The type of argument in which the premises provide conclusive grounds for the conclusion is known as ______","o":["Inductive argument","Sound argument","Deductive argument","Conclusive argument"],"a":"C","s":"Answer from your GES 106 paper file.","e":"In a deductive argument the premises give conclusive support, so if they are true the conclusion must be true. Inductive arguments only make it probable."},{"id":"p-71","set":"GES 106 PAPER","ref":"GES 106 Paper, Q71 (also GST 212 Nexus Minds Q71)","q":"It was the love of wisdom and the pursuit of knowledge for its own sake that motivated the ______ philosophers.","o":["Ionian","Scholastic","medieval","Cartesian"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The Ionian philosophers (Thales, Anaximander, Anaximenes) were the first Greek philosophers, driven by love of wisdom and knowledge for its own sake."},{"id":"p-72","set":"GES 106 PAPER","ref":"GES 106 Paper, Q72 (also GST 212 Nexus Minds Q72)","q":"Philosophy of law refers to the ______ activities of trained philosophers in the realm of law","o":["legal","theoretical","intelligent","adversarial"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Philosophy of law is the theoretical or reflective work of trained philosophers on law, as opposed to the practical work of lawyers."},{"id":"p-73","set":"GES 106 PAPER","ref":"GES 106 Paper, Q73 (also GST 212 Nexus Minds Q73)","q":"The basic claim of care ethics is that ______","o":["The government should be responsible for taking care of the sick in the society","The solution to moral problems is not to appeal to rules or principles but how to maintain the relationship that exists between people","Human beings ought to care for one another","Ethics is not a matter of sentiments and feelings"],"a":"B","s":"Conflict. Nexus Minds marks (C) Human beings ought to care for one another, the paper file marks (B). (B) is the standard statement of care ethics: relationships over rules.","e":"Care ethics rejects rules and principles as the answer and stresses maintaining caring relationships between people, which is why it is called relational."},{"id":"p-74","set":"GES 106 PAPER","ref":"GES 106 Paper, Q74 (also GST 212 Nexus Minds Q74)","q":"Propositional ______ consist of lower case letters p, q, r, s, t, u, v, w, x, y, z.","o":["connectives","constants","variables","Symbols"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Propositional variables are the lower-case letters (p, q, r...) that stand for statements. Connectives are symbols like v and ~."},{"id":"p-75","set":"GES 106 PAPER","ref":"GES 106 Paper, Q75 (also GST 212 Nexus Minds Q75)","q":"Beneficence, non-maleficence, justice and -------------------- are some common set of goals, ethics and science aim to engender in the society","o":["Exploitation","Marginalization","Respect for autonomy","Self-interest"],"a":"C","s":"Answer from your GES 106 paper file.","e":"Beneficence, non-maleficence, justice and respect for autonomy are the four principles of biomedical ethics that science and ethics both aim to promote."},{"id":"p-76","set":"GES 106 PAPER","ref":"GES 106 Paper, Q76 (also GST 212 Nexus Minds Q76)","q":"The interrogation of the foundations of scientific claims, laws and theories is central to -------------------- order activity of philosophy.","o":["Technical","Second","Academic","First"],"a":"B","s":"Answer from your GES 106 paper file.","e":"Questioning the foundations of scientific claims, laws and theories is a second-order activity, because it is about the discipline and not about nature itself. Philosophy of science does this."},{"id":"p-77","set":"GES 106 PAPER","ref":"GES 106 Paper, Q77 (also GST 212 Nexus Minds Q77)","q":"In order for science to be meaningful and ethical, it must ______","o":["Make new discoveries every year","Advance human interest, welfare and happiness","Find cure to HIV/AIDS","Admit only competent individuals into the scientific community"],"a":"B","s":"Answer from your GES 106 paper file.","e":"For science to be meaningful and ethical it must serve human interest, welfare and happiness. Discoveries alone, or a single cure, do not define its purpose."},{"id":"p-78","set":"GES 106 PAPER","ref":"GES 106 Paper, Q78 (also GST 212 Nexus Minds Q78)","q":"What fallacy is committed in the following passage: So these are your grounds for criticizing the way we treat our native population. In answer, let me just say, “Who was it that killed most of the American Indians?”","o":["argumentum ad hominem","Argumentum ad baculum","Argumentum ad ignorantiam","Argumentum ad verecundiam"],"a":"A","s":"Answer from your GES 106 paper file.","e":"The speaker dodges the criticism by attacking the critics' country's past ('who killed the American Indians?'). Attacking the person instead of the point is argumentum ad hominem."},{"id":"p-79","set":"GES 106 PAPER","ref":"GES 106 Paper, Q79 (also GST 212 Nexus Minds Q79)","q":"“All egrets are white because all the egrets that I have seen are white.” This argument is ______","o":["conjunctive","inductive","deductive","unsound"],"a":"B","s":"Answer from your GES 106 paper file.","e":"The conclusion about all egrets is drawn from egrets seen so far, so it goes beyond the evidence and is only probable. That makes it an inductive argument."},{"id":"p-80","set":"GES 106 PAPER","ref":"GES 106 Paper, Q80 (also GST 212 Nexus Minds Q80)","q":"The argument: “All cows have kidneys and have lungs. All horses have kidneys and have lungs. All humans have kidneys and have lungs. Therefore, all animals with kidneys have lungs” is an example of ______ argument","o":["sound","deductive","inductive","Fallacious"],"a":"C","s":"Conflict. Nexus Minds marks Fallacious, the paper file marks Inductive. It generalises from cows, horses and humans to all animals with kidneys, which is the inductive pattern (like the egrets question).","e":"The conclusion generalises from a few observed animals to all animals with kidneys. A generalisation from samples is inductive: probable, not guaranteed."},{"id":"p-81","set":"GES 106 PAPER","ref":"GES 106 Paper, Q81 (also GST 212 Nexus Minds Q81)","q":"Surrogacy is a moral dilemma because______","o":["People should not sell their relatives.","What is right seems to lie somewhere between the interest of the surrogate, that of the commissioning parents and that of the child to be born using the surrogate process.","Those who buy children from their mothers are wicked because the maternal cord between a mother and her child should not be snapped.","I do not support surrogacy."],"a":"B","s":"Answer from your GES 106 paper file.","e":"Surrogacy is a dilemma because the interests of the surrogate, the commissioning parents and the child pull in different directions, and the right answer lies somewhere among them."},{"id":"g-1","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q1 (also GST 212 General Test Type C Q19)","q":"The standards by which moral issues are weighed in order to determine whether they are right or wrong are called:","o":["Ethical theories","Utilitarianism","Virtue ethics","Egoism"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Ethical theories are the standards used to weigh moral issues as right or wrong. Utilitarianism, virtue ethics and egoism are particular theories, not the general term."},{"id":"g-2","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q2","q":"Which theory holds that the rightness or wrongness of an action depends solely on its consequences?","o":["Deontological ethical theories","Consequentialist or teleological ethical theories","Relativism","Altruism"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Consequentialist (teleological) theories judge an action only by its results. Deontological theories judge by duty or rules."},{"id":"g-3","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q3","q":"Which theory holds that whether a particular action is right or wrong depends on the character of the doer?","o":["Utilitarianism","Kant's Categorical Imperative","Virtue ethics","Feminism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Virtue ethics focuses on the character of the person acting (honest, courageous, just) rather than on rules or results."},{"id":"g-4","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q4","q":"Below are some of the reasons why people ought to live a moral life, except:","o":["Sociological reasons","Psychological reasons","Theological reasons","The law of Karma"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Society (sociological), mind (psychological) and God (theological) are standard reasons for living morally. The law of Karma is a religious doctrine from Eastern traditions, and it is not in this list."},{"id":"g-5","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q5","q":"According to Wolters (1983:5), a perspective on things, a way of looking at the cosmos from a particular vantage point is called:","o":["Nature","Reflection","Experience","Worldview"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"A worldview is a perspective, a way of looking at the cosmos from a particular standpoint. Nature, reflection and experience do not carry that meaning."},{"id":"g-6","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q6 (also Philosophy Batch B Q6)","q":"The ______ philosophy searches for a comprehensive set of beliefs and ideas that acts as a general vision or perspective about the universe, a person's place in the universe, and possible goals and objectives a person may pursue in the universe.","o":["Wisdom","Courage","Worldview","Criticism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Worldview philosophy looks for a comprehensive set of beliefs giving a general vision of the universe and our place in it."},{"id":"g-7","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q7","q":"________ is the theory of knowledge.","o":["Ethics","Epistemology","Meta-ethics","Metaphysics"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Epistemology is the theory of knowledge. Metaphysics is about reality and ethics is about morality."},{"id":"g-8","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q8","q":"Materialism takes ______ as what is real.","o":["Ideas","Being and non-being","Matter","God"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Materialism says matter is the only reality, and everything else, including mind, comes from or reduces to matter."},{"id":"g-10","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q10","q":"The challenge of scepticism is a:","o":["Metaphysical problem","Epistemological problem","Ethical problem","Logical problem"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Scepticism asks whether we can know anything for certain, which is a question about knowledge. So it is an epistemological problem."},{"id":"g-11","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q11","q":"These groups of epistemologists are of the opinion that we can only have knowledge about the world through our senses of touch, sight, taste, hearing and smell.","o":["Empiricists","Sophists","Rationalists","Positivists"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Empiricists hold that all knowledge comes through the senses and experience. Rationalists put reason first."},{"id":"g-12","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q12 (also Philosophy Batch B Q12)","q":"Philosophy raises ______ questions on the fundamental discourses or issues within Philosophy.","o":["Second-order","First-order","No questions","Third-order"],"a":"B","s":"Conflict. Nexus Minds marks Second-order, Batch B marks First-Order. Issues within philosophy are first-order; the next question (foundations of other disciplines) is the second-order one.","e":"First-order questions are the core questions within philosophy itself, such as what is real, what can we know and how should we live. Second-order questions are about the foundations of other disciplines."},{"id":"g-13","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q13","q":"Philosophy raises questions concerning the foundation and basis of other disciplines through the ______ questions.","o":["The First-Order","The Third-Order","The Second-Order","No questions"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Second-order questions are the ones philosophy raises about the foundations and basis of other disciplines, such as the philosophy of science and the philosophy of law."},{"id":"g-14","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q14","q":"________ is the branch of Philosophy that studies reality.","o":["Logic","Ethics","Epistemology","Metaphysics"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Metaphysics studies the nature of reality and existence. Logic is about reasoning and epistemology is about knowledge."},{"id":"g-15","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q15","q":"________ is also known as moral philosophy.","o":["Epistemology","Metaphysics","A and B","Ethics"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Ethics is called moral philosophy because it studies morality: right and wrong, good and bad."},{"id":"g-16","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q16","q":"________ is that aspect of logic that analyses arguments that occur in natural language, that is, everyday ordinary language.","o":["Informal Logic","Philosophy","Formal Logic","Argument"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Informal logic analyses arguments in everyday natural language. Formal logic uses symbols and structure."},{"id":"g-17","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q17","q":"The identification, examination and analysis of mistakes or errors in reasoning is called:","o":["Metaphysics","Fallacies","Ordinary language","The law of excluded middle"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The study of mistakes in reasoning is the study of fallacies."},{"id":"g-18","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q18 (also Philosophy Batch B Q18)","q":"Which law maintains that if any statement is true, then it is true?","o":["The law of contradiction","The law of excluded middle","The law of identity","The law of thought"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The law of identity says that if a statement is true, it is true: A is A. Contradiction rules out being both true and false, and excluded middle says it must be one or the other."},{"id":"g-19","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q19","q":"In an ______ one reasons from particular premises to a universal conclusion.","o":["Deductive argument","Ordinary argument","Indicative argument","Inductive argument"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Inductive reasoning goes from particular cases to a general or universal conclusion. Deductive reasoning goes the other way."},{"id":"g-20","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q20","q":"________ assert that every statement is either true or false.","o":["The law of contradiction","The law of identity","None of the above","The law of excluded middle"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The law of excluded middle says every statement is either true or false, with no third option. It is 'P or not P'."},{"id":"g-21","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q21","q":"Feminist or care ethics emphasizes:","o":["The consequences of actions","Duties and obligations","Individual virtues","Relationships and care"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Feminist or care ethics stresses relationships, care and responsibility to others, not rules or consequences."},{"id":"g-22","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q22","q":"A priori knowledge is knowledge from ______.","o":["Senses","Reason","Truth","Knowledge"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"A priori knowledge comes from reason alone, independent of experience, as in mathematics and logic."},{"id":"g-23","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q23","q":"The theory which traces the origin of ethics to God is ______.","o":["Consequentialism","Utilitarianism","Divine command theory","Egoism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Divine command theory says morality comes from God: what God commands is right."},{"id":"g-24","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q24","q":"________ studies the nature, origin, foundation, extent and limits of human knowledge.","o":["Rationalism","Knowledge","Metaphysics","Epistemology"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Epistemology studies the nature, origin, foundation, extent and limits of knowledge."},{"id":"g-25","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q25","q":"What is the primary concern of metaphysics?","o":["Investigating moral principles","Exploring the nature of reality and existence","Studying the principles of artistic beauty","Understanding the functions of government"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Metaphysics asks about the ultimate nature of reality and existence."},{"id":"g-26","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q26","q":"Which of these terms best describes the concept of a government by the people, where citizens exercise power by voting?","o":["Authority","Democracy","Sovereignty","Liberty"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Democracy means rule by the people, who exercise power through voting."},{"id":"g-27","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q27","q":"Two famous schools of thought discussed in Epistemology are ______ and ______.","o":["A priori and A posteriori","Rationalism and Empiricism","Inductive and Deductive","None of the above"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The two classic schools of epistemology are rationalism (reason is the source of knowledge) and empiricism (experience is)."},{"id":"g-28","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q28","q":"________ is the study of the foundation of things, the study of what makes up the universe.","o":["Metaphysics","Ethics","Epistemology","All of the above"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Metaphysics studies the foundation of things and what the universe is made of."},{"id":"g-29","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q29","q":"Which theory posits that the mind and body are distinct but interact with each other?","o":["Materialism","Idealism","Dualism","Behaviorism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Dualism says mind and body are two distinct things that interact. Materialism says only matter exists."},{"id":"g-30","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q30","q":"Philosophical problems are ______ in nature.","o":["Universal","Dualistic","Materialistic","Similar"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Philosophical problems such as the nature of reality, knowledge and morality are universal: they arise in every society and age."},{"id":"g-31","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q31","q":"________ is the denial of the possibility of knowledge.","o":["Rationalism","Empiricism","Idealism","Scepticism"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Scepticism denies that knowledge is possible, or says certainty cannot be reached."},{"id":"g-32","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q32","q":"________ is a variant of dualism that began as a response to the mind-body problem.","o":["Monism","Occasionalism","Hedonism","Relativism"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Occasionalism is a variant of dualism that tried to solve how a non-physical mind can act on a physical body, by saying God causes the match between them on each occasion."},{"id":"g-33","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q33","q":"Critical thinking demands that worldviews are examined for one of the following elements:","o":["Factual thrownness","Logical coherence","Explanational stuck","Epistemic deficit"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Worldviews are examined for factual adequacy, logical coherence and explanatory capacity. Only 'logical coherence' is a real element in the options."},{"id":"g-34","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q34","q":"________ refers to a situation whereby someone is faced with two alternatives, neither of which is satisfactory, but from which one has to choose one or the other.","o":["Moral dilemma","Moral cognitive","Moral appraisal","Perennial moral issue"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"A moral dilemma means two choices, both unsatisfactory, and one must be chosen."},{"id":"g-35","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q35","q":"A fallacy can be defined as:","o":["Social contract","An error in reasoning","Abstract idea","A philosophical argument"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"A fallacy is an error in reasoning, an argument that looks good but is flawed."},{"id":"g-36","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q36","q":"This group of philosophers deny the possibility of knowledge.","o":["Rationalists","Skeptics","Empiricists","Constructivists"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Sceptics deny that knowledge is possible. Rationalists and empiricists argue about where knowledge comes from, not whether it exists."},{"id":"g-37","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q37","q":"Knowledge whose judgment and validity is independent of experience is called:","o":["A priori knowledge","Synthetic a priori knowledge","A posteriori knowledge","Independent knowledge"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"A priori knowledge is independent of experience, such as 2+2=4 or 'all bachelors are unmarried'. A posteriori knowledge depends on experience."},{"id":"g-38","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q38","q":"The branch of philosophy that asks 'What can we know?' 'How can we know?' and 'Are we sure of what we know?' is called:","o":["Metaphysics","Philosophy of science","Epistemology","Logic"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Epistemology asks what we can know, how we know it and whether we can be sure."},{"id":"g-39","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q39 (also Philosophy Batch B Q17)","q":"Informal logic is:","o":["Only concerned with symbolic expressions","Focused on ordinary language and everyday reasoning","The study of syllogisms only","Not really logic"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Informal logic deals with ordinary language and everyday arguments, not symbols."},{"id":"g-40","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q40","q":"________ is a systematic process of being sceptical about the truth of one's beliefs.","o":["Methodic thinking","Methodic doubt","Methodic style","Methodic step"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Methodic doubt, associated with Descartes, means doubting your beliefs systematically to find what is certain."},{"id":"g-82","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q82","q":"________ is not a definition of scientific method.","o":["Scientific method refers to the way of winnowing the truth from lies and delusions","Scientific method is the process by which scientists construct a reliable, consistent and non-arbitrary representation of the world","Scientific method is the procedure used in the discovery of a life of tranquillity","Scientific method refers to the standard procedures and criteria, to minimize cultural influences when developing a theory"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Scientific method is about finding reliable, non-arbitrary knowledge of the world through standard procedures. 'Discovery of a life of tranquillity' has nothing to do with it."},{"id":"g-83","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q83","q":"Identify the fallacy committed by this statement: 'The Marlboro Man represents the ultimate in masculinity. Marlboro cigarettes — for those who stand out as real men.'","o":["Appeal to people","Appeal to ignorance","Appeal to taste","Appeal to authority"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The ad appeals to what 'real men' do and want, which is an appeal to people (popular sentiment or group belonging), not to evidence about the cigarettes."},{"id":"g-84","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q84","q":"'All bachelors are unmarried men. Adeolu is a bachelor. Consequently, Adeolu is an unmarried man.' This is a typical example of:","o":["Predictive argument","Explanatory argument","Deductive argument","Fallacious argument"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"If the premises are true the conclusion must be true, because 'bachelor' means 'unmarried man'. That is a deductive argument."},{"id":"g-85","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q85","q":"A fallacy of ______ is committed when counsel appealed that his client should be acquitted of murder because he is a widower.","o":["Appeal to authority","Appeal to pity","Against the man","Irrelevant conclusion"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The counsel asks for acquittal because of the client's widowhood (sympathy) and not because of the facts. That is an appeal to pity."},{"id":"g-86","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q86","q":"The challenge between better understanding and thoughtful evaluation requires bridging the gap between ______ and ______.","o":["Truth and falsehood","Theory and practice","Reality and appearance","Wisdom and folly"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Understanding ideas and evaluating them thoughtfully needs bridging theory and practice, since knowing the ideas is not the same as applying them."},{"id":"g-87","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q87","q":"Pantheism holds that:","o":["God is not identical with nature","God is identical with nature","There is a plurality of Gods","Only one God exists"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Pantheism (pan = all, theos = God) says God is identical with nature, so God and the universe are one."},{"id":"g-88","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q88","q":"'The moon was full on Thursday evening and on Friday morning, I overslept. Therefore, the full moon caused me to oversleep.' This is an error in reasoning known as:","o":["Irrelevant conclusion","False cause","Ignorance","Emotion"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The argument takes something that happened before as the cause, just because one came after the other. That is the fallacy of false cause."},{"id":"g-89","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q89","q":"The fallacy of ______ is committed when it is argued that a proposition is true simply because it has not been proved false, or false because it has not been proved true.","o":["Irrelevant conclusion","Ignorance","Begging the question","Accident"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Claiming something is true because it has not been disproved is the fallacy of ignorance (argumentum ad ignorantiam)."},{"id":"g-90","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q90","q":"'God is the creator of everything that exists because the Bible says so and the Bible is the word of God.' This argument commits the fallacy of:","o":["Beggi
