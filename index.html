itically examines concepts such as:","o":["Causality, objectivity, and scientific truth","Divine revelation and spiritual redemption","Truth tables and formal syllogisms","Normative rules of art evaluation"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy of science examines science's key concepts, such as causality, objectivity and scientific truth, and how science works."},{"id":"ca-30","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q30","q":"Who stated that \"Knowledge is power\"?","o":["Socrates","Francis Bacon","Kwasi Wiredu","Bertrand Russell"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"'Knowledge is power' is attributed to Francis Bacon, who argued that science and knowledge give humans mastery over nature."},{"id":"gc-1","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q1","q":"Which of the following is an epistemological problem?","o":["The problem of scepticism","The problem of God’s existence","Making sense of people’s moral actions","The mind/body problem"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Scepticism asks whether we can know anything for certain, so it is about knowledge, which makes it epistemological. The others are metaphysical or ethical."},{"id":"gc-2","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q2","q":"A trait or character that is admired because it makes its possessor better either morally or intellectually in the conduct of affairs is:","o":["Virtue","Ideas","Utility","Morality"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A virtue is a trait of character admired because it makes its possessor better, morally or intellectually."},{"id":"gc-3","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q3","q":"The doctrine that universals have a real objective existence is known as ______","o":["Nominalism","Objectivism","Realism","Externalism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Realism holds that universals (such as 'redness' or 'justice') really exist objectively. Nominalism says only particular things exist and universals are mere names."},{"id":"gc-4","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q4","q":"_______ is the philosopher who sees the discipline of philosophy as an “Archimedean point”.","o":["Franz Boas","Clifford Geertz","Rene Descartes","Aristotle"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"An Archimedean point is a fixed, certain place to stand on from which to move or judge everything. Descartes sought one in his 'I think, therefore I am'."},{"id":"gc-5","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q5","q":"The focus on how an individual in a society sees the world and understands it is known _______","o":["Exposure","Worldview","Acculturation","Intuition"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A worldview is how a person or society sees and understands the world."},{"id":"gc-6","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q6","q":"According to -----------, matter constitutes the basis of all that exist in the universe. Thus, all reality is reduced to matter.","o":["Idealism","Materialism","Rationalism","Realism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Materialism holds that matter is the basis of everything, and all reality reduces to matter."},{"id":"gc-7","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q7","q":"One of these is a premise indicator.","o":["Hence","As a result","Because","Therefore"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Premise indicators, such as because, since and for, introduce reasons. Hence, therefore and as a result introduce conclusions."},{"id":"gc-8","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q8","q":"Name the fallacy committed when one appeals to force or the threat of force to cause the acceptance of a belief or position.","o":["Argumentum ad Hominem","Inductive Fallacy","Argumentum ad Baculum","Ignoratio Elenchi"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Appealing to force or threat to make someone accept a view is argumentum ad baculum (appeal to the stick)."},{"id":"gc-9","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q9","q":"In what type of argument do the premises give total and conclusive support to the conclusion?","o":["Inductive argument","Systematic argument","Natural argument","Deductive argument"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"In a deductive argument the premises give total and conclusive support. In an inductive argument the support is only probable."},{"id":"gc-12","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q12","q":"A philosopher is a lover of wisdom; he/she is also------ (i) a formulator of human culture (ii) a custodian of human culture (iii) a preserver of human race.","o":["i only","ii only","All of the above","iii only"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"In the course material the philosopher, as a lover of wisdom, is also treated as a formulator, custodian and preserver of human culture and the human race. So all three statements apply."},{"id":"gc-13","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q13","q":"The following constitute ethical problems: (i) abortion, (ii) euthanasia, (iii) global warming, (iv) surrogacy.","o":["i, ii and iv","ii and iii","All of the above","iii and iv"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Abortion, euthanasia, global warming (environmental ethics) and surrogacy are all raised as ethical problems in the course, so all four count. This matches the Type B version of the question."},{"id":"gc-15","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q15","q":"Apriori knowledge refers to;","o":["Knowledge gotten by investigation","Knowledge gotten through experience","Any knowledge claim a person makes","Knowledge derived from reason"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A priori knowledge is derived from reason, independent of experience, as with mathematics and logic."},{"id":"gc-16","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q16","q":"One of the following is false","o":["First order questions in philosophy are questions which concerns the issues or core inquires of philosophy","Second order questions in philosophy are questions Philosophers raise as regards the foundations and basis of other disciplines","Neither first-order or second-order questions are a part of philosophical questioning","Metaphysics is a core branch of Philosophy"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The false statement is C: first-order and second-order questions are both part of philosophical questioning. The other statements are true."},{"id":"gc-17","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q17","q":"One of the reasons why philosophy is inevitable is because;","o":["Human beings cannot do without making arguments or causing conflict for one another","Every student has to compulsorily offer a course in philosophy before graduating from the university","Philosophy appeals to curiosity which is a basic element of humanity, and deals with the desire to know by asking fundamental questions.","Most western theories have philosophical underpinnings"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy is inevitable because curiosity is basic to humans, and it leads us to ask fundamental questions. The other options are incidental or untrue."},{"id":"gc-18","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q18","q":"One major philosophical problem is the mind-body problem. What does this problem primarily concern?","o":["The nature of moral values and conscience in determining human actions","The relationship between the mind and the body","The origins of knowledge between the mind and the body","The existence of God and human anatomy"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The mind-body problem asks how the mind and the body are related, and whether they are the same thing or two interacting things."},{"id":"gc-20","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q20","q":"Pick out the odd one among the following","o":["Jurisprudence","Ethics","Philosophy of education","Philosophy of religion"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Ethics is itself a main branch of philosophy, while jurisprudence, philosophy of education and philosophy of religion are applied 'philosophy of...' fields."},{"id":"gc-23","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q23","q":"Two main subdivisions of Logic are ____________.","o":["Formal and Informal","Sound and Unsound","Contemporary and Ancient","Premises and conclusion"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Logic divides into formal logic (symbols and structure) and informal logic (natural language arguments)."},{"id":"gc-25","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q25","q":"What makes an argument valid is_______","o":["When the statements or propositions are true.","When the statements or propositions are false.","When the statements or propositions are logically connected.","All of the above."],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"An argument is valid when its statements are logically connected, so the conclusion follows from the premises. Validity concerns form, not whether the statements are true."},{"id":"gc-26","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q26","q":"___________ and ___________ are among the conditions for a sound argument.","o":["Validity and strength","Soundness and truth","Validity and Truth","Universality and truth"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A sound argument needs validity (correct logical form) and truth (true premises)."},{"id":"gc-27","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q27","q":"Fallacy of ambiguity is a subdivision of ____________","o":["informal fallacy","formal fallacy","Inductive argument","Deductive argument"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Fallacies of ambiguity (equivocation, amphiboly, accent) are informal fallacies, which depend on content and language, not on the form of the argument."},{"id":"gc-28","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q28","q":"“No Statement can be both true and false. In other words, every statement of the form P . ~P (P and not P) is false.” The above statement is true of which law/principle of thought?","o":["Law of Deduction","Law of Identity","Law of Excluded Middle","Law of Contradiction"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The law of contradiction says no statement can be both true and false: P and not-P is always false."},{"id":"gc-29","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q29","q":"Identify the fallacy committed when pity is appealed to for the sake of getting a conclusion accepted where the conclusion is concerned with a question of fact rather than a matter of sentiments.","o":["Petitio Principii","Fallacy of Equivocation","Argumentum ad Ignorantiam","Argumentum ad Miscericordiam"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Appealing to pity (argumentum ad misericordiam) to win acceptance of a factual claim is irrelevant, since pity says nothing about what is true. Petitio principii is begging the question."},{"id":"gc-30","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q30","q":"Errors or mistakes in reasoning could be termed____________.","o":["Argument","Conclusion","Fallacy","Premise"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Errors in reasoning are called fallacies."},{"id":"gc-31","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q31","q":"Which theory holds that an action is right or wrong if it favours the individual?","o":["Deontological theory","Relative theory","Egoism","Teleological Theory"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Egoism says an action is right if it favours the individual, meaning the agent. Deontological and teleological theories are about duty and consequences."},{"id":"gc-32","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q32","q":"In logic, relational terms and phrases are treated as types of logical predicates. These predicates are __________ and ___________","o":["Monadic and Polyadic predicates","Monadic and Dualic predicates","Polyadic and relative predicates","relative and dualic predicates"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Relational terms are treated as monadic (one-place) and polyadic (many-place) predicates. A monadic predicate applies to one thing, as in 'x is tall'. A polyadic one relates several, as in 'x is taller than y'."},{"id":"gc-33","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q33","q":"Examples of premise indicator are all of the following but one","o":["Since","Other wise","Thus","Because"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Since and because introduce premises. 'Thus' introduces a conclusion, so it is the odd one out. 'Other wise' is not a standard indicator at all."},{"id":"gc-35","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q35","q":"This statement, \"Smith will eat bread for breakfast or he will go hungry,\" can be logically represented as","o":["P:Q","P>Q","P=Q","PvQ"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"'Or' is symbolised with the wedge 'v', so 'bread or hungry' is PvQ."},{"id":"gc-37","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q37","q":"Validity or invalidity of an argument depends on the truth or falsehood of statements or propositions that make-up the argument.","o":["Correct","Incorrect","Undetermined","None of the above"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Incorrect. Validity depends on the logical form, that is, on whether the conclusion follows from the premises, not on whether the statements are true. A valid argument can have false premises."},{"id":"gc-38","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q38","q":"“The end of a thing is perfection; death is the end of life. Therefore, death is perfection of life.” The above statement commits which type of fallacy?","o":["Fallacy of Equivocation","Ignoratio Elenchi","Argumentum ad Populum","Fallacy of Division"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The word 'end' shifts meaning, from aim or purpose in the first premise to termination in the second. Using a word in two senses is the fallacy of equivocation."},{"id":"gc-39","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q39","q":"Concepts that reflect tangible objects or things are known as _______________","o":["Abstract concepts","Concrete concepts","Ideological concepts","Tangible concepts"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Concrete concepts stand for tangible, physical things (a table, a river). Abstract concepts stand for things you can't touch, like justice."},{"id":"gc-40","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q40","q":"A situation whereby one is confronted with making a moral choice and either of the alternative is difficult to satisfy is called _______","o":["Ethical situationism","Moral dilemma","Principles","Principilism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A moral dilemma is a choice between alternatives that are each hard to satisfy morally."}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
  return e;}
const KEYSTORE='philosophy-cbt-user-keys';
let userKeys={};
try{userKeys=JSON.parse(localStorage.getItem(KEYSTORE)||'{}')||{}}catch(e){userKeys={}}
function saveKeys(){try{localStorage.setItem(KEYSTORE,JSON.stringify(userKeys))}catch(e){}}
const keyOf=q=>q.a||userKeys[q.id]||null;
const PAST=['GES 106 FIRST TEST','GES 106 GENERAL TEST','GES 106 TYPE B','GES 106 PAPER','GST 212 NEXUS MINDS','PHILOSOPHY BATCH B','GST 212 CA TEST','GST 212 GENERAL TEST (TYPE C)'];
const ALLSETS=[...new Set(DATA.map(q=>q.set))];
const BANK=ALLSETS.filter(s=>!PAST.includes(s));
const S={view:'setup',sel:new Set(PAST),opts:{mode:'exam',count:60,minutes:45,timed:true,shuffle:true,unkeyed:true,minEdited:false},exam:null,result:null,filter:'all'};
let timer=null;
const fmt=t=>{t=Math.max(0,t);const hh=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return (hh?hh+':':'')+String(m).padStart(2,hh?'0':'0')+':'+String(s).padStart(2,'0')};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setBar(content){const b=$('#bar');b.replaceChildren();b.hidden=!content;if(content)b.append(...content)}

/* ---------- setup ---------- */
function pool(){return DATA.filter(q=>S.sel.has(q.set)&&(S.opts.unkeyed||keyOf(q)))}
function renderSetup(){
  clearInterval(timer);S.view='setup';setBar(null);
  const root=$('#app');root.replaceChildren();
  const boxes={};
  const group=(sets)=>h('div',{class:'checks'},sets.map(s=>{
    const total=DATA.filter(q=>q.set===s).length;
    const cb=h('input',{type:'checkbox',checked:S.sel.has(s),onchange:e=>{e.target.checked?S.sel.add(s):S.sel.delete(s);poolChanged()}});
    boxes[s]=cb;
    return h('label',{class:'chk'},cb,h('span',{class:'t'},s),h('span',{class:'n'},total+' Qs'))}));
  const count=h('input',{type:'number',id:'count',min:1,value:S.opts.count,oninput:e=>{S.opts.count=+e.target.value||1;if(!S.opts.minEdited){S.opts.minutes=Math.max(1,Math.ceil(S.opts.count*.75));minutes.value=S.opts.minutes}sum()}});
  const minutes=h('input',{type:'number',id:'minutes',min:1,value:S.opts.minutes,oninput:e=>{S.opts.minutes=+e.target.value||1;S.opts.minEdited=true}});
  const summary=h('div',{class:'summary',id:'summary','aria-live':'polite'});
  const startBtn=h('button',{class:'btn primary',id:'start',onclick:start},'Start test');
  function sum(){
    const p=pool();const keyed=p.filter(keyOf).length;
    count.max=p.length;
    summary.textContent=p.length?`${p.length} questions available · ${keyed} with answer key · will use ${Math.min(S.opts.count,p.length)}`:'Pick at least one source';
    startBtn.disabled=!p.length;}
  function poolChanged(){const p=pool();S.opts.count=p.length||1;count.value=S.opts.count;
    if(!S.opts.minEdited){S.opts.minutes=Math.max(1,Math.ceil(S.opts.count*.75));minutes.value=S.opts.minutes}sum()}
  function start(){const p=pool();if(!p.length)return;
    const n=Math.min(Math.max(1,S.opts.count),p.length);
    let qs=S.opts.shuffle?shuffle(p).slice(0,n):p.slice(0,n);
    startExam(qs,S.opts.minutes,S.opts.timed)}
  const tm=h('input',{type:'checkbox',id:'timed',checked:S.opts.timed,onchange:e=>{S.opts.timed=e.target.checked;minutes.disabled=!S.opts.timed}});
  minutes.disabled=!S.opts.timed;
  root.append(
    h('h1',{text:'Philosophy CBT Practice'}),
    h('p',{class:'muted',text:'GES 106 and GST 212 past questions, word for word. After you submit, the note under each question says where its answer came from.'}),
    h('div',{class:'setup'},
      h('section',{class:'panel'},
        h('h2',{text:'Your Philosophy question sets'}),group(PAST),
        BANK.length?h('h2',{style:'margin-top:20px',text:'MCQ bank by chapter'}):null,BANK.length?group(BANK):null,
        h('div',{class:'row',style:'margin:14px 0 0'},
          h('button',{class:'btn',onclick:()=>{ALLSETS.forEach(s=>S.sel.add(s));ALLSETS.forEach(s=>boxes[s].checked=true);poolChanged()}},'Select all'),
          h('button',{class:'btn',onclick:()=>{S.sel.clear();ALLSETS.forEach(s=>boxes[s].checked=false);poolChanged()}},'Clear'))),
      h('section',{class:'panel'},
        h('h2',{text:'Test settings'}),
        h('div',{class:'modes',role:'radiogroup','aria-label':'Mode'},
          [['exam','Exam mode','Answers stay hidden until you submit. Timed by default.'],['practice','Practice mode','See the correct answer as soon as you pick an option. Untimed by default.']].map(([v,t,d])=>
            h('label',{class:'mode'},h('input',{type:'radio',name:'mode',value:v,checked:S.opts.mode===v,onchange:()=>{S.opts.mode=v;S.opts.timed=v==='exam';tm.checked=S.opts.timed;minutes.disabled=!S.opts.timed}}),h('b',{},t),h('small',{},d)))),
        h('div',{class:'row'},
          h('div',{class:'field'},h('label',{for:'count'},'Questions'),count),
          h('div',{class:'field'},h('label',{for:'minutes'},'Minutes'),minutes)),
        h('label',{class:'tick'},tm,h('span',{},'Timed test (auto-submits at zero)')),
        h('label',{class:'tick'},h('input',{type:'checkbox',id:'shuf',checked:S.opts.shuffle,onchange:e=>S.opts.shuffle=e.target.checked}),h('span',{},'Shuffle questions (options keep their original order)')),
        h('label',{class:'tick'},h('input',{type:'checkbox',id:'unk',checked:S.opts.unkeyed,onchange:e=>{S.opts.unkeyed=e.target.checked;poolChanged()}}),h('span',{},'Include questions with no answer key (shown, not scored)')),
        summary,startBtn)));
  sum();
}

/* ---------- exam ---------- */
function startExam(qs,minutes,timed){
  S.exam={mode:S.opts.mode,qs,ans:{},flags:new Set(),idx:0,timed,minutes,start:Date.now(),end:Date.now()+minutes*60000,confirm:false};
  S.view='exam';renderExam();
  clearInterval(timer);timer=setInterval(tick,500);tick();window.scrollTo(0,0);}
function tick(){const E=S.exam;if(!E)return;const el=$('#clock');if(!el)return;
  if(E.timed){const r=Math.ceil((E.end-Date.now())/1000);el.textContent=fmt(r);el.classList.toggle('low',r<=300);if(r<=0)submit(true)}
  else el.textContent=fmt(Math.floor((Date.now()-E.start)/1000));}
function renderExam(){
  const E=S.exam;
  setBar([h('div',{class:'title'},'Philosophy CBT · '+(E.mode==='practice'?'Practice mode':'Exam mode'),h('small',{},E.timed?'Time remaining':'Time elapsed')),
    h('div',{class:'clock',id:'clock','aria-live':'off'},'--:--'),
    h('button',{class:'btn primary',onclick:()=>{E.confirm=true;renderConfirm()}},E.mode==='practice'?'Finish practice':'Submit test')]);
  const root=$('#app');root.replaceChildren(
    h('div',{class:'exam'},h('section',{class:'panel',id:'qpanel'}),
      h('aside',{class:'side panel'},h('h2',{text:'Question palette'}),h('div',{class:'pal',id:'pal'}),
        h('div',{class:'legend'},h('span',{},h('i',{class:'a'}),'Answered'),h('span',{},h('i'),'Not answered'),h('span',{},h('i',{class:'f'}),'Flagged')),
        h('p',{class:'keys'},'Keys: A–E answer · N next · P previous · F flag'))));
  showQ();}
function go(i){const E=S.exam;E.idx=Math.min(E.qs.length-1,Math.max(0,i));showQ();window.scrollTo({top:0})}
function showQ(){
  const E=S.exam,q=E.qs[E.idx],id=q.id;
  const key=keyOf(q),picked=E.ans[id],lock=E.mode==='practice'&&!!key&&!!picked;
  let fb=null;
  if(E.mode==='practice'&&picked){
    if(!key)fb=h('div',{class:'fb'},h('b',{},'No answer key'),h('div',{},'There is no key for this question, so it is not scored.'),q.e?h('div',{class:'why'},h('strong',{},'Why: '),q.e):null);
    else fb=h('div',{class:'fb '+(picked===key?'ok':'no')},h('b',{},picked===key?'Correct':'Incorrect. The correct answer is '+key+'.'),q.e?h('div',{class:'why'},h('strong',{},'Why: '),q.e):null,h('div',{class:'src'},q.a?q.s:'Key saved by you.'))}
  const p=$('#qpanel');p.replaceChildren(
    h('div',{class:'qhead'},h('div',{class:'qno'},`Question ${E.idx+1} of ${E.qs.length}`),h('div',{class:'ref'},'Reference: '+q.ref)),
    h('div',{class:'qtext'},q.q),
    h('fieldset',{},h('legend',{class:'muted small',style:'margin-bottom:8px'},'Choose one answer'),
      h('div',{class:'opts'},q.o.map((t,i)=>{const L='ABCDE'[i];
        let c='opt',tag=null;
        if(lock){c+=' lock';if(L===key){c+=' ok';tag='Correct answer'}else if(L===E.ans[id]){c+=' no';tag='Your answer'}}
        return h('label',{class:c},h('input',{type:'radio',name:'opt',value:L,checked:E.ans[id]===L,disabled:lock,onchange:()=>{E.ans[id]=L;if(E.mode==='practice')showQ();else pal()}}),h('span',{class:'l'},L+'.'),h('span',{class:'tx'},t),tag?h('span',{class:'tag'},tag):null)}))),
    fb,
    h('div',{class:'nav'},
      h('button',{class:'btn',disabled:E.idx===0,onclick:()=>go(E.idx-1)},'Previous'),
      h('button',{class:'btn primary',disabled:E.idx===E.qs.length-1,onclick:()=>go(E.idx+1)},'Next'),
      h('label',{class:'flagbox sp'},h('input',{type:'checkbox',checked:E.flags.has(id),onchange:e=>{e.target.checked?E.flags.add(id):E.flags.delete(id);pal()}}),'Flag for review'),
      h('button',{class:'btn',disabled:!E.ans[id]||lock,onclick:()=>{delete E.ans[id];showQ();pal()}},'Clear answer')));
  pal();}
function pal(){const E=S.exam,box=$('#pal');if(!box)return;
  box.replaceChildren(...E.qs.map((q,i)=>h('button',{class:'pb'+(E.ans[q.id]?' ans':'')+(E.mode==='practice'&&E.ans[q.id]&&keyOf(q)?(E.ans[q.id]===keyOf(q)?' ok':' no'):'')+(E.flags.has(q.id)?' fl':'')+(i===E.idx?' cur':''),'aria-label':`Question ${i+1}${E.ans[q.id]?', answered':''}${E.flags.has(q.id)?', flagged':''}`,'aria-current':i===E.idx?'true':null,onclick:()=>go(i)},String(i+1))));
  const c=box.querySelector('.cur');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest'});}
function renderConfirm(){
  const E=S.exam;document.querySelector('.overlay')?.remove();if(!E.confirm)return;
  const un=E.qs.filter(q=>!E.ans[q.id]).length,fl=E.flags.size;
  const close=()=>{E.confirm=false;document.querySelector('.overlay')?.remove()};
  document.body.append(h('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':'Submit test'},
    h('div',{class:'dialog'},h('h1',{style:'font-size:21px',text:E.mode==='practice'?'Finish practice?':'Submit your test?'}),
      h('p',{class:'muted'},`${E.qs.length-un} of ${E.qs.length} answered · ${un} unanswered · ${fl} flagged for review.`),
      h('p',{class:'small muted'},E.mode==='practice'?'You will see your score and a full review.':'You cannot change answers after submitting.'),
      h('div',{class:'row'},h('button',{class:'btn',onclick:close},'Keep working'),h('button',{class:'btn primary',onclick:()=>{close();submit(false)}},'Submit now')))));}
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('.overlay'))return;
  const k=e.key.toLowerCase(),E=S.exam,q=E.qs[E.idx];
  if('abcde'.includes(k)&&k.length===1&&q.o[k.charCodeAt(0)-97]!==undefined){if(E.mode==='practice'&&keyOf(q)&&E.ans[q.id])return;E.ans[q.id]=k.toUpperCase();showQ()}
  else if(k==='n')go(E.idx+1);else if(k==='p')go(E.idx-1);
  else if(k==='f'){E.flags.has(q.id)?E.flags.delete(q.id):E.flags.add(q.id);showQ()}});

/* ---------- results ---------- */
function submit(auto){
  const E=S.exam;if(!E||S.view!=='exam')return;
  clearInterval(timer);document.querySelector('.overlay')?.remove();
  const items=E.qs.map(q=>({q,key:keyOf(q),pick:E.ans[q.id]||null,flag:E.flags.has(q.id)}));
  const scored=items.filter(i=>i.key),right=scored.filter(i=>i.pick===i.key),wrong=scored.filter(i=>i.pick&&i.pick!==i.key),blank=scored.filter(i=>!i.pick);
  S.result={items,scored,right,wrong,blank,auto,timed:E.timed,minutes:E.minutes,used:Math.min(Math.floor((Date.now()-E.start)/1000),E.minutes*60*(E.timed?1:1e6))};
  S.view='result';S.filter='all';renderResult();window.scrollTo(0,0);}
function renderResult(){
  const R=S.result;setBar([h('div',{class:'title'},'Philosophy CBT',h('small',{},'Results')),h('button',{class:'btn primary',onclick:renderSetup},'New test')]);
  const pct=R.scored.length?Math.round(R.right.length/R.scored.length*100):null;
  const unk=R.items.length-R.scored.length;
  const bySet={};R.scored.forEach(i=>{const s=bySet[i.q.set]??={n:0,c:0};s.n++;if(i.pick===i.key)s.c++});
  const retry=[...R.wrong,...R.blank].map(i=>i.q);
  const root=$('#app');root.replaceChildren();
  root.append(
    h('section',{class:'panel'},
      R.auto?h('p',{class:'small',style:'color:var(--bad);font-weight:600'},'Time ran out. Your test was submitted automatically.'):null,
      h('div',{class:'score'},h('div',{class:'big'},pct==null?'–':pct+'%'),
        h('div',{class:'stats'},
          h('div',{class:'stat'},h('b',{},`${R.right.length}/${R.scored.length}`),h('span',{},'correct (scored)')),
          h('div',{class:'stat'},h('b',{},String(R.wrong.length)),h('span',{},'wrong')),
          h('div',{class:'stat'},h('b',{},String(R.blank.length)),h('span',{},'unanswered')),
          unk?h('div',{class:'stat'},h('b',{},String(unk)),h('span',{},'not scored (no answer key)')):null,
          h('div',{class:'stat'},h('b',{},fmt(R.used)),h('span',{},'time used')))),
      Object.keys(bySet).length>1?h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Source'),h('th',{class:'n'},'Correct'),h('th',{class:'n'},'Scored'),h('th',{class:'n'},'%'))),
        h('tbody',{},Object.entries(bySet).map(([k,v])=>h('tr',{},h('td',{},k),h('td',{class:'n'},String(v.c)),h('td',{class:'n'},String(v.n)),h('td',{class:'n'},Math.round(v.c/v.n*100)+'%')))))):null,
      h('div',{class:'row',style:'margin:18px 0 0'},
        h('button',{class:'btn primary',disabled:!retry.length,onclick:()=>startExam(shuffle(retry),Math.max(1,Math.ceil(retry.length*.75)),R.timed)},`Retry wrong and unanswered (${retry.length})`),
        h('button',{class:'btn',onclick:renderSetup},'New test'))),
    h('div',{class:'filters',id:'filters'}),h('div',{id:'review'}));
  drawFilters();drawReview();}
function drawFilters(){
  const R=S.result;const defs=[['all','All',R.items.length],['wrong','Wrong',R.wrong.length],['blank','Unanswered',R.blank.length],['flag','Flagged',R.items.filter(i=>i.flag).length],['unk','No answer key',R.items.length-R.scored.length]];
  $('#filters').replaceChildren(...defs.map(([k,l,n])=>h('button',{class:'fbtn','aria-pressed':S.filter===k,onclick:()=>{S.filter=k;drawFilters();drawReview()}},`${l} (${n})`)));}
function drawReview(){
  const R=S.result;const f=S.filter;
  const list=R.items.map((it,i)=>({it,i})).filter(({it})=>f==='all'||(f==='wrong'&&it.key&&it.pick&&it.pick!==it.key)||(f==='blank'&&it.key&&!it.pick)||(f==='flag'&&it.flag)||(f==='unk'&&!it.key));
  const box=$('#review');box.replaceChildren();
  if(!list.length){box.append(h('p',{class:'muted',text:'Nothing here.'}));return}
  list.forEach(({it,i})=>{const q=it.q,key=keyOf(q);
    const status=!key?h('span',{class:'pill'},'Not scored'):!it.pick?h('span',{class:'pill'},'Unanswered'):it.pick===key?h('span',{class:'pill',style:'color:var(--good);border-color:var(--good)'},'Correct'):h('span',{class:'pill',style:'color:var(--bad);border-color:var(--bad)'},'Wrong');
    const card=h('article',{class:'item'},
      h('div',{class:'qhead'},h('div',{class:'qno',style:'font-size:16px'},`Question ${i+1}`,status,it.flag?h('span',{class:'pill fl'},'Flagged'):null),h('div',{class:'ref'},q.ref)),
      h('div',{class:'qt'},q.q),
      q.o.map((t,j)=>{const L='ABCDE'[j];let c='ro',tag='';
        if(key&&L===key){c+=' ok';tag='Correct answer'+(it.pick===L?' · your answer':'')}
        else if(it.pick===L){c+=key?' no':' pk';tag=key?'Your answer':'Your answer'}
        return h('div',{class:c},h('span',{class:'l'},L+'.'),h('span',{class:'tx'},t),tag?h('span',{class:'tag'},tag):null)}),
      q.e?h('div',{class:'why',style:'margin-top:8px'},h('strong',{},'Why: '),q.e):null,
      h('div',{class:'src'},key?(q.a?q.s:'Key saved by you (counts from your next test)'):'No answer key in your files for this question.'));
    if(!key){card.append(h('div',{class:'keyset'},'Know the answer? Save it for next time:',...'ABCDE'.slice(0,q.o.length).split('').map(L=>h('button',{class:'btn',onclick:()=>{userKeys[q.id]=L;saveKeys();drawReview()}},L))))}
    else if(!q.a){card.append(h('div',{class:'keyset'},h('button',{class:'btn',onclick:()=>{delete userKeys[q.id];saveKeys();drawReview()}},'Remove my saved key')))}
    box.append(card)});}
renderSetup();
</script>
