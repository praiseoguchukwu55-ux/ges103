<title>Philosophy CBT Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen exam console. Navy title bar with timer, question panel left, numbered palette right; setup and results reuse the same panels. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#17212e; --muted:#566375; --line:#d3dae4;
  --brand:#17365d; --brand-ink:#ffffff; --accent:#1f5fbf; --accent-tint:#e3edfb;
  --good:#1f7a4d; --good-tint:#e1f3e9; --bad:#b3261e; --bad-tint:#fbe7e5; --flag:#a8650a; --flag-tint:#fbefd9;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --panel:#172130; --ink:#e6ebf2; --muted:#98a5b8; --line:#2b394d;
  --brand:#0c2340; --brand-ink:#e6ebf2; --accent:#6aa3f5; --accent-tint:#1c3050;
  --good:#52c78a; --good-tint:#16301f; --bad:#f0766e; --bad-tint:#3a1a19; --flag:#e8a649; --flag-tint:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#172130; --ink:#e6ebf2; --muted:#98a5b8; --line:#2b394d;
  --brand:#0c2340; --brand-ink:#e6ebf2; --accent:#6aa3f5; --accent-tint:#1c3050;
  --good:#52c78a; --good-tint:#16301f; --bad:#f0766e; --bad-tint:#3a1a19; --flag:#e8a649; --flag-tint:#3a2a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.bar .title{font-weight:600;letter-spacing:.01em;margin-right:auto}
.bar .title small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
.clock{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;padding:2px 10px;border:1px solid currentColor;border-radius:6px}
.clock.low{background:var(--bad);border-color:var(--bad);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar .btn{background:transparent;color:inherit;border-color:currentColor}
.bar .btn.primary{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
/* setup */
.setup{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media(min-width:860px){.setup{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.chk input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.chk .n{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--muted);white-space:nowrap;padding-left:8px}
.chk .t{min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:14px;color:var(--muted)}
input[type=number]{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tick{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.tick input{margin-top:5px;accent-color:var(--accent)}
.summary{font-family:var(--mono);font-size:14px;background:var(--bg);border-radius:6px;padding:10px 12px;margin:14px 0}
/* exam */
.exam{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.exam{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.qno{font-weight:600;font-size:18px}
.ref{font-size:13.5px;color:var(--muted);font-style:italic}
.qtext{white-space:pre-line;font-size:19px;line-height:1.5;margin:14px 0 18px;max-width:68ch;overflow-wrap:anywhere}
fieldset{border:0;padding:0;margin:0;min-width:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt .l{font-weight:600;min-width:1.2em}
.opt span.tx{min-width:0;overflow-wrap:anywhere}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.nav .sp{margin-left:auto}
.flagbox{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.flagbox input{accent-color:var(--flag);width:18px;height:18px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:50vh;overflow:auto;padding:2px}
.pb{position:relative;height:38px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;padding:0}
.pb.ans{background:var(--accent);border-color:var(--accent);color:#fff}
.pb.cur{outline:3px solid var(--ink);outline-offset:1px}
.pb.fl::after{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;background:var(--flag);border-radius:0 5px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend .a{background:var(--accent);border-color:var(--accent)}.legend .f{background:var(--flag);border-color:var(--flag)}
.keys{font-size:13px;color:var(--muted);margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(10,18,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--panel);border-radius:10px;padding:24px;max-width:440px;width:100%;border:1px solid var(--line)}
.dialog .row{margin:18px 0 0}
/* results */
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--mono);font-weight:600;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.fbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.item .qt{white-space:pre-line;margin:6px 0 12px;overflow-wrap:anywhere}
.ro{display:flex;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid transparent;font-size:15.5px}
.ro .l{font-weight:600;min-width:1.2em}.ro .tx{min-width:0;overflow-wrap:anywhere;flex:1}
.ro.ok{background:var(--good-tint);border-color:var(--good)}
.ro.no{background:var(--bad-tint);border-color:var(--bad)}
.ro.pk{background:var(--accent-tint);border-color:var(--accent)}
.tag{font-size:12.5px;font-weight:600;white-space:nowrap}
.ro.ok .tag{color:var(--good)}.ro.no .tag{color:var(--bad)}
.pill{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.pill.fl{border-color:var(--flag);color:var(--flag);background:var(--flag-tint)}
.keyset{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.keyset .btn{padding:3px 12px}
.src{font-size:13px;color:var(--muted);margin-top:8px}
@media(prefers-reduced-motion:no-preference){.opt,.chk,.pb,.btn{transition:border-color .12s,background-color .12s}}
</style>

s used for a ______","o":["disjunction","conditional","negation","biconditional"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-5","set":"GES 106 PAPER","ref":"GES 106 Paper, Q5","q":"Philosophy of law is distinct from jurisprudence for its -------------------- of law or legal system.","o":["Particularistic analysis","Descriptive analysis","Empirical analysis","Prescriptive analysis"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-6","set":"GES 106 PAPER","ref":"GES 106 Paper, Q6","q":"First-order questions are ______ questions","o":["Conceptual","Foundational","Universal","Factual"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-7","set":"GES 106 PAPER","ref":"GES 106 Paper, Q7","q":"The most that can be said of a scientific truth is that it has a high degree of ______","o":["inquiry","observation","probability","hypothesis"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-8","set":"GES 106 PAPER","ref":"GES 106 Paper, Q8","q":"The criteria for choosing the correct principle of action include all but one of the following:","o":["The timing of the action","The consequences of the action","The nature of the action","The intention of the moral agent"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-9","set":"GES 106 PAPER","ref":"GES 106 Paper, Q9","q":"What is the correct interpretation of this argument: “B v T”","o":["the bank is closed and the tellers are suspended","the bank is closed if and only if the tellers are suspended","either the bank is closed or the tellers are suspended","either the tellers are suspended or else the bank will be closed"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-10","set":"GES 106 PAPER","ref":"GES 106 Paper, Q10","q":"The value of scepticism lies in its force of arguments against the claims of the ______ philosophers.","o":["Religious","dogmatic","political","Ancient"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-11","set":"GES 106 PAPER","ref":"GES 106 Paper, Q11","q":"Which of the following ideas CANNOT be considered as one of the 'ideas we live by'?","o":["God","Destiny","Death","Food"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-12","set":"GES 106 PAPER","ref":"GES 106 Paper, Q12","q":"What are the two types of values?","o":["Intrinsic and extrinsic values","Natural and artificial values","Imported and local values","Past and future values"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-13","set":"GES 106 PAPER","ref":"GES 106 Paper, Q13","q":"All these are pernicious consequences of science EXCEPT______","o":["Inadequate healthcare","Poison gas","Atomic bomb","Greenhouse gases"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-14","set":"GES 106 PAPER","ref":"GES 106 Paper, Q14","q":"“Every horse that has ever been observed has had a heart. Therefore, every horse has a heart” is an example of ______ argument.","o":["inductive","fallacious","deductive","sound"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-15","set":"GES 106 PAPER","ref":"GES 106 Paper, Q15","q":"Science is the study of the natural world through the following EXCEPT______","o":["Appreciation","Observation","Theoretical explanations","Experimental investigations"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-16","set":"GES 106 PAPER","ref":"GES 106 Paper, Q16","q":"ONE of the following is a reason why philosophy is inevitable:","o":["It derives from the need for wisdom","It derives from the need for knowledge","It derives from the need for understanding","It derives from the need for..."],"a":"C","s":"Corrected. The paper file marked (A) wisdom, but your Key Points sheet says philosophy is inevitable because it derives from the need for understanding."},{"id":"p-17","set":"GES 106 PAPER","ref":"GES 106 Paper, Q17","q":"What valid argument form is represented by: “p, therefore p v q”?","o":["simplification","addition","disjunctive syllogism","hypothetical syllogism"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-18","set":"GES 106 PAPER","ref":"GES 106 Paper, Q18","q":"The features of science that show that science is a rational enquiry includes all of the following EXCEPT______","o":["The demand for evidence","Identification and avoidance of biases","Non-authoritarianism","Reverence for earlier discoveries"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-19","set":"GES 106 PAPER","ref":"GES 106 Paper, Q19","q":"The connective sign “v” is called a ______","o":["curl","wedge","Disjunct","letter"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-20","set":"GES 106 PAPER","ref":"GES 106 Paper, Q20","q":"Why do you think saying “Ethics is what my feelings tell me is right or wrong” is not an appropriate response to the question “what is ethics?”","o":["Your feelings are different from anyone else’s","Commonly, our feelings lead us astray and make us do what is unethical","We sometimes cry when we feel bad","Our feelings originate from us and not from God"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-21","set":"GES 106 PAPER","ref":"GES 106 Paper, Q21","q":"The explanatory and predictive functions show science as a/and ______ enterprise.","o":["energetic","rational","logical","Empirical"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-22","set":"GES 106 PAPER","ref":"GES 106 Paper, Q22","q":"What is a scientific fact?","o":["A scientific fact is true regardless of anyone’s cultural background","A scientific fact refers to a particular scientist’s view of the physical universe","A scientific fact is an ancient truth about the environment.","A scientific fact is a controlled, repeatable and/or rigorously verified observation"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-23","set":"GES 106 PAPER","ref":"GES 106 Paper, Q23","q":"According to Plato, knowledge is true belief plus ______","o":["Fact","Theory","Evidence","Account"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-24","set":"GES 106 PAPER","ref":"GES 106 Paper, Q24","q":"One of the following scholars is not a founder of modern science","o":["Nicodemous Copernicus","Galileo Galilei","Nicolaus Copernicus","Johannes Kepler"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-25","set":"GES 106 PAPER","ref":"GES 106 Paper, Q25","q":"In its relation to other disciplines, philosophy is both normative and ______","o":["critical","universal","prescriptive","foundational"],"a":"C","s":"Corrected. The paper file marked (A) critical, but your Key Points sheet says philosophy is both normative and prescriptive."},{"id":"p-26","set":"GES 106 PAPER","ref":"GES 106 Paper, Q26","q":"What are moral norms?","o":["Moral norms are laid down rules and regulations","Moral norms are informal deeds, guides, manners or standards that tell us what are permitted or forbidden","Moral norms are the rules and regulation in the academia","Moral norms refer to our idiosyncrasies and preferences"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-27","set":"GES 106 PAPER","ref":"GES 106 Paper, Q27","q":"“Zeth Construction Company should never be given the job of designing the new bridge. In recent years, this company has designed four bridges, and all four have collapsed. The company is clearly incompetent” is an example of what fallacy?","o":["no fallacy","circumstantial","false cause","abusive"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-28","set":"GES 106 PAPER","ref":"GES 106 Paper, Q28","q":"“The United States of America and Britain would order the withdrawal of financial aid and other trade relations to Nigeria if the national assembly should prohibit same sex marriage.” The statement is an example of the fallacy of ______","o":["Division","Pity","Force","against the man."],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-29","set":"GES 106 PAPER","ref":"GES 106 Paper, Q29","q":"The argument that the life of the mother should not be compromised for the survival of the foetus is proposed by the ---------------------- school","o":["Planned Parenthood","Anti-foetal","Liberal","Pro-life"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-30","set":"GES 106 PAPER","ref":"GES 106 Paper, Q30","q":"Which, out of the following, represents one of the functions of the philosopher of science?","o":["the discovery of the laws of nature","the prediction of future events","the evaluation of scientific knowledge","the organisation of scientific knowledge"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-31","set":"GES 106 PAPER","ref":"GES 106 Paper, Q31","q":"The fallacy committed when the characteristics of a whole are thought to necessarily apply to its parts is called ______","o":["begging the question","division","Equivocation","composition"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-32","set":"GES 106 PAPER","ref":"GES 106 Paper, Q32","q":"The central question in normative ethics is______","o":["What constitutes a moral standard?","Who is a moral agent?","What are the possible origins of morality?","Should I abort an unwanted pregnancy?"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-33","set":"GES 106 PAPER","ref":"GES 106 Paper, Q33","q":"Treating fellow humans as ends in themselves is central to --------------------","o":["Aristotle’s mean","Archimedean Point","Kantian Categorical Imperative","Environmental Ethics"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-34","set":"GES 106 PAPER","ref":"GES 106 Paper, Q34","q":"'If it rains then the ground will be wet. It rains. Therefore, the ground is wet'. This is a valid form of a deductive argument called ______","o":["modus tollens","modus ponens","disjunctive syllogism","inductive ponens"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-35","set":"GES 106 PAPER","ref":"GES 106 Paper, Q35","q":"Science assumed a practical relevance with the dawn of ______","o":["Agricultural Revolution","Medieval Revolution","Industrial Revolution","French Revolution"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-36","set":"GES 106 PAPER","ref":"GES 106 Paper, Q36","q":"According to Aristotle, why does society exist?","o":["To give rules and orders","To afford the citizens the opportunity of living the “good life,” that is, the life of happiness","To arrest and punish criminals","To train people in the art of scientific explorations"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-37","set":"GES 106 PAPER","ref":"GES 106 Paper, Q37","q":"One of the following is NOT an ethical term:","o":["justice","responsibility","freedom","Proposition"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-38","set":"GES 106 PAPER","ref":"GES 106 Paper, Q38","q":"______ is a sequence of propositions in which one part known as the conclusion is claimed to follow from the others called the premises.","o":["inductive","deductive","Logic","argument"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-39","set":"GES 106 PAPER","ref":"GES 106 Paper, Q39","q":"By ______, we refer to the business of making clearer our ideas and words.","o":["rigorous analysis","conceptual analysis","logical analysis","empirical analysis"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-40","set":"GES 106 PAPER","ref":"GES 106 Paper, Q40","q":"Natural science emerged with the experimentations and observations of the following EXCEPT______","o":["Nicolas Copernicus","Karl Marx","Galileo Galilei","Johannes Kepler"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-41","set":"GES 106 PAPER","ref":"GES 106 Paper, Q41","q":"An argument is ambiguous if it denotes more than one ______","o":["meaning","conclusion","premise","reasoning"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-42","set":"GES 106 PAPER","ref":"GES 106 Paper, Q42","q":"The relationship between ethics and science is conflictual rather than mutual.","o":["No","Yes","Maybe","I do not know"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-43","set":"GES 106 PAPER","ref":"GES 106 Paper, Q43","q":"In logic, errors or mistakes in reasoning are called ______","o":["Invalidity","Induction","Fallacies","Soundness"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-44","set":"GES 106 PAPER","ref":"GES 106 Paper, Q44","q":"Which of the following would you consider a dilemma in relation to terrorism?","o":["Securing our borders against neighbouring terrorist groups","Training our security agents to effectively combat terrorism","Prevention of foreign terrorist groups funds from reaching our local terrorist groups","Dealing with terrorists in a just manner since, it is difficult to determine whether terrorism is war or crime"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-45","set":"GES 106 PAPER","ref":"GES 106 Paper, Q45","q":"______ is the general theory for any form of ethics based on duty or obligation","o":["descriptivism","deontologism","consequentialism","utilitarianism"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-46","set":"GES 106 PAPER","ref":"GES 106 Paper, Q46","q":"“Everybody else is doing it, so I thought it would be a good idea too. It is high fashion.” This fallacy is called ______","o":["appeal to popular opinion","appeal to pity","appeal to emotion","appeal to fashion"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-47","set":"GES 106 PAPER","ref":"GES 106 Paper, Q47","q":"Examples of conclusion indicators include the following except","o":["so, thus","hence, consequently","may be inferred from, for the reason that","it is the case that, as a result"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-48","set":"GES 106 PAPER","ref":"GES 106 Paper, Q48","q":"Which of the following is an element of critical thinking:","o":["Factual adequacy","Factual accuracy","Factual assessment","Factual adherence"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-49","set":"GES 106 PAPER","ref":"GES 106 Paper, Q49","q":"Surrogate motherhood falls under the ______ branch of ethics.","o":["Meta-ethics","Normative","Applied","Analytical"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-50","set":"GES 106 PAPER","ref":"GES 106 Paper, Q50","q":"A scientific ______ is a controlled, repeatable and rigorously verified observation.","o":["Method","Theory","Fact","experiment"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-51","set":"GES 106 PAPER","ref":"GES 106 Paper, Q51","q":"Ethical philosophy concerns the nature of the following EXCEPT ______","o":["Good and bad","Right and wrong","Truth and reality.","Duty and obligation."],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-52","set":"GES 106 PAPER","ref":"GES 106 Paper, Q52","q":"The view that mental states in humans are caused by physical events in the brain is known as______","o":["Materialism","Functionalism","Epiphenomenalism","Dualism"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-53","set":"GES 106 PAPER","ref":"GES 106 Paper, Q53 (also GST 212 Nexus Minds Q53)","q":"The sceptical challenge arose from the belief that","o":["knowledge requires certainty","knowledge and belief are one and the same","the senses are the best source for acquiring knowledge","reason furnishes knowledge"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-54","set":"GES 106 PAPER","ref":"GES 106 Paper, Q54 (also GST 212 Nexus Minds Q54)","q":"The aspect of philosophy which requires that you give precise meanings to your beliefs is called ______","o":["Reconstruction of ideas","Rethinking of ideas","Conceptual modification","Conceptual analysis"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-55","set":"GES 106 PAPER","ref":"GES 106 Paper, Q55 (also GST 212 Nexus Minds Q55)","q":"-------------------- is defined as a group of words that is used to give meaning to other words","o":["Definiens","Definiendum","Meaning","Definition"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-56","set":"GES 106 PAPER","ref":"GES 106 Paper, Q56 (also GST 212 Nexus Minds Q56)","q":"The view that everything that happens is necessitated by what has already happened before is called ______","o":["Determinism","Cognitivism","Fatalism","Relativism"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-57","set":"GES 106 PAPER","ref":"GES 106 Paper, Q57 (also GST 212 Nexus Minds Q57)","q":"All of us cannot be famous, because all of us cannot be well known. This is a fallacy of ______","o":["begging the question","irrelevant conclusion","ignorance","complex question"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-58","set":"GES 106 PAPER","ref":"GES 106 Paper, Q58 (also GST 212 Nexus Minds Q58)","q":"Ethics guides scientific practice by ______ and ______","o":["Ethical laws and decrees","Ethical inventions and experimentation","Ethical norms and considerations","Ethical ideas and opinions"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-59","set":"GES 106 PAPER","ref":"GES 106 Paper, Q59 (also GST 212 Nexus Minds Q59)","q":"Man’s attempt at understanding, explaining and predicting his physical, biological, psychological and social world gave rise to ______","o":["Arts","Human relations","Magic","Science"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-60","set":"GES 106 PAPER","ref":"GES 106 Paper, Q60 (also GST 212 Nexus Minds Q60)","q":"It is a basic assumption in science that the universe is a vast single ______ in which the basic rules are everywhere the same.","o":["organ","system","field","Law"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-61","set":"GES 106 PAPER","ref":"GES 106 Paper, Q61 (also GST 212 Nexus Minds Q61)","q":"What valid argument form does this argument represent: Future presidents will be allowed to serve a third term only if the Constitution is amended. The Constitution will not be amended. Therefore, future presidents will not be allowed to serve a third term","o":["Modus ponens","Modus tollens","Disjunctive Syllogism","Addition"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-62","set":"GES 106 PAPER","ref":"GES 106 Paper, Q62 (also GST 212 Nexus Minds Q62)","q":"The framework of ideas and beliefs through which we interpret the world and interact with it is called ______","o":["Philosophy","Metaphysics","Worldview","Physics"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-63","set":"GES 106 PAPER","ref":"GES 106 Paper, Q63 (also GST 212 Nexus Minds Q63)","q":"The two parts of a biconditional are known as ______","o":["components","antecedents","conjuncts","disjuncts"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-64","set":"GES 106 PAPER","ref":"GES 106 Paper, Q64 (also GST 212 Nexus Minds Q64)","q":"“Nigeria is a peace loving country. Therefore all Nigerians are peace loving people.” This is an example of the fallacy of ______","o":["composition","hasty generalization","division","irrelevant conclusion"],"a":"C","s":"Conflict. Nexus Minds marks Composition, the paper file marks Division. Going from a whole (Nigeria) to its parts (all Nigerians) is Division, the same definition used in Q31 of this paper."},{"id":"p-65","set":"GES 106 PAPER","ref":"GES 106 Paper, Q65 (also GST 212 Nexus Minds Q65)","q":"According to ______, “arguments, like men, are often pretenders.”","o":["Aristotle","I. M. Copi","Plato","Thales"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-66","set":"GES 106 PAPER","ref":"GES 106 Paper, Q66 (also GST 212 Nexus Minds Q66)","q":"The main ethical requirements for clinical research does not include a consideration of ______ towards a human or animal subject","o":["Health","Comfort","Wellbeing","Social status"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-67","set":"GES 106 PAPER","ref":"GES 106 Paper, Q67 (also GST 212 Nexus Minds Q67)","q":"______ is a traditional epistemological theory","o":["Theism","Idealism","Ontology","Rationalism"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-68","set":"GES 106 PAPER","ref":"GES 106 Paper, Q68 (also GST 212 Nexus Minds Q68)","q":"The methodology of science employs ______ and ______","o":["Inductive and deductive reasoning","reason and imagination","Methods and ideas","Conjectures and refutations"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-69","set":"GES 106 PAPER","ref":"GES 106 Paper, Q69 (also GST 212 Nexus Minds Q69)","q":"Which of the following is not a step used in scientific method?","o":["Observation and description of a phenomenon or group of phenomena","Formulation of hypothesis.","Performance of experimental tests.","Collection of license of operation from the government"],"a":"D","s":"Answer from your GES 106 paper file."},{"id":"p-70","set":"GES 106 PAPER","ref":"GES 106 Paper, Q70 (also GST 212 Nexus Minds Q70)","q":"The type of argument in which the premises provide conclusive grounds for the conclusion is known as ______","o":["Inductive argument","Sound argument","Deductive argument","Conclusive argument"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-71","set":"GES 106 PAPER","ref":"GES 106 Paper, Q71 (also GST 212 Nexus Minds Q71)","q":"It was the love of wisdom and the pursuit of knowledge for its own sake that motivated the ______ philosophers.","o":["Ionian","Scholastic","medieval","Cartesian"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-72","set":"GES 106 PAPER","ref":"GES 106 Paper, Q72 (also GST 212 Nexus Minds Q72)","q":"Philosophy of law refers to the ______ activities of trained philosophers in the realm of law","o":["legal","theoretical","intelligent","adversarial"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-73","set":"GES 106 PAPER","ref":"GES 106 Paper, Q73 (also GST 212 Nexus Minds Q73)","q":"The basic claim of care ethics is that ______","o":["The government should be responsible for taking care of the sick in the society","The solution to moral problems is not to appeal to rules or principles but how to maintain the relationship that exists between people","Human beings ought to care for one another","Ethics is not a matter of sentiments and feelings"],"a":"B","s":"Conflict. Nexus Minds marks (C) Human beings ought to care for one another, the paper file marks (B). (B) is the standard statement of care ethics: relationships over rules."},{"id":"p-74","set":"GES 106 PAPER","ref":"GES 106 Paper, Q74 (also GST 212 Nexus Minds Q74)","q":"Propositional ______ consist of lower case letters p, q, r, s, t, u, v, w, x, y, z.","o":["connectives","constants","variables","Symbols"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-75","set":"GES 106 PAPER","ref":"GES 106 Paper, Q75 (also GST 212 Nexus Minds Q75)","q":"Beneficence, non-maleficence, justice and -------------------- are some common set of goals, ethics and science aim to engender in the society","o":["Exploitation","Marginalization","Respect for autonomy","Self-interest"],"a":"C","s":"Answer from your GES 106 paper file."},{"id":"p-76","set":"GES 106 PAPER","ref":"GES 106 Paper, Q76 (also GST 212 Nexus Minds Q76)","q":"The interrogation of the foundations of scientific claims, laws and theories is central to -------------------- order activity of philosophy.","o":["Technical","Second","Academic","First"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-77","set":"GES 106 PAPER","ref":"GES 106 Paper, Q77 (also GST 212 Nexus Minds Q77)","q":"In order for science to be meaningful and ethical, it must ______","o":["Make new discoveries every year","Advance human interest, welfare and happiness","Find cure to HIV/AIDS","Admit only competent individuals into the scientific community"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-78","set":"GES 106 PAPER","ref":"GES 106 Paper, Q78 (also GST 212 Nexus Minds Q78)","q":"What fallacy is committed in the following passage: So these are your grounds for criticizing the way we treat our native population. In answer, let me just say, “Who was it that killed most of the American Indians?”","o":["argumentum ad hominem","Argumentum ad baculum","Argumentum ad ignorantiam","Argumentum ad verecundiam"],"a":"A","s":"Answer from your GES 106 paper file."},{"id":"p-79","set":"GES 106 PAPER","ref":"GES 106 Paper, Q79 (also GST 212 Nexus Minds Q79)","q":"“All egrets are white because all the egrets that I have seen are white.” This argument is ______","o":["conjunctive","inductive","deductive","unsound"],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"p-80","set":"GES 106 PAPER","ref":"GES 106 Paper, Q80 (also GST 212 Nexus Minds Q80)","q":"The argument: “All cows have kidneys and have lungs. All horses have kidneys and have lungs. All humans have kidneys and have lungs. Therefore, all animals with kidneys have lungs” is an example of ______ argument","o":["sound","deductive","inductive","Fallacious"],"a":"C","s":"Conflict. Nexus Minds marks Fallacious, the paper file marks Inductive. It generalises from cows, horses and humans to all animals with kidneys, which is the inductive pattern (like the egrets question)."},{"id":"p-81","set":"GES 106 PAPER","ref":"GES 106 Paper, Q81 (also GST 212 Nexus Minds Q81)","q":"Surrogacy is a moral dilemma because______","o":["People should not sell their relatives.","What is right seems to lie somewhere between the interest of the surrogate, that of the commissioning parents and that of the child to be born using the surrogate process.","Those who buy children from their mothers are wicked because the maternal cord between a mother and her child should not be snapped.","I do not support surrogacy."],"a":"B","s":"Answer from your GES 106 paper file."},{"id":"g-1","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q1 (also GST 212 General Test Type C Q19)","q":"The standards by which moral issues are weighed in order to determine whether they are right or wrong are called:","o":["Ethical theories","Utilitarianism","Virtue ethics","Egoism"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-2","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q2","q":"Which theory holds that the rightness or wrongness of an action depends solely on its consequences?","o":["Deontological ethical theories","Consequentialist or teleological ethical theories","Relativism","Altruism"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-3","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q3","q":"Which theory holds that whether a particular action is right or wrong depends on the character of the doer?","o":["Utilitarianism","Kant's Categorical Imperative","Virtue ethics","Feminism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-4","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q4","q":"Below are some of the reasons why people ought to live a moral life, except:","o":["Sociological reasons","Psychological reasons","Theological reasons","The law of Karma"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-5","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q5","q":"According to Wolters (1983:5), a perspective on things, a way of looking at the cosmos from a particular vantage point is called:","o":["Nature","Reflection","Experience","Worldview"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-6","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q6 (also Philosophy Batch B Q6)","q":"The ______ philosophy searches for a comprehensive set of beliefs and ideas that acts as a general vision or perspective about the universe, a person's place in the universe, and possible goals and objectives a person may pursue in the universe.","o":["Wisdom","Courage","Worldview","Criticism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-7","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q7","q":"________ is the theory of knowledge.","o":["Ethics","Epistemology","Meta-ethics","Metaphysics"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-8","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q8","q":"Materialism takes ______ as what is real.","o":["Ideas","Being and non-being","Matter","God"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-10","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q10","q":"The challenge of scepticism is a:","o":["Metaphysical problem","Epistemological problem","Ethical problem","Logical problem"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-11","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q11","q":"These groups of epistemologists are of the opinion that we can only have knowledge about the world through our senses of touch, sight, taste, hearing and smell.","o":["Empiricists","Sophists","Rationalists","Positivists"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-12","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q12 (also Philosophy Batch B Q12)","q":"Philosophy raises ______ questions on the fundamental discourses or issues within Philosophy.","o":["Second-order","First-order","No questions","Third-order"],"a":"B","s":"Conflict. Nexus Minds marks Second-order, Batch B marks First-Order. Issues within philosophy are first-order; the next question (foundations of other disciplines) is the second-order one."},{"id":"g-13","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q13","q":"Philosophy raises questions concerning the foundation and basis of other disciplines through the ______ questions.","o":["The First-Order","The Third-Order","The Second-Order","No questions"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-14","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q14","q":"________ is the branch of Philosophy that studies reality.","o":["Logic","Ethics","Epistemology","Metaphysics"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-15","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q15","q":"________ is also known as moral philosophy.","o":["Epistemology","Metaphysics","A and B","Ethics"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-16","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q16","q":"________ is that aspect of logic that analyses arguments that occur in natural language, that is, everyday ordinary language.","o":["Informal Logic","Philosophy","Formal Logic","Argument"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-17","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q17","q":"The identification, examination and analysis of mistakes or errors in reasoning is called:","o":["Metaphysics","Fallacies","Ordinary language","The law of excluded middle"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-18","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q18 (also Philosophy Batch B Q18)","q":"Which law maintains that if any statement is true, then it is true?","o":["The law of contradiction","The law of excluded middle","The law of identity","The law of thought"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-19","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q19","q":"In an ______ one reasons from particular premises to a universal conclusion.","o":["Deductive argument","Ordinary argument","Indicative argument","Inductive argument"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-20","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q20","q":"________ assert that every statement is either true or false.","o":["The law of contradiction","The law of identity","None of the above","The law of excluded middle"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-21","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q21","q":"Feminist or care ethics emphasizes:","o":["The consequences of actions","Duties and obligations","Individual virtues","Relationships and care"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-22","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q22","q":"A priori knowledge is knowledge from ______.","o":["Senses","Reason","Truth","Knowledge"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-23","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q23","q":"The theory which traces the origin of ethics to God is ______.","o":["Consequentialism","Utilitarianism","Divine command theory","Egoism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-24","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q24","q":"________ studies the nature, origin, foundation, extent and limits of human knowledge.","o":["Rationalism","Knowledge","Metaphysics","Epistemology"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-25","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q25","q":"What is the primary concern of metaphysics?","o":["Investigating moral principles","Exploring the nature of reality and existence","Studying the principles of artistic beauty","Understanding the functions of government"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-26","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q26","q":"Which of these terms best describes the concept of a government by the people, where citizens exercise power by voting?","o":["Authority","Democracy","Sovereignty","Liberty"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-27","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q27","q":"Two famous schools of thought discussed in Epistemology are ______ and ______.","o":["A priori and A posteriori","Rationalism and Empiricism","Inductive and Deductive","None of the above"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-28","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q28","q":"________ is the study of the foundation of things, the study of what makes up the universe.","o":["Metaphysics","Ethics","Epistemology","All of the above"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-29","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q29","q":"Which theory posits that the mind and body are distinct but interact with each other?","o":["Materialism","Idealism","Dualism","Behaviorism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-30","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q30","q":"Philosophical problems are ______ in nature.","o":["Universal","Dualistic","Materialistic","Similar"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-31","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q31","q":"________ is the denial of the possibility of knowledge.","o":["Rationalism","Empiricism","Idealism","Scepticism"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-32","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q32","q":"________ is a variant of dualism that began as a response to the mind-body problem.","o":["Monism","Occasionalism","Hedonism","Relativism"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-33","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q33","q":"Critical thinking demands that worldviews are examined for one of the following elements:","o":["Factual thrownness","Logical coherence","Explanational stuck","Epistemic deficit"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-34","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q34","q":"________ refers to a situation whereby someone is faced with two alternatives, neither of which is satisfactory, but from which one has to choose one or the other.","o":["Moral dilemma","Moral cognitive","Moral appraisal","Perennial moral issue"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-35","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q35","q":"A fallacy can be defined as:","o":["Social contract","An error in reasoning","Abstract idea","A philosophical argument"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-36","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q36","q":"This group of philosophers deny the possibility of knowledge.","o":["Rationalists","Skeptics","Empiricists","Constructivists"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-37","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q37","q":"Knowledge whose judgment and validity is independent of experience is called:","o":["A priori knowledge","Synthetic a priori knowledge","A posteriori knowledge","Independent knowledge"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-38","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q38","q":"The branch of philosophy that asks 'What can we know?' 'How can we know?' and 'Are we sure of what we know?' is called:","o":["Metaphysics","Philosophy of science","Epistemology","Logic"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-39","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q39 (also Philosophy Batch B Q17)","q":"Informal logic is:","o":["Only concerned with symbolic expressions","Focused on ordinary language and everyday reasoning","The study of syllogisms only","Not really logic"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-40","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q40","q":"________ is a systematic process of being sceptical about the truth of one's beliefs.","o":["Methodic thinking","Methodic doubt","Methodic style","Methodic step"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-82","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q82","q":"________ is not a definition of scientific method.","o":["Scientific method refers to the way of winnowing the truth from lies and delusions","Scientific method is the process by which scientists construct a reliable, consistent and non-arbitrary representation of the world","Scientific method is the procedure used in the discovery of a life of tranquillity","Scientific method refers to the standard procedures and criteria, to minimize cultural influences when developing a theory"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-83","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q83","q":"Identify the fallacy committed by this statement: 'The Marlboro Man represents the ultimate in masculinity. Marlboro cigarettes — for those who stand out as real men.'","o":["Appeal to people","Appeal to ignorance","Appeal to taste","Appeal to authority"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-84","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q84","q":"'All bachelors are unmarried men. Adeolu is a bachelor. Consequently, Adeolu is an unmarried man.' This is a typical example of:","o":["Predictive argument","Explanatory argument","Deductive argument","Fallacious argument"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-85","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q85","q":"A fallacy of ______ is committed when counsel appealed that his client should be acquitted of murder because he is a widower.","o":["Appeal to authority","Appeal to pity","Against the man","Irrelevant conclusion"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-86","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q86","q":"The challenge between better understanding and thoughtful evaluation requires bridging the gap between ______ and ______.","o":["Truth and falsehood","Theory and practice","Reality and appearance","Wisdom and folly"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-87","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q87","q":"Pantheism holds that:","o":["God is not identical with nature","God is identical with nature","There is a plurality of Gods","Only one God exists"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-88","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q88","q":"'The moon was full on Thursday evening and on Friday morning, I overslept. Therefore, the full moon caused me to oversleep.' This is an error in reasoning known as:","o":["Irrelevant conclusion","False cause","Ignorance","Emotion"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-89","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q89","q":"The fallacy of ______ is committed when it is argued that a proposition is true simply because it has not been proved false, or false because it has not been proved true.","o":["Irrelevant conclusion","Ignorance","Begging the question","Accident"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-90","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q90","q":"'God is the creator of everything that exists because the Bible says so and the Bible is the word of God.' This argument commits the fallacy of:","o":["Begging the question","Appeal to authority","False cause","Argument from ignorance"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-91","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q91","q":"________ does not characterise a human activity as an instance of scientific research.","o":["An activity that is popular in the academic community","An activity that is systematic rather than random","An activity that has a specific function and is aimed at contributing to a body of knowledge","An activity that has some sociological aspects in common with some other scientific activities"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-92","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q92","q":"How can ethics help us to control global warming?","o":["It makes available the necessary information about global warming","It helps us in re-examining our values in relation to nature and living","It helps us to acquire statistical data about global warming","It helps us in preparing to cope with global warming"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-93","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q93","q":"What would you consider the most important reason for not equating ethics with religion?","o":["Religion is the opium of the masses","Religion is a personal idea","Ethics applies to both the atheists and religion adherents","God is the founder of religions"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-94","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q94","q":"'All Edolites are Nigerians. All Nigerians are Africans. Therefore, all Edolites are Africans.' This is an example of ______ argument.","o":["A deductive","An inductive","A sound","A sound inductive"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-95","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q95","q":"Identify the conclusion in the following passage: 'Even though most of the world population is immunized than ever before, many old diseases have proven quite resilient in the face of changing population and environmental conditions, especially in the developing world. New diseases, such as AIDS, have taken their toll in both the North and the South.'","o":["No argument","Many old diseases have proven quite resilient in the face of changing population and environmental conditions...","New diseases, such as AIDS, have taken their toll in both the North and the South","No conclusion"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-96","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q96","q":"Two major types of arguments are:","o":["Disruptive and inductive","Inductive and delusive","Deductive and inductive","Impressive and inductive"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-97","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q97","q":"Identify the fallacy committed in this passage: 'This can of Small Cola looks just like the one I drank yesterday. The one I drank yesterday had a subtle taste of lime. Therefore, probably this one also has a subtle taste of lime.'","o":["Equivocation","Division","No fallacy","Begging the question"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-98","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q98","q":"The abortion debate is between ______ and ______.","o":["Christians and Muslims","The pro-life movements and the liberals","Philosophers and medical doctors","Philosophers and theologians"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-99","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q99","q":"Just as morality provides content for ethics, ______ provide content for logic.","o":["Validity","Arguments","Fallacy","Induction"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-100","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q100","q":"The character of philosophy that makes it involved with other disciplines is its:","o":["Meddlesome character","Logical character","Critical character","Reactive character"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-101","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q101","q":"The element of critical thinking that demands that you ensure your ideas and beliefs are not contradictory is known as:","o":["Explanatory capacity","Logical coherence","Logical capacity","Explanatory coherence"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF."},{"id":"g-102","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q102","q":"What is virtue ethics?","o":["Ethics that promotes the actions of virtuous people","Ethics that teach morality in terms of rules","Ethics that judges actions only by their consequences","Ethics that is based only on divine commands"],  content, so check it against your notes."},{"id":"gc-32","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q32","q":"In logic, relational terms and phrases are treated as types of logical predicates. These predicates are __________ and ___________","o":["Monadic and Polyadic predicates","Monadic and Dualic predicates","Polyadic and relative predicates","relative and dualic predicates"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes."},{"id":"gc-33","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q33","q":"Examples of premise indicator are all of the following but one","o":["Since","Other wise","Thus","Because"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one."},{"id":"gc-35","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q35","q":"This statement, \"Smith will eat bread for breakfast or he will go hungry,\" can be logically represented as","o":["P:Q","P>Q","P=Q","PvQ"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes."},{"id":"gc-37","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q37","q":"Validity or invalidity of an argument depends on the truth or falsehood of statements or propositions that make-up the argument.","o":["Correct","Incorrect","Undetermined","None of the above"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes."},{"id":"gc-38","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q38","q":"“The end of a thing is perfection; death is the end of life. Therefore, death is perfection of life.” The above statement commits which type of fallacy?","o":["Fallacy of Equivocation","Ignoratio Elenchi","Argumentum ad Populum","Fallacy of Division"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes."},{"id":"gc-39","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q39","q":"Concepts that reflect tangible objects or things are known as _______________","o":["Abstract concepts","Concrete concepts","Ideological concepts","Tangible concepts"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes."},{"id":"gc-40","set":"GST 212 GENERAL TEST (TYPE C)","ref":"GST 212 General Test (Type C), Q40","q":"A situation whereby one is confronted with making a moral choice and either of the alternative is difficult to satisfy is called _______","o":["Ethical situationism","Moral dilemma","Principles","Principilism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes."}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
  return e;}
const KEYSTORE='philosophy-cbt-user-keys';
let userKeys={};
try{userKeys=JSON.parse(localStorage.getItem(KEYSTORE)||'{}')||{}}catch(e){userKeys={}}
function saveKeys(){try{localStorage.setItem(KEYSTORE,JSON.stringify(userKeys))}catch(e){}}
const keyOf=q=>q.a||userKeys[q.id]||null;
const PAST=['GES 106 FIRST TEST','GES 106 GENERAL TEST','GES 106 TYPE B','GES 106 PAPER','GST 212 NEXUS MINDS','PHILOSOPHY BATCH B','GST 212 CA TEST','GST 212 GENERAL TEST (TYPE C)'];
const ALLSETS=[...new Set(DATA.map(q=>q.set))];
const BANK=ALLSETS.filter(s=>!PAST.includes(s));
const S={view:'setup',sel:new Set(PAST),opts:{count:60,minutes:45,timed:true,shuffle:true,unkeyed:true,minEdited:false},exam:null,result:null,filter:'all'};
let timer=null;
const fmt=t=>{t=Math.max(0,t);const hh=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return (hh?hh+':':'')+String(m).padStart(2,hh?'0':'0')+':'+String(s).padStart(2,'0')};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setBar(content){const b=$('#bar');b.replaceChildren();b.hidden=!content;if(content)b.append(...content)}

/* ---------- setup ---------- */
function pool(){return DATA.filter(q=>S.sel.has(q.set)&&(S.opts.unkeyed||keyOf(q)))}
function renderSetup(){
  clearInterval(timer);S.view='setup';setBar(null);
  const root=$('#app');root.replaceChildren();
  const boxes={};
  const group=(sets)=>h('div',{class:'checks'},sets.map(s=>{
    const total=DATA.filter(q=>q.set===s).length;
    const cb=h('input',{type:'checkbox',checked:S.sel.has(s),onchange:e=>{e.target.checked?S.sel.add(s):S.sel.delete(s);poolChanged()}});
    boxes[s]=cb;
    return h('label',{class:'chk'},cb,h('span',{class:'t'},s),h('span',{class:'n'},total+' Qs'))}));
  const count=h('input',{type:'number',id:'count',min:1,value:S.opts.count,oninput:e=>{S.opts.count=+e.target.value||1;if(!S.opts.minEdited){S.opts.minutes=Math.max(1,Math.ceil(S.opts.count*.75));minutes.value=S.opts.minutes}sum()}});
  const minutes=h('input',{type:'number',id:'minutes',min:1,value:S.opts.minutes,oninput:e=>{S.opts.minutes=+e.target.value||1;S.opts.minEdited=true}});
  const summary=h('div',{class:'summary',id:'summary','aria-live':'polite'});
  const startBtn=h('button',{class:'btn primary',id:'start',onclick:start},'Start test');
  function sum(){
    const p=pool();const keyed=p.filter(keyOf).length;
    count.max=p.length;
    summary.textContent=p.length?`${p.length} questions available · ${keyed} with answer key · will use ${Math.min(S.opts.count,p.length)}`:'Pick at least one source';
    startBtn.disabled=!p.length;}
  function poolChanged(){const p=pool();S.opts.count=p.length||1;count.value=S.opts.count;
    if(!S.opts.minEdited){S.opts.minutes=Math.max(1,Math.ceil(S.opts.count*.75));minutes.value=S.opts.minutes}sum()}
  function start(){const p=pool();if(!p.length)return;
    const n=Math.min(Math.max(1,S.opts.count),p.length);
    let qs=S.opts.shuffle?shuffle(p).slice(0,n):p.slice(0,n);
    startExam(qs,S.opts.minutes,S.opts.timed)}
  const tm=h('input',{type:'checkbox',id:'timed',checked:S.opts.timed,onchange:e=>{S.opts.timed=e.target.checked;minutes.disabled=!S.opts.timed}});
  minutes.disabled=!S.opts.timed;
  root.append(
    h('h1',{text:'Philosophy CBT Practice'}),
    h('p',{class:'muted',text:'GES 106 and GST 212 past questions, word for word. After you submit, the note under each question says where its answer came from.'}),
    h('div',{class:'setup'},
      h('section',{class:'panel'},
        h('h2',{text:'Your Philosophy question sets'}),group(PAST),
        BANK.length?h('h2',{style:'margin-top:20px',text:'MCQ bank by chapter'}):null,BANK.length?group(BANK):null,
        h('div',{class:'row',style:'margin:14px 0 0'},
          h('button',{class:'btn',onclick:()=>{ALLSETS.forEach(s=>S.sel.add(s));ALLSETS.forEach(s=>boxes[s].checked=true);poolChanged()}},'Select all'),
          h('button',{class:'btn',onclick:()=>{S.sel.clear();ALLSETS.forEach(s=>boxes[s].checked=false);poolChanged()}},'Clear'))),
      h('section',{class:'panel'},
        h('h2',{text:'Test settings'}),
        h('div',{class:'row'},
          h('div',{class:'field'},h('label',{for:'count'},'Questions'),count),
          h('div',{class:'field'},h('label',{for:'minutes'},'Minutes'),minutes)),
        h('label',{class:'tick'},tm,h('span',{},'Timed test (auto-submits at zero)')),
        h('label',{class:'tick'},h('input',{type:'checkbox',id:'shuf',checked:S.opts.shuffle,onchange:e=>S.opts.shuffle=e.target.checked}),h('span',{},'Shuffle questions (options keep their original order)')),
        h('label',{class:'tick'},h('input',{type:'checkbox',id:'unk',checked:S.opts.unkeyed,onchange:e=>{S.opts.unkeyed=e.target.checked;poolChanged()}}),h('span',{},'Include questions with no answer key (shown, not scored)')),
        summary,startBtn)));
  sum();
}

/* ---------- exam ---------- */
function startExam(qs,minutes,timed){
  S.exam={qs,ans:{},flags:new Set(),idx:0,timed,minutes,start:Date.now(),end:Date.now()+minutes*60000,confirm:false};
  S.view='exam';renderExam();
  clearInterval(timer);timer=setInterval(tick,500);tick();window.scrollTo(0,0);}
function tick(){const E=S.exam;if(!E)return;const el=$('#clock');if(!el)return;
  if(E.timed){const r=Math.ceil((E.end-Date.now())/1000);el.textContent=fmt(r);el.classList.toggle('low',r<=300);if(r<=0)submit(true)}
  else el.textContent=fmt(Math.floor((Date.now()-E.start)/1000));}
function renderExam(){
  const E=S.exam;
  setBar([h('div',{class:'title'},'Philosophy CBT',h('small',{},E.timed?'Time remaining':'Time elapsed')),
    h('div',{class:'clock',id:'clock','aria-live':'off'},'--:--'),
    h('button',{class:'btn primary',onclick:()=>{E.confirm=true;renderConfirm()}},'Submit test')]);
  const root=$('#app');root.replaceChildren(
    h('div',{class:'exam'},h('section',{class:'panel',id:'qpanel'}),
      h('aside',{class:'side panel'},h('h2',{text:'Question palette'}),h('div',{class:'pal',id:'pal'}),
        h('div',{class:'legend'},h('span',{},h('i',{class:'a'}),'Answered'),h('span',{},h('i'),'Not answered'),h('span',{},h('i',{class:'f'}),'Flagged')),
        h('p',{class:'keys'},'Keys: A–E answer · N next · P previous · F flag'))));
  showQ();}
function go(i){const E=S.exam;E.idx=Math.min(E.qs.length-1,Math.max(0,i));showQ();window.scrollTo({top:0})}
function showQ(){
  const E=S.exam,q=E.qs[E.idx],id=q.id;
  const p=$('#qpanel');p.replaceChildren(
    h('div',{class:'qhead'},h('div',{class:'qno'},`Question ${E.idx+1} of ${E.qs.length}`),h('div',{class:'ref'},'Reference: '+q.ref)),
    h('div',{class:'qtext'},q.q),
    h('fieldset',{},h('legend',{class:'muted small',style:'margin-bottom:8px'},'Choose one answer'),
      h('div',{class:'opts'},q.o.map((t,i)=>{const L='ABCDE'[i];
        return h('label',{class:'opt'},h('input',{type:'radio',name:'opt',value:L,checked:E.ans[id]===L,onchange:()=>{E.ans[id]=L;pal()}}),h('span',{class:'l'},L+'.'),h('span',{class:'tx'},t))}))),
    h('div',{class:'nav'},
      h('button',{class:'btn',disabled:E.idx===0,onclick:()=>go(E.idx-1)},'Previous'),
      h('button',{class:'btn primary',disabled:E.idx===E.qs.length-1,onclick:()=>go(E.idx+1)},'Next'),
      h('label',{class:'flagbox sp'},h('input',{type:'checkbox',checked:E.flags.has(id),onchange:e=>{e.target.checked?E.flags.add(id):E.flags.delete(id);pal()}}),'Flag for review'),
      h('button',{class:'btn',disabled:!E.ans[id],onclick:()=>{delete E.ans[id];showQ();pal()}},'Clear answer')));
  pal();}
function pal(){const E=S.exam,box=$('#pal');if(!box)return;
  box.replaceChildren(...E.qs.map((q,i)=>h('button',{class:'pb'+(E.ans[q.id]?' ans':'')+(E.flags.has(q.id)?' fl':'')+(i===E.idx?' cur':''),'aria-label':`Question ${i+1}${E.ans[q.id]?', answered':''}${E.flags.has(q.id)?', flagged':''}`,'aria-current':i===E.idx?'true':null,onclick:()=>go(i)},String(i+1))));
  const c=box.querySelector('.cur');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest'});}
function renderConfirm(){
  const E=S.exam;document.querySelector('.overlay')?.remove();if(!E.confirm)return;
  const un=E.qs.filter(q=>!E.ans[q.id]).length,fl=E.flags.size;
  const close=()=>{E.confirm=false;document.querySelector('.overlay')?.remove()};
  document.body.append(h('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':'Submit test'},
    h('div',{class:'dialog'},h('h1',{style:'font-size:21px',text:'Submit your test?'}),
      h('p',{class:'muted'},`${E.qs.length-un} of ${E.qs.length} answered · ${un} unanswered · ${fl} flagged for review.`),
      h('p',{class:'small muted'},'You cannot change answers after submitting.'),
      h('div',{class:'row'},h('button',{class:'btn',onclick:close},'Keep working'),h('button',{class:'btn primary',onclick:()=>{close();submit(false)}},'Submit now')))));}
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('.overlay'))return;
  const k=e.key.toLowerCase(),E=S.exam,q=E.qs[E.idx];
  if('abcde'.includes(k)&&k.length===1&&q.o[k.charCodeAt(0)-97]!==undefined){E.ans[q.id]=k.toUpperCase();showQ()}
  else if(k==='n')go(E.idx+1);else if(k==='p')go(E.idx-1);
  else if(k==='f'){E.flags.has(q.id)?E.flags.delete(q.id):E.flags.add(q.id);showQ()}});

/* ---------- results ---------- */
function submit(auto){
  const E=S.exam;if(!E||S.view!=='exam')return;
  clearInterval(timer);document.querySelector('.overlay')?.remove();
  const items=E.qs.map(q=>({q,key:keyOf(q),pick:E.ans[q.id]||null,flag:E.flags.has(q.id)}));
  const scored=items.filter(i=>i.key),right=scored.filter(i=>i.pick===i.key),wrong=scored.filter(i=>i.pick&&i.pick!==i.key),blank=scored.filter(i=>!i.pick);
  S.result={items,scored,right,wrong,blank,auto,timed:E.timed,minutes:E.minutes,used:Math.min(Math.floor((Date.now()-E.start)/1000),E.minutes*60*(E.timed?1:1e6))};
  S.view='result';S.filter='all';renderResult();window.scrollTo(0,0);}
function renderResult(){
  const R=S.result;setBar([h('div',{class:'title'},'Philosophy CBT',h('small',{},'Results')),h('button',{class:'btn primary',onclick:renderSetup},'New test')]);
  const pct=R.scored.length?Math.round(R.right.length/R.scored.length*100):null;
  const unk=R.items.length-R.scored.length;
  const bySet={};R.scored.forEach(i=>{const s=bySet[i.q.set]??={n:0,c:0};s.n++;if(i.pick===i.key)s.c++});
  const retry=[...R.wrong,...R.blank].map(i=>i.q);
  const root=$('#app');root.replaceChildren();
  root.append(
    h('section',{class:'panel'},
      R.auto?h('p',{class:'small',style:'color:var(--bad);font-weight:600'},'Time ran out. Your test was submitted automatically.'):null,
      h('div',{class:'score'},h('div',{class:'big'},pct==null?'–':pct+'%'),
        h('div',{class:'stats'},
          h('div',{class:'stat'},h('b',{},`${R.right.length}/${R.scored.length}`),h('span',{},'correct (scored)')),
          h('div',{class:'stat'},h('b',{},String(R.wrong.length)),h('span',{},'wrong')),
          h('div',{class:'stat'},h('b',{},String(R.blank.length)),h('span',{},'unanswered')),
          unk?h('div',{class:'stat'},h('b',{},String(unk)),h('span',{},'not scored (no answer key)')):null,
          h('div',{class:'stat'},h('b',{},fmt(R.used)),h('span',{},'time used')))),
      Object.keys(bySet).length>1?h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Source'),h('th',{class:'n'},'Correct'),h('th',{class:'n'},'Scored'),h('th',{class:'n'},'%'))),
        h('tbody',{},Object.entries(bySet).map(([k,v])=>h('tr',{},h('td',{},k),h('td',{class:'n'},String(v.c)),h('td',{class:'n'},String(v.n)),h('td',{class:'n'},Math.round(v.c/v.n*100)+'%')))))):null,
      h('div',{class:'row',style:'margin:18px 0 0'},
        h('button',{class:'btn primary',disabled:!retry.length,onclick:()=>startExam(shuffle(retry),Math.max(1,Math.ceil(retry.length*.75)),R.timed)},`Retry wrong and unanswered (${retry.length})`),
        h('button',{class:'btn',onclick:renderSetup},'New test'))),
    h('div',{class:'filters',id:'filters'}),h('div',{id:'review'}));
  drawFilters();drawReview();}
function drawFilters(){
  const R=S.result;const defs=[['all','All',R.items.length],['wrong','Wrong',R.wrong.length],['blank','Unanswered',R.blank.length],['flag','Flagged',R.items.filter(i=>i.flag).length],['unk','No answer key',R.items.length-R.scored.length]];
  $('#filters').replaceChildren(...defs.map(([k,l,n])=>h('button',{class:'fbtn','aria-pressed':S.filter===k,onclick:()=>{S.filter=k;drawFilters();drawReview()}},`${l} (${n})`)));}
function drawReview(){
  const R=S.result;const f=S.filter;
  const list=R.items.map((it,i)=>({it,i})).filter(({it})=>f==='all'||(f==='wrong'&&it.key&&it.pick&&it.pick!==it.key)||(f==='blank'&&it.key&&!it.pick)||(f==='flag'&&it.flag)||(f==='unk'&&!it.key));
  const box=$('#review');box.replaceChildren();
  if(!list.length){box.append(h('p',{class:'muted',text:'Nothing here.'}));return}
  list.forEach(({it,i})=>{const q=it.q,key=keyOf(q);
    const status=!key?h('span',{class:'pill'},'Not scored'):!it.pick?h('span',{class:'pill'},'Unanswered'):it.pick===key?h('span',{class:'pill',style:'color:var(--good);border-color:var(--good)'},'Correct'):h('span',{class:'pill',style:'color:var(--bad);border-color:var(--bad)'},'Wrong');
    const card=h('article',{class:'item'},
      h('div',{class:'qhead'},h('div',{class:'qno',style:'font-size:16px'},`Question ${i+1}`,status,it.flag?h('span',{class:'pill fl'},'Flagged'):null),h('div',{class:'ref'},q.ref)),
      h('div',{class:'qt'},q.q),
      q.o.map((t,j)=>{const L='ABCDE'[j];let c='ro',tag='';
        if(key&&L===key){c+=' ok';tag='Correct answer'+(it.pick===L?' · your answer':'')}
        else if(it.pick===L){c+=key?' no':' pk';tag=key?'Your answer':'Your answer'}
        return h('div',{class:c},h('span',{class:'l'},L+'.'),h('span',{class:'tx'},t),tag?h('span',{class:'tag'},tag):null)}),
      h('div',{class:'src'},key?(q.a?q.s:'Key saved by you (counts from your next test)'):'No answer key in your files for this question.'));
    if(!key){card.append(h('div',{class:'keyset'},'Know the answer? Save it for next time:',...'ABCDE'.slice(0,q.o.length).split('').map(L=>h('button',{class:'btn',onclick:()=>{userKeys[q.id]=L;saveKeys();drawReview()}},L))))}
    else if(!q.a){card.append(h('div',{class:'keyset'},h('button',{class:'btn',onclick:()=>{delete userKeys[q.id];saveKeys();drawReview()}},'Remove my saved key')))}
    box.append(card)});}
renderSetup();
</script>
