ng the question","Appeal to authority","False cause","Argument from ignorance"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The argument uses the Bible to prove God exists and then the Bible's authority comes from God. It assumes what it is trying to prove, which is circular reasoning (begging the question)."},{"id":"g-91","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q91","q":"________ does not characterise a human activity as an instance of scientific research.","o":["An activity that is popular in the academic community","An activity that is systematic rather than random","An activity that has a specific function and is aimed at contributing to a body of knowledge","An activity that has some sociological aspects in common with some other scientific activities"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Scientific research is systematic, has a specific aim and contributes to a body of knowledge. Being popular in the academic community says nothing about whether it is scientific."},{"id":"g-92","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q92","q":"How can ethics help us to control global warming?","o":["It makes available the necessary information about global warming","It helps us in re-examining our values in relation to nature and living","It helps us to acquire statistical data about global warming","It helps us in preparing to cope with global warming"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Ethics helps by making us re-examine our values toward nature and how we live, which is what drives the changes needed. Information, data and coping are the job of science and planning."},{"id":"g-93","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q93","q":"What would you consider the most important reason for not equating ethics with religion?","o":["Religion is the opium of the masses","Religion is a personal idea","Ethics applies to both the atheists and religion adherents","God is the founder of religions"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Ethics applies to everyone, whether religious or atheist. If ethics were the same as religion, non-believers would be outside it."},{"id":"g-94","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q94","q":"'All Edolites are Nigerians. All Nigerians are Africans. Therefore, all Edolites are Africans.' This is an example of ______ argument.","o":["A deductive","An inductive","A sound","A sound inductive"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"If both premises are true, the conclusion has to be true. That makes it deductive."},{"id":"g-95","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q95","q":"Identify the conclusion in the following passage: 'Even though most of the world population is immunized than ever before, many old diseases have proven quite resilient in the face of changing population and environmental conditions, especially in the developing world. New diseases, such as AIDS, have taken their toll in both the North and the South.'","o":["No argument","Many old diseases have proven quite resilient in the face of changing population and environmental conditions...","New diseases, such as AIDS, have taken their toll in both the North and the South","No conclusion"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The conclusion is the claim the rest supports. Here it is that many old diseases have proven resilient, with the AIDS sentence as supporting evidence, so B is the conclusion."},{"id":"g-96","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q96","q":"Two major types of arguments are:","o":["Disruptive and inductive","Inductive and delusive","Deductive and inductive","Impressive and inductive"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The two major types of argument are deductive and inductive."},{"id":"g-97","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q97","q":"Identify the fallacy committed in this passage: 'This can of Small Cola looks just like the one I drank yesterday. The one I drank yesterday had a subtle taste of lime. Therefore, probably this one also has a subtle taste of lime.'","o":["Equivocation","Division","No fallacy","Begging the question"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"This is an argument by analogy. It only claims 'probably', so it is a reasonable inductive argument and not a fallacy."},{"id":"g-98","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q98","q":"The abortion debate is between ______ and ______.","o":["Christians and Muslims","The pro-life movements and the liberals","Philosophers and medical doctors","Philosophers and theologians"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"The abortion debate is between the pro-life movement (the foetus has a right to life) and the liberals (the woman has a right to choose)."},{"id":"g-99","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q99","q":"Just as morality provides content for ethics, ______ provide content for logic.","o":["Validity","Arguments","Fallacy","Induction"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Arguments are the subject matter of logic, as moral issues are of ethics."},{"id":"g-100","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q100","q":"The character of philosophy that makes it involved with other disciplines is its:","o":["Meddlesome character","Logical character","Critical character","Reactive character"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Philosophy's 'meddlesome' character is that it gets involved in other disciplines, asking questions about their foundations."},{"id":"g-101","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q101","q":"The element of critical thinking that demands that you ensure your ideas and beliefs are not contradictory is known as:","o":["Explanatory capacity","Logical coherence","Logical capacity","Explanatory coherence"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Logical coherence means your beliefs do not contradict one another."},{"id":"g-102","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q102","q":"What is virtue ethics?","o":["Ethics that promotes the actions of virtuous people","Ethics that teach morality in terms of rules","Ethics that judges actions only by their consequences","Ethics that is based only on divine commands"],"a":"A","s":"Answer from the GST 212 Nexus Minds PDF. Options C and D were not visible in the PDF and were written by Claude.","e":"Virtue ethics promotes the actions of virtuous people: it asks what a good person would do and so focuses on character."},{"id":"g-118","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q118","q":"One of the following beliefs is radically different from the beliefs held by Aristotle:","o":["The earth is located at the centre of the universe","The earth and planets move in elliptical orbits around the sun","The earth is stationary, that is, it neither orbits any other body","Males and females have different numbers of teeth"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Aristotle believed the earth is at the centre of the universe and stationary. Earth and planets orbiting the sun in ellipses is the later Copernican and Keplerian view."},{"id":"g-119","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q119","q":"If 'all lawyers are liars' is true, and 'Aderemi is a lawyer' is also true, which of the following propositions is true?","o":["Aderemi is probably a liar","Aderemi is not a liar","Aderemi is a liar","Aderemi is a true lawyer"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"This is deduction. If all lawyers are liars and Aderemi is a lawyer, it follows necessarily that he is a liar."},{"id":"g-120","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q120","q":"The argument that everything that exists can be expressed in tangible and perceptual terms is:","o":["Idealism","Existentialism","Materialism","Nihilism"],"a":"C","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Materialism holds that everything that exists is physical, which means tangible and perceptible."},{"id":"g-121","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q121","q":"The Father of Metaphysics is ______.","o":["Socrates","Plato","Pythagoras","Parmenides"],"a":"D","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Parmenides is called the Father of Metaphysics because he reasoned about the nature of being and reality."},{"id":"g-122","set":"GST 212 NEXUS MINDS","ref":"GST 212 Nexus Minds, Q122 (also Philosophy Batch B Q5)","q":"Which of the following is NOT traditionally considered a branch of philosophy?","o":["Epistemology","Astrology","Metaphysics","Ethics"],"a":"B","s":"Answer from the GST 212 Nexus Minds PDF.","e":"Epistemology, metaphysics and ethics are branches of philosophy. Astrology is not."},{"id":"b-1","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q1","q":"What is logic primarily concerned with?","o":["The study of the human mind","The study of ethical conduct","Correct reasoning and argumentation","The study of the origin of the universe"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Logic is concerned with correct reasoning and argumentation, with telling good arguments from bad ones."},{"id":"b-2","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q2","q":"\"Therefore\" is commonly used as a(n):","o":["Premise indicator","Conclusion indicator","Connective sign","Fallacy indicator"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"'Therefore' introduces the conclusion, so it is a conclusion indicator."},{"id":"b-3","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q3","q":"What involves a situation whereby one is confronted with making a moral choice, and either way one considers the alternatives available, one will discover that it is very difficult to satisfy all of the moral rules that apply to the issue at hand?","o":["Moral Relativism","Moral Dilemma","Moral Judgment","Moral Obligation"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"A moral dilemma is a situation where every option seems to violate some moral rule, so no choice fully satisfies them."},{"id":"b-4","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q4","q":"__________ is the aspect of ethics that seeks to set norms or standards for conduct.","o":["Meta-ethics","Normative Ethics","Applied Ethics","Descriptive Ethics"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Normative ethics sets norms and standards for conduct, asking what we should do."},{"id":"b-7","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q7","q":"The philosophical branch that investigates the nature and limits of human knowledge is:","o":["Metaphysics","Ethics","Logic","Epistemology"],"a":"D","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Epistemology investigates the nature and limits of human knowledge."},{"id":"b-8","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q8","q":"Situation ethics posits that:","o":["Moral rules are universal and unchangeable","The context and situation determine the right action.","Only intentions matter, never outcomes","Right action is whatever the law commands"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Situation ethics says there are no fixed rules, and the right action depends on the context and the situation."},{"id":"b-9","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q9 (also GES 106 Type B Q30)","q":"According to ______, an unexamined life is not worth living.","o":["Plato","Aristotle","Socrates","Descartes"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Socrates said the unexamined life is not worth living."},{"id":"b-10","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q10","q":"What does the philosophical term \"ontology\" refer to?","o":["The study of knowledge","The study of moral values","The study of being and existence","The study of correct reasoning"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Ontology is the study of being and existence, a part of metaphysics."},{"id":"b-11","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q11","q":"Logic can be classified into ______ and ______","o":["Ethical and practical logic","Formal and informal logic","Natural and supernatural logic","Applied and theoretical logic"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Logic is divided into formal logic (symbolic, structure-based) and informal logic (everyday language)."},{"id":"b-13","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q13 (also GES 106 General Test 2024/25 Q3)","q":"______ is the view that man is composed of only one entity.","o":["Monism","Dualism","Pluralism","Interactionism"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Monism says a human is made of only one entity, either mind or body. Dualism says two."},{"id":"b-14","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q14","q":"______ is not a metaphysical problem.","o":["Mind and body","Freedom and determinism","Appearance and reality","Morality & truth"],"a":"D","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Mind and body, freedom and determinism and appearance and reality are metaphysical problems. Morality and truth are ethical and epistemological matters."},{"id":"b-15","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q15","q":"The mind according to the empiricists at birth is ______","o":["Clean slate","Full of innate ideas","Divinely programmed","Fully rational"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Empiricists such as Locke say the mind at birth is a tabula rasa, a clean slate, and experience writes on it."},{"id":"b-16","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q16","q":"The problem of appearance and reality is a ______ problem.","o":["Ethical","Metaphysical","Logical","Aesthetic"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Appearance versus reality asks what really exists behind what we perceive. That is a metaphysical question."},{"id":"b-19","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q19","q":"According to ______, philosophy is the criticism of the ideas we live by.","o":["Plato","Aristotle","H.S. Staniland","Bertrand Russell"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"H. S. Staniland defined philosophy as 'the criticism of the ideas we live by'."},{"id":"b-20","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q20","q":"The main subdivision of ethics includes the following EXCEPT:","o":["Meta-ethics","Normative ethics","Relative ethics","Applied ethics"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"The main subdivisions of ethics are meta-ethics, normative ethics and applied ethics. 'Relative ethics' is not one of them."},{"id":"b-21","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q21","q":"Virtue is a philosophical concept.","o":["Yes","No","Maybe","I do not know"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Virtue is a central concept in philosophy, especially in Aristotle's and Socrates' ethics, so the answer is Yes."},{"id":"b-22","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q22","q":"______ is the position that the rightness or wrongness of any action is dependent entirely on the consequences. If it maximizes the greatest good for the greatest person.","o":["Utilitarianism","Deontology","Virtue ethics","Divine command theory"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Utilitarianism judges actions by consequences and the greatest good for the greatest number."},{"id":"b-23","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q23","q":"The following are types of concept except:","o":["Abstract concepts","Concrete concepts","Relational concepts","Propositional concepts"],"a":"D","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Concepts are classed as abstract, concrete and relational. 'Propositional concepts' is not one of those types."},{"id":"b-24","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q24","q":"Rational inquiry involves the search for truth, information or knowledge by ______","o":["Believing authorities without question","Asking questions","Following tradition","Avoiding doubt"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Rational inquiry works by asking questions and testing answers, not by accepting authority or tradition."},{"id":"b-25","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q25","q":"Which of the following is an epistemology problem?","o":["The problem of scepticism","The problem of freedom and determinism","The problem of appearance and reality","The problem of mind and body"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"The problem of scepticism concerns whether we can know anything, so it is an epistemological problem. The others are metaphysical."},{"id":"b-26","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q26 (also GES 106 General Test 2024/25 Q1)","q":"The question of how moral agents justify moral claims is tackled by what branch of Philosophy?","o":["Logic","Metaphysics","Ethics","Epistemology"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Ethics is the branch that deals with moral claims and how to justify them."},{"id":"b-27","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q27","q":"The following are metaphysical problems except:","o":["Knowing versus feeling certain","Mind and body","Freedom and determinism","Appearance and reality"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Mind and body, freedom and determinism and appearance and reality are metaphysical. Knowing versus feeling certain is about knowledge, which is epistemology."},{"id":"b-28","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q28","q":"Applied ethics is the branch of ethics which examines the moral status of:","o":["Controversial issues","Abstract concepts","Moral language","Logical arguments"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Applied ethics examines the moral status of controversial practical issues like abortion and euthanasia."},{"id":"b-29","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q29","q":"Immanuel Kant is associated with which ethical theory?","o":["Deontology","Utilitarianism","Egoism","Virtue ethics"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Kant's ethics is deontology: duty and the categorical imperative."},{"id":"b-30","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q30","q":"What is the subject matter of Logic?","o":["Morality","Argument","Being","Knowledge"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Logic's subject matter is the argument, studying when conclusions follow from premises."},{"id":"b-31","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q31","q":"Pick out the odd one.","o":["Idealism","Materialism","Dualism","Ultimatism"],"a":"D","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Idealism, materialism and dualism are real positions on what exists. 'Ultimatism' is not a recognised position."},{"id":"b-32","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q32","q":"One of the following is an ethical theory:","o":["Idealism","Consequentialism","Rationalism","Empiricism"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Consequentialism is an ethical theory. Idealism is metaphysical, and rationalism and empiricism are epistemological."},{"id":"b-33","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q33","q":"Monism on the question of mind/body problem argues that man is composed of:","o":["Either mind or body","Both mind and body as separate entities","Neither mind nor body","Mind and soul only"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Monism says there is a single substance, so a human is either mind or body, and not both as separate entities."},{"id":"b-34","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q34","q":"One of the following is a branch of ethics:","o":["Aesthetics","Applied Ethics","Cosmology","Ontology"],"a":"B","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Applied ethics is a branch of ethics. Aesthetics, cosmology and ontology belong elsewhere."},{"id":"b-35","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q35","q":"Philosophy originally began in ______","o":["Wonder","Fear","Wealth","Religion"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Philosophy began in wonder, the curiosity about the world that Plato and Aristotle described."},{"id":"b-36","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q36","q":"One of the following seems to differentiate humans from animals. The faculty of______","o":["Instinct","Sensation","Reasoning","Movement"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Reasoning is the faculty that sets humans apart. Animals have instinct, sensation and movement too."},{"id":"b-37","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q37","q":"Why is philosophy inevitable for humans?","o":["Humans are rational by nature","Philosophy is compulsory in schools","Philosophy is a religion","Governments require it"],"a":"A","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Humans are rational by nature, so we cannot help asking fundamental questions, which makes philosophy unavoidable."},{"id":"b-38","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q38","q":"______ is the attempt to answer the most fundamental questions of human existence?","o":["Scientific experiment","Religious ritual","Philosophical inquiry","Political debate"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Philosophical inquiry is the attempt to answer the most fundamental questions of human existence."},{"id":"b-39","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q39","q":"Metaphysics is subdivided into______ and ______","o":["Logic and Ethics","Epistemology and Ethics","Ontology and Cosmology","Rationalism and Empiricism"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Metaphysics is divided into ontology (the study of being) and cosmology (the study of the universe)."},{"id":"b-40","set":"PHILOSOPHY BATCH B","ref":"Philosophy Batch B, Q40","q":"The two major schools of thought on the question of how humans come to knowledge include ______ and ______","o":["Idealism and Materialism","Monism and Dualism","Rationalism and Empiricism","Theism and Atheism"],"a":"C","s":"Answer from your Batch B file. That file gave only the correct option, so the other options were written by Claude to complete the question.","e":"Rationalism (knowledge comes from reason) and empiricism (from experience) are the two main schools on the origin of knowledge."},{"id":"gt-2","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q2 (also GST 212 General Test Type C Q36)","q":"Which of the following is a theory in knowledge?","o":["Capitalism","Phenomenology","Rationalism","Interpretivism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Rationalism is a theory of knowledge. Capitalism is economic, and phenomenology and interpretivism are methods and approaches in other fields."},{"id":"gt-4","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q4","q":"One may argue that philosophical problems are ________ because they are without accepted solutions.","o":["Coterminous","Continuous","Perennial","Conservative"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Perennial means lasting through time. Philosophical problems keep coming back because no accepted solution has ended them."},{"id":"gt-5","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q5","q":"_______ is the school of thought that claims that everything is an illusion.","o":["Reductive idealist","Scepticism","Nihilism","Solipsism"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"In the course material the view that everything is an illusion is called reductive idealism, because it reduces reality to ideas or appearances."},{"id":"gt-6","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q6","q":"The maxim that “An unexamined life is not worth living” was made by:","o":["Plato","Socrates","David Aremu","Aristotle"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Socrates said the unexamined life is not worth living."},{"id":"gt-7","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q7","q":"The object of philosophy is the logical clarification of ……..","o":["Morals","Values","Interests","Thoughts"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Wittgenstein said the object of philosophy is the logical clarification of thoughts. Philosophy is an activity of clarifying meaning, and not a body of doctrine."},{"id":"gt-8","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q8","q":"Traditionally, ------------ is defined as justified true belief.","o":["Skepticism","Epistemology","Ethics","Knowledge"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Traditionally, knowledge is defined as justified true belief: you believe it, it is true, and you have good reason for it. Epistemology is the study of knowledge, not the definition."},{"id":"gt-9","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q9 (also GST 212 General Test Type C Q24)","q":"One of these is among the basic laws/principles of thought.","o":["Law of Induction","Law of Identity","Law of Possibility","Law of Deduction"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The three basic laws of thought are identity, contradiction and excluded middle. Induction, possibility and deduction are not laws of thought."},{"id":"gt-10","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q10","q":"“The main concern of ‘S’ is to study and understand the connections between claim and evidence. In doing this, ‘S’ aims to discover the basic technics and principles for identifying right and wrong propositions, truth and false propositions, valid and invalid propositions, sound and unsound propositions, etc.” The ‘S’ in the above statement can stand in for -------------","o":["Argument","Logic","Metaphysics","Rationalism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The description is of logic: studying claim and evidence and judging valid or invalid and sound or unsound arguments. An argument is the object of study, and metaphysics and rationalism are different areas."},{"id":"gt-11","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q11 (also GST 212 General Test Type C Q10)","q":"Man as a human being has a tendency to fall into error in his reasoning and actions accruing from them. This is why there are arguments which appear so persuasive for acceptance whereas they are very wrong in their structural form in the sense that their claims (conclusions) do not derive support from their justifications (premises); they are not valid, their propositions are not true; and they are not sound. When this happens, we say that there is error in the mode of reasoning. This kind of error is what has been denoted in logical terms as  ________","o":["Argument","Conclusion","Fallacy","Premise"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A mistake in reasoning that makes a weak argument look persuasive is a fallacy. An argument is the whole set of statements, and a premise or conclusion is only part of it."},{"id":"gt-12","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q12 (also GST 212 General Test Type C Q11)","q":"The following could be accepted as definitions of philosophy—(i) Philosophy is a reflective or meditative human attempt to systematically and critically study human experience; (ii) Philosophy is the criticism of the ideas we live by; (iii) Philosophy is the examination of the intellectual foundations of life, using the best available modes of knowledge and reflection for human well-being; (iv) Philosophy is a reflective and critical thinking about the concepts and principles which we use to organize our experience in moral, religion, in social and political life, in laws, in history, and the natural sciences.","o":["i & ii only","ii & iii only","iii & iv only","All of the above"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Statements (i) to (iv) are all accepted definitions of philosophy: a reflective study of experience, criticism of the ideas we live by, examination of life's foundations, and critical thinking about our concepts. So all of them apply."},{"id":"gt-13","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q13","q":"As a first order discipline, philosophy does ______ (i) Philosophy reflects on the essential subjects such as being, knowledge, ethics and correct mode of thinking. (ii) Philosophy investigates the projects of other disciplines.","o":["i and ii","ii only","i only","All of the above"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"As a first-order discipline, philosophy reflects on its own core subjects, such as being, knowledge, ethics and correct thinking, which is (i). Investigating the projects of other disciplines is second-order work, so (ii) is excluded."},{"id":"gt-14","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q14","q":"The invention of such things as poisonous gas, bullets, or even the atomic bomb has led to the death of millions of people in the world. The productions of industrial and agricultural chemicals; the toxic gases from vehicle exhausts and industrial machines—these have led to the pollution of the global environment and the contamination of the air that we breath.” The above excerpt shows that the activities of Science need _____________.","o":["Political wedge","Metaphysical wedge","Ethical wedge","Economic wedge"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The excerpt lists the harms of science, from weapons to pollution. That shows science needs ethical guidance, an 'ethical wedge', to keep its work beneficial."},{"id":"gt-15","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q15 (also GES 106 Type B Q6)","q":"____________ used the approach of methodological skepticism in his search for foundational knowledge.","o":["Immanuel Kant","Rene Descartes","David Hume","Hegel"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Descartes doubted everything he could (methodological scepticism) to find a certain foundation. He ended with 'I think, therefore I am'."},{"id":"gt-16","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q16","q":"Which of these statements capture the problems of universals;","o":["If seven entities are numbered, the sum of all seven entities is a reflection of the difference between each of them","The problem of universals looks at the relations or qualities found in two or more entities and ask the question; whether or not properties an object shares with other objects such as colour or shape can be considered to exist outside those objects?","Particulars are of more philosophical value than universals, as they are the real existing phenomenon whereas universals are abstract ideas with no place in the real world."],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The problem of universals asks whether shared qualities, like colour or shape, exist outside the objects that have them. The other options do not state that problem."},{"id":"gt-17","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q17","q":"Aposteriori knowledge refers to","o":["Knowledge gotten through philosophical guessing","Knowledge gotten through experience","Any knowledge claim a person makes","Knowledge derived form reason"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A posteriori knowledge comes after, and from, experience (observation and sense data). A priori is the kind that comes from reason alone."},{"id":"gt-18","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q18","q":"The Statement cogito ergo sum, meaning I think therefore I am, is attributed to;","o":["Socrates","Rene Descartes","Galileo Galilee","Albert Einstein"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"'Cogito ergo sum' ('I think, therefore I am') is Descartes' statement. He used it as the one certainty that survives total doubt."},{"id":"gt-19","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q19","q":"Who is the empiricist philosopher known for his argument that all human knowledge originates from sensory experience?","o":["René Descartes","Immanuel Kant","John Locke","Plato"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"John Locke, a British empiricist, argued all knowledge comes from sensory experience and the mind starts as a blank slate. Descartes and Plato are rationalists."},{"id":"gt-20","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q20","q":"What does the concept of monism in metaphysics refer to?","o":["The belief in multiple realities","The idea that reality is composed of many substances","The theory that all of reality is fundamentally one substance","The view that reality is divided into the physical and non-physical"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Monism holds that all reality is fundamentally one substance (matter or mind). Dualism says two, and pluralism says many."},{"id":"gt-21","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q21","q":"The two basic forms of inquiry are","o":["Philosophical Inquiry and Rational inquiry","Rational inquiry and Scientific Inquiry","Philosophical inquiry and scientific inquiry","Philosophical inquiry and Methodological inquiry"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"The two basic forms of inquiry are philosophical inquiry (reasoning about fundamental questions) and scientific inquiry (empirical testing). Rational inquiry covers both."},{"id":"gt-22","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q22","q":"Another skeptic who advanced the the skeptical-nihilist argument that nothing exist; and if something did exist, it could not be known; and if it could not be known; it could not be communicated is __________","o":["Aristotle","Gorgias","Plato","Parmenides"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Gorgias, a Greek sophist, argued that nothing exists, that if anything did we could not know it, and that if we knew it we could not communicate it. He is the classic sceptic-nihilist."},{"id":"gt-23","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q23","q":"One of the following is not among the four analysis of Bacon's four idols","o":["Idols of the Cave","Idols of the mind","Idols of the Marketplace","Idol of the Theatre"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Bacon's four idols, the sources of error, are the Tribe, the Cave, the Marketplace and the Theatre. 'Idols of the mind' is not one of them, as all four are errors of the mind."},{"id":"gt-24","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q24","q":"In logic there are _____ basic laws of thought","o":["3","4","5","2"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"There are three basic laws of thought: identity, non-contradiction and excluded middle."},{"id":"gt-25","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q25","q":"The law of ___________ maintains that if any statement is true, then it is true.","o":["assertion","identity","positivism","contradiction"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The law of identity says a thing is itself: if a statement is true, then it is true (A is A)."},{"id":"gt-26","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q26","q":"In logic, the conclusion of an argument is  normally represented by this sign -\" :.\" what is it?","o":["Hitherto","Therefore","Then","Hence"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The three dots ∴ are the symbol for 'therefore', which introduces a conclusion."},{"id":"gt-27","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q27","q":"Awolowo is human and is mortal\nAzikiwe is human and is mortal\nOjukwu is human and is mortal\nTherefore, probably all humans are mortal.\nThe above is an example of _____________ argument.","o":["Deductive","Inductive","sound","unsound"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The conclusion generalises from three people to all humans, and is worded 'probably'. That makes it inductive: the premises support it without guaranteeing it."},{"id":"gt-28","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q28 (also GST 212 General Test Type C Q34)","q":"The conditional statement- \"If he gets the message, then he will respond\" is logically represented as _________","o":["P:Q","P>Q","P=Q","PvQ"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A conditional, 'if...then...', is symbolised with the arrow or horseshoe, written P > Q here. P=Q is the biconditional, PvQ is 'or', and P:Q is not a connective."},{"id":"gt-29","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q29","q":"Most human do not know that in denying philosophy, they are really denying their own ____________ nature","o":["intrinsic","extrinsic","obligatory","dutiful"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy comes from our intrinsic nature, the curiosity and reasoning within us. So denying philosophy means denying our own intrinsic nature."},{"id":"gt-30","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q30","q":"_________ explains the concept of justice as a metaphysical problem under universal and particulars","o":["Plato","Bertrand Russell","Aristotle","Rene Descartes"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Plato's theory of Forms treats justice as a universal, the same idea behind many particular just acts. So it is a metaphysical problem of universals and particulars."},{"id":"gt-31","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q31","q":"An argument is ___________________________","o":["a set of statement in which the premise gives full or partial justification to the conclusion","a set of statement logically arranged as a proof of evidence for discussion","a set of philosophical analysis that provides clarity on our ideas","a set of statement in which the premise gives  philosophical justification to the conclusion"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"An argument is a set of statements in which the premises give full (deductive) or partial (inductive) support to the conclusion."},{"id":"gt-32","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q32","q":"____________ as a school of thought holds that nothing exist.","o":["Non-existentialism","Nihilism","Skepticism","Objectivism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Nihilism is the view that nothing exists, or that nothing has real meaning or value. Scepticism only doubts knowledge."},{"id":"gt-33","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q33","q":"_________ claims that an action is good so far it produces the greatest happiness for the greatest number.","o":["utilitarianism","Hedonism","euchandronism","Egoism"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Utilitarianism judges an action good if it produces the greatest happiness for the greatest number."},{"id":"gt-34","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q34","q":"The following are reasons why we should live a moral life except ____________","o":["theological reasons","sociological reasons","logical reasons","law of nemesis"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Reasons for living a moral life are theological (God), sociological (society) and logical or rational. The 'law of nemesis' is not one of the standard reasons."},{"id":"gt-35","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q35","q":"Yesterday, It rained\nToday, it has rained,\nTherefore, It will rain all through December\nThe argument above is an example of ______________","o":["Inductive argument","Syllogism","Deductive argument","critical assumption"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"From past rain the argument predicts rain all December. The conclusion goes beyond the evidence and is only probable, so it is inductive."},{"id":"gt-36","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q36","q":"Critical thinking demands that you test the worldview for three element. Which of the following options is not among them?","o":["Factual adequacy","Truth","Logical coherence","Explanatory capacity"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A worldview is tested by factual adequacy, logical coherence and explanatory capacity. Truth is what we are aiming at, not one of the three tests."},{"id":"gt-37","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q37 (also GES 106 Type B Q4)","q":"One of the following is not a philosophical method.","o":["Philosophical analysis","Philosophical dialectics","Philosophical reports","Philosophical criticism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Analysis, dialectics and criticism are philosophical methods. 'Philosophical reports' is not a method."},{"id":"gt-38","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q38 (also GES 106 Type B Q8)","q":"________ takes the role of Philosophy to be that of under-labourer of science.","o":["Socrates","Ludwig Wittgenstein","Amaechi Udefi","John Locke"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"John Locke described the philosopher as an 'under-labourer' to science, clearing away confusions so science can proceed."},{"id":"gt-39","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q39 (also GES 106 Type B Q9)","q":"Psycho-physical parallelism as a theory on the mind-body problem is attributed to ________?","o":["Descartes","Sophocles","Leibniz","Anaximander"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Leibniz proposed psycho-physical parallelism: mind and body don't interact but run in parallel in pre-established harmony."},{"id":"gt-40","set":"GES 106 GENERAL TEST","ref":"GES 106 General Test 2024/25, Q40 (also GES 106 Type B Q11)","q":"________ maintains that people, in fact, always pursue their self-interests?","o":["Philosophical Egoism","Psychological Egoism","Human Egoism","Physical Egoism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Psychological egoism is the descriptive claim that people in fact always act from self-interest. Ethical egoism is the claim that they ought to."},{"id":"tb-1","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q1","q":"The following constitute ethical problems: (i) abortion, (ii) euthanasia, (iii) global warming, (iv) surrogacy.","o":["i and ii","ii and iii","All of the above","iii and iv"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Abortion, euthanasia, global warming (environmental ethics) and surrogacy are all moral issues, so all four are ethical problems. Here 'all of the above' is the one that includes all four."},{"id":"tb-2","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q2","q":"______ claims that knowledge is derived from reason.","o":["Empiricism","Rationalism","Idealism","Scepticism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Rationalism says reason is the main source of knowledge. Empiricism says experience is."},{"id":"tb-3","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q3","q":"______ is the study of Being as Being; the study of the fundamental principles of reality.","o":["Ethics","Epistemology","Metaphysics","Logic"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Metaphysics studies being as being and the fundamental principles of reality."},{"id":"tb-5","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q5","q":"Utilitarianism is a variant of ______ ethical theory.","o":["Virtue","Deontological","Teleological","Moral"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Utilitarianism is teleological (consequentialist), meaning it judges actions by their end results (the greatest good)."},{"id":"tb-7","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q7 (also GST 212 General Test Type C Q14)","q":"The statement “To be is to be perceived (Esse est percipi)”, is attributed to ______.","o":["Hegel","John Newman","George Berkeley","Edmund L. Gettier"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"'Esse est percipi' ('to be is to be perceived') is Bishop George Berkeley's idealist claim. Things exist only as perceived by a mind."},{"id":"tb-10","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q10","q":"______ is the view that God withdrew from the world after creating it.","o":["Pantheism","Abscondism","Deism","Taoism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Deism says God created the world and then withdrew, leaving it to run by its own laws. Pantheism says God is nature."},{"id":"tb-12","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q12","q":"The theory that determines the rightness and wrongness of human actions based on duty and obligation is?","o":["Ethical","Situational","Deontological","Consequentialist"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Deontological theory (from deon, duty) judges actions by duty and obligation, not by consequences."},{"id":"tb-13","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q13","q":"The question “How can I be good?” is a/an","o":["Metaphysical question","Epistemological question","Ethical question","Logical question"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"'How can I be good?' asks about right living and moral goodness, which is an ethical question."},{"id":"tb-14","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q14","q":"______ is concerned with the analysis and the meaning of ethical concepts or terms.","o":["Mentral-Ethics","Mental-Ethics","Meta-Ethics","Metal-Ethics"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Meta-ethics studies the meaning and analysis of ethical terms like 'good' and 'right'."},{"id":"tb-15","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q15 (also GST 212 General Test Type C Q21)","q":"According to ______, Philosophy is the Queen of the Sciences.","o":["Bertrand Russell","Edmund Husserl","Robert Brat","Immanuel Kant"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Kant is credited with calling philosophy the Queen of the Sciences, since it examines the foundations of all other fields."},{"id":"tb-16","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q16","q":"______ is the view that mental events are caused by physical events in the brain, but have no effects upon any physical events?","o":["Functionalism","Structuralism","Epiphenomenalism","Occasionalism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Epiphenomenalism says brain events cause mental events, but mental events cause nothing physical, like steam from an engine."},{"id":"tb-17","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q17","q":"An idealist position which maintains that there is no such thing as material object is called?","o":["Categorical Idealism","Prejudicial Idealism","Eliminative Idealism","Chauvinistic Idealism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Eliminative idealism denies material objects altogether, holding that only minds and ideas exist."},{"id":"tb-18","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q18","q":"______ is the position that nothing exists.","o":["Existentialism","Nominalism","Nihilism","Phenomenalism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Nihilism is the position that nothing exists, or nothing has meaning."},{"id":"tb-19","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q19","q":"The contention that the real things only exist in the world of forms is attributed to which philosopher?","o":["Locke","Hume","Plato","Crito"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Plato's theory of Forms says real things exist in the world of forms, and the physical world is only a shadow."},{"id":"tb-20","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q20","q":"______ maintains that only the senses provide us with reliable human knowledge.","o":["René Descartes","Benedict Spinoza","David Hume","Leibniz"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"David Hume, an empiricist, held that only the senses give reliable knowledge, and he was sceptical of knowledge beyond experience. Descartes, Spinoza and Leibniz are rationalists."},{"id":"tb-21","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q21","q":"The position that we cannot rule out the possibility of errors in knowledge claim and that it is impossible to know is______?","o":["Inductive Scepticism","Deductive Scepticism","Philosophical Scepticism","Psychological Scepticism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Philosophical scepticism says we cannot rule out errors in our knowledge claims, so certain knowledge is impossible."},{"id":"tb-22","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q22","q":"______ is that branch of philosophy that studies the ultimate constituents of reality, being and existence?","o":["Epistemology","Ethics","Metaphysics","Realism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Metaphysics studies the ultimate constituents of reality, being and existence. Realism is a position, not a branch."},{"id":"tb-23","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q23","q":"______ is the ethical theory which states that we ought to pursue our own interests.","o":["Ethical egoism","Psychological egoism","Ethical hedonism","Psychological hedonism"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Ethical egoism is normative: it says we ought to pursue our own interests. Psychological egoism says we do."},{"id":"tb-24","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q24","q":"The Archimedean point is the point of ______.","o":["reason","thinking","truth","opinion"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"The Archimedean point is a firm, certain foundation from which knowledge can be built, and in philosophy that foundation is truth (Descartes sought it in the cogito)."},{"id":"tb-25","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q25","q":"Situationism as an ethical theory is traceable to ______.","o":["Kant","Fletcher","Hume","Bacon"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Situation ethics, or situationism, was developed by Joseph Fletcher. It says the right act depends on the situation, guided by love."},{"id":"tb-26","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q26","q":"______ is the life-blood of philosophy.","o":["Mythology","criticism","Meddlesomeness","garrulousness"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Criticism is the life-blood of philosophy, since philosophy keeps questioning and testing ideas, including its own."},{"id":"tb-27","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q27","q":"Philosophy arose in ______?","o":["imagination","miracle","wonder","misery"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy arose in wonder, as Plato and Aristotle said, the amazement at the world that makes us ask questions."},{"id":"tb-28","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q28","q":"Methodological Scepticism is traceable to ______?","o":["David Hume","René Descartes","Baruch Spinoza","Thomas Hobbes"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Methodological scepticism (methodic doubt) is Descartes' method of doubting everything to find certainty."},{"id":"tb-29","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q29","q":"We can loosely say that all human beings are philosophers because they are naturally ______?","o":["selfish","violent","curious","jealous"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"All humans are loosely philosophers because we are naturally curious and ask fundamental questions."},{"id":"tb-31","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q31","q":"______ declares that \"the world would be better governed if philosopher kings become leaders or leaders take training in philosophy.\"","o":["Aquinas","Nietzsche","Plato","Ukpokolo"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Plato argued in the Republic that the world would be better governed if philosophers became kings, or kings studied philosophy."},{"id":"tb-32","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q32","q":"The activities of philosophy in other disciplines can be described as:","o":["First-Order","Fourth-Order","Third-Order","Second-Order"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy's activity in other disciplines, asking about their foundations and assumptions, is second-order. First-order questions are those within philosophy's own core subjects."},{"id":"tb-33","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q33","q":"The term “logos” means ______.","o":["Language","Logic","Theory","Principle"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"'Logos' means word, reason or principle. In this question, logic is the closest option, since logic comes from logos and means the study of reasoning."},{"id":"tb-34","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q34","q":"Philosophy as a ---- involves two major things: conceptual analysis and reconstruction of ideas.","o":["worldview","master inquirer","critical thinking","wonderful discipline"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy as critical thinking involves conceptual analysis (clarifying ideas) and reconstruction of ideas (rebuilding them better)."},{"id":"tb-35","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q35","q":"Cosmology and Ontology are branches of ______?","o":["Epidemiology","Ethics","Metaphysics","Epistemology"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Cosmology (study of the universe) and ontology (study of being) are the two subdivisions of metaphysics."},{"id":"tb-36","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q36","q":"The method of breaking down of concepts or ideas to enable proper understanding of issues at stake is called ______.","o":["Rational discourse","Discursive analysis","Conceptual analysis","Methodic doubt"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Breaking concepts down to understand the issues is conceptual analysis."},{"id":"tb-37","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q37","q":"______ is the position that human beings ought to pursue what brings pleasure?","o":["Ethical Utilitarianism","Ethical Commensalism","Ethical Hedonism","Ethical Egoism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Ethical hedonism says we ought to pursue pleasure. Utilitarianism aims at the greatest happiness of the many, and egoism at self-interest."},{"id":"tb-38","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q38","q":"Normative Ethics is also known as ______?","o":["Analytic Ethics","Prescriptive Ethics","Descriptive Ethics","Practical ethics"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Normative ethics prescribes standards of right and wrong, so it is also called prescriptive ethics. Descriptive ethics merely reports what people believe."},{"id":"tb-39","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q39","q":"What ethical theory would be considered in the discussion of the problem of abortion?","o":["Teleological theory","Deontological theory","Egoism","All of the above"],"a":"D","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Abortion can be discussed from every angle: teleological (consequences), deontological (rights and duties) and egoism (self-interest), so all of them apply."},{"id":"tb-40","set":"GES 106 TYPE B","ref":"GES 106 Type B, Q40 (also GST 212 General Test Type C Q22)","q":"An inductive argument is considered sound when ______ and ______ are present.","o":["validity and truth","long and evidential","fallacious and inductive","None of the above"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes. Less sure about this one.","e":"Among these options, a sound argument needs validity (correct form) and truth (true premises). In strict terms 'sound' belongs to deductive arguments, and a good inductive argument is called 'strong' or 'cogent'."},{"id":"ca-1","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q1","q":"What are the two Greek words from which \"philosophy\" originates, and what is its literal translation?","o":["Philo and Logos (Love of logic)","Philo and Sophia (Love of wisdom)","Sophos and Techne (Love of art)","Psyche and Sophia (Wisdom of the mind)"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy comes from philo (love) and sophia (wisdom), so it literally means 'love of wisdom'. Logos means reason, and techne means craft, so those options are wrong."},{"id":"ca-2","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q2","q":"Which philosopher is famous for stating, \"An unexamined life is not worth living\"?","o":["Plato","Aristotle","Socrates","René Descartes"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Socrates said 'the unexamined life is not worth living' at his trial, as recorded by Plato in the Apology."},{"id":"ca-3","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q3","q":"Which characteristic of philosophy refers to its focus on abstract concepts that go beyond direct empirical observation?","o":["Systematic approach","Speculative inquiry","Rationality","Universality"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The speculative function or character of philosophy reasons about things beyond direct observation, such as the nature of reality or the soul."},{"id":"ca-4","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q4","q":"Epistemology is primarily concerned with the study of:","o":["The nature, sources, and limits of knowledge","Moral values and human conduct","The ultimate structure of physical reality","Valid rules of formal argument"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Epistemology studies the nature, sources and limits of knowledge. Ethics studies morals, metaphysics studies reality and logic studies argument."},{"id":"ca-5","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q5","q":"Metaphysics is divided into which two main branches?","o":["Ethics and Aesthetics","Formal Logic and Informal Logic","Ontology and Cosmology","Normative Ethics and Meta-ethics"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Metaphysics divides into ontology (study of being) and cosmology (study of the universe's origin and structure)."},{"id":"ca-6","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q6","q":"Which branch of philosophy evaluates the rules of valid reasoning and logical structures?","o":["Epistemology","Logic","Ethics","Political Philosophy"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Logic studies the rules of valid reasoning and argument structure."},{"id":"ca-7","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q7","q":"Consider the argument: All Boko Haram captives must be tested for HIV/AIDS. Rex is a Boko Haram captive. Therefore, Rex must be tested for HIV/AIDS. What type of argument is this?","o":["Inductive argument","Deductive argument","Fallacious argument","Relational argument"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The conclusion follows necessarily from the premises: if all captives must be tested and Rex is one, he must be. That is a deductive argument."},{"id":"ca-8","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q8","q":"An inductive argument differs from a deductive argument because its premises:","o":["Guarantee the truth of the conclusion","Provide only partial support for the conclusion","Are always empirically false","Rely exclusively on symbolic truth tables"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"In an inductive argument the premises make the conclusion probable but don't guarantee it, so they give partial support. A deductive argument's premises are meant to guarantee it."},{"id":"ca-9","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q9","q":"Which sub-field of ethics seeks to clarify the meaning of moral terms and the nature of moral judgments?","o":["Normative Ethics","Applied Ethics","Meta-ethics","Virtue Ethics"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Meta-ethics analyses what moral words and judgments mean. Normative ethics sets standards, and applied ethics deals with practical issues."},{"id":"ca-10","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q10","q":"Aesthetics is the branch of philosophical inquiry focused on:","o":["Political authority and law","Art, beauty, and taste","Rules of valid logical inference","Practical medical dilemmas"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Aesthetics is the philosophy of art, beauty and taste."},{"id":"ca-11","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q11","q":"Which philosophical method involves systematic skepticism toward one's own beliefs to arrive at certainty?","o":["Dialectical Method","Methodic Doubt","Philosophical Analysis","Prescriptive Inquiry"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Methodic doubt, used by Descartes, is systematic doubting of one's beliefs in order to reach certainty."},{"id":"ca-12","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q12","q":"The philosophical function that formulates societal goals, ideals, and norms to guide human conduct is the:","o":["Analytic function","Speculative function","Prescriptive function","Empirical function"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The prescriptive (normative) function sets goals, ideals and norms for human conduct, saying what ought to be. The analytic function clarifies concepts."},{"id":"ca-13","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q13","q":"According to Bertrand Russell, the primary value of philosophy lies in its ability to:","o":["Provide definitive scientific answers","Establish religious dogmas","Expand intellectual imagination and challenge dogmatism","Eliminate abstract thinking"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"For Russell, philosophy's value lies in enlarging the mind and imagination and freeing us from dogmatism, rather than in giving final answers."},{"id":"ca-14","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q14","q":"Which philosophical problem is considered a central metaphysical debate involving thinkers like René Descartes?","o":["The problem of induction","The Mind-Body relationship","The definition of normative ethics","The validity of truth tables"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"The mind-body problem, how the non-physical mind relates to the physical body, is a central metaphysical debate and is closely linked to Descartes' dualism."},{"id":"ca-15","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q15","q":"What metaphysical view claims that consciousness and all realities are fundamentally physical?","o":["Dualism","Idealism","Materialism","Skepticism"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Materialism says everything, including consciousness, is physical. Dualism says mind and matter are separate, and idealism says reality is mental."},{"id":"ca-16","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q16","q":"Skepticism is best defined as the philosophical doctrine asserting that:","o":["Certain knowledge is impossible or unachievable","Only empirical science produces moral truth","All arguments are deductively valid","Reality is divided into mind and body"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Scepticism says certain knowledge is impossible or unreachable."},{"id":"ca-17","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q17","q":"Kwasi Wiredu is noted in the text for highlighting an African epistemological emphasis on:","o":["Individualistic rationalism","Communal and experiential sources of knowledge","Formal truth tables","Absolute skepticism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Kwasi Wiredu stressed communal and experiential sources of knowledge in African epistemology, as against purely individual reasoning."},{"id":"ca-18","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q18","q":"The ethical concept of Ubuntu is best summarised by which phrase?","o":["\"Might makes right\"","\"The greatest happiness for the greatest number\"","\"I am because we are\"","\"An unexamined life is not worth living\""],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Ubuntu means 'I am because we are': a person is a person through others, which stresses community and shared humanity."},{"id":"ca-19","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q19","q":"Which thinker is highlighted in the text for arguing that African ethical systems offer strong alternatives to Western models through their focus on harmony?","o":["Sophie Oluwole","Immanuel Kant","John Locke","Karl Marx"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Sophie Oluwole is the African philosopher in the options, and she argued for the strength of African thought. Kant, Locke and Marx are Western thinkers."},{"id":"ca-20","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q20","q":"What is the key distinction between a valid argument and a sound argument?","o":["A valid argument has true premises; a sound argument does not.","A sound argument is valid AND has true premises.","A valid argument applies only to inductive reasoning.","Soundness depends entirely on subjective opinion."],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"A valid argument has a correct form: if the premises are true, the conclusion must be. A sound argument is valid and also has actually true premises."},{"id":"ca-21","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q21","q":"Ethical Egoism is a normative theory asserting that individuals:","o":["Always act in their self-interest as a matter of fact","Ought to pursue their own self-interest","Must prioritise communal well-being over personal desire","Should follow duty regardless of outcomes"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Ethical egoism is normative, saying people ought to pursue their own self-interest. Psychological egoism is descriptive: it says they always do."},{"id":"ca-22","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q22","q":"Which moral theory evaluates the rightness of an action based on duty rather than consequences?","o":["Utilitarianism","Deontology","Ethical Subjectivism","Psychological Egoism"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Deontology judges actions by duty and rules, not outcomes (Kant). Utilitarianism judges by consequences."},{"id":"ca-23","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q23","q":"According to Aristotle, moral character is primarily developed through:","o":["Methodic doubt","Habit and practice","Political revolutions","logical proof"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Aristotle taught that moral virtue is developed by habit and practice. We become just by doing just acts."},{"id":"ca-24","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q24","q":"In political philosophy, Plato advocated for governance led by:","o":["Democratically elected citizens","Military generals","Philosopher-kings","Wealthy merchants"],"a":"C","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"In the Republic, Plato said the ideal state should be ruled by philosopher-kings, who have wisdom and know the Good."},{"id":"ca-25","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q25","q":"Which political philosopher emphasised natural rights as the foundation for political governance?","o":["Marx","John Locke","Thomas Aquinas","Friedrich Nietzsche"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"John Locke held that people have natural rights (life, liberty, property) and that government exists to protect them."},{"id":"ca-26","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q26","q":"The primary methodological difference between philosophy and religion is that:","o":["Philosophy relies on reason and critical inquiry, whereas religion relies on faith and revelation","Philosophy deals only with science, whereas religion deals only with art","Religion relies on empirical proof, whereas philosophy uses myth","Philosophy focuses exclusively on God, whereas religion rejects existential questions"],"a":"A","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Philosophy relies on reason and critical questioning, while religion rests on faith and revelation. That is the main difference in method."},{"id":"ca-27","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q27","q":"Which philosopher is known for attempting to reconcile faith and reason?","o":["Friedrich Nietzsche","Thomas Aquinas","Karl Marx","René Descartes"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Thomas Aquinas, a medieval scholastic, worked to reconcile Christian faith with reason (Aristotelian philosophy)."},{"id":"ca-28","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q28","q":"Jurisprudence represents the philosophical study of:","o":["Wealth distribution and market forces","Law, justice, and legal interpretation","Scientific methodology and causality","Educational aims and teaching methods"],"a":"B","s":"Not in your files. Answer supplied by Claude from the course content, so check it against your notes.","e":"Jurisprudence is the philosophy of law: law, justice and legal interpretation."},{"id":"ca-29","set":"GST 212 CA TEST","ref":"GST 212 CA Test, Q29","q":"The philosophy of science cr
